<style>
/* ═══════════════════════════════════════════════
   FORGE · DESIGN SYSTEM (tokens globales)
   Cambiar el tema completo = cambiar estas variables
   ═══════════════════════════════════════════════ */
:root{
  /* Tema por defecto: OSCURO · grafito con acento lima */
  --bg:#121417; --bg-2:#15181C; --surface:#1A1D22; --surface-2:#22262C; --surface-3:#2B3037;
  --line:#2A2F36; --line-2:#3A4049;
  --text:#F2F4F6; --text-2:#AEB5BD; --muted:#7A828C; --inverse:#121417;
  --accent:#C8FF3F; --accent-2:#DAFF70; --accent-soft:rgba(200,255,63,.13); --accent-ink:#0C1200; --accent-glow:rgba(200,255,63,.45);
  --good:#4FD68F; --good-soft:rgba(79,214,143,.14);
  --warn:#F2C94C; --warn-soft:rgba(242,201,76,.14);
  --bad:#FF6B6B;  --bad-soft:rgba(255,107,107,.14);
  --info:#7FB6C9;
  --ring-track:#2B3037;
  --tab-bg:rgba(26,29,34,.86); --tab-border:rgba(255,255,255,.07); --tab-ink:#B4BAC2; --tab-shadow:0 14px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 8px 24px rgba(0,0,0,.45); --shadow-glow:0 0 0 1px var(--accent-soft),0 10px 30px rgba(200,255,63,.18);
  --t-fast:140ms; --t-med:260ms; --t-slow:420ms; --ease:cubic-bezier(.2,.7,.2,1);
  --nav-h:68px; --nav-gap:12px; --safe-b:env(safe-area-inset-bottom,0px);
  --fs-xs:11px; --fs-sm:13px; --fs-md:15px; --fs-lg:17px; --fs-xl:22px; --fs-2xl:30px; --fs-3xl:44px; --fs-4xl:64px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F4F5F7; --bg-2:#EEF0F3; --surface:#FFFFFF; --surface-2:#F5F6F8; --surface-3:#EAECEF;
  --line:#E1E4E9; --line-2:#CFD4DB;
  --text:#14171C; --text-2:#4E5865; --muted:#8A93A0; --inverse:#FFFFFF;
  --accent:#7DB800; --accent-2:#8FCC0D; --accent-soft:rgba(125,184,0,.12); --accent-ink:#0C1200; --accent-glow:rgba(125,184,0,.35);
  --good:#1E9E63; --good-soft:rgba(30,158,99,.12);
  --warn:#B98A17; --warn-soft:rgba(185,138,23,.12);
  --bad:#CF3F3A;  --bad-soft:rgba(207,63,58,.12);
  --info:#2F7F97; --ring-track:#E1E4E9;
  --tab-bg:rgba(255,255,255,.88); --tab-border:rgba(0,0,0,.06); --tab-ink:#5B6470; --tab-shadow:0 14px 40px rgba(20,23,28,.14);
  --shadow-1:0 1px 2px rgba(20,23,28,.08); --shadow-2:0 8px 24px rgba(20,23,28,.10); --shadow-glow:0 0 0 1px var(--accent-soft),0 10px 30px rgba(125,184,0,.14);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:var(--fs-md);line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;width:100%;outline:none;transition:border-color var(--t-fast)}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=number]{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;line-height:1.05}
.num{font-variant-numeric:tabular-nums}
.display{font-family:var(--font-display);font-weight:600;letter-spacing:.005em;line-height:1}
.eyebrow{font-size:var(--fs-xs);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow.accent{color:var(--accent)}
.muted{color:var(--muted)} .t2{color:var(--text-2)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .acc{color:var(--accent)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── App shell ── */
#app{min-height:100vh;display:flex;flex-direction:column;width:100%;overflow-x:hidden}
html,body{overflow-x:hidden;max-width:100%}
.screen{flex:1;padding:calc(var(--sp-5) + env(safe-area-inset-top,0px)) var(--sp-4) calc(var(--nav-h) + var(--nav-gap) + var(--safe-b) + var(--sp-10));max-width:640px;width:100%;margin:0 auto;animation:fadeUp var(--t-med) var(--ease)}
.screen.wide{max-width:1240px}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* Barra inferior flotante (píldora) con acción central */
.tabbar{position:fixed;left:14px;right:14px;bottom:calc(var(--safe-b) + var(--nav-gap));height:var(--nav-h);max-width:520px;margin:0 auto;padding:0 6px;background:var(--tab-bg);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--tab-border);border-radius:999px;box-shadow:var(--tab-shadow);display:flex;align-items:stretch;z-index:50;transform:translateZ(0)}
.tabbar button{flex:1 1 0;min-width:0;height:100%;padding:0;margin:0;-webkit-appearance:none;appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--tab-ink);font-family:var(--font-body);font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;line-height:1;white-space:nowrap;position:relative;transition:color var(--t-fast)}
.tabbar button svg{width:24px;height:24px;fill:currentColor;stroke:none;display:block;flex:none;transition:transform var(--t-fast),filter var(--t-fast)}
.tabbar button span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;line-height:1}
.tabbar button::after{content:"";position:absolute;bottom:7px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);opacity:0;transform:scale(.4);transition:opacity var(--t-fast),transform var(--t-fast)}
.tabbar button.on{color:var(--accent)}
.tabbar button.on::after{opacity:1;transform:none}
.tabbar button.on svg{filter:drop-shadow(0 0 8px var(--accent-glow))}
.tabbar button:active svg{transform:scale(.9)}
.tabbar button.center{overflow:visible}
.tabbar button.center .orb{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-34px;box-shadow:0 0 0 6px var(--bg),0 0 26px var(--accent-glow),0 10px 22px rgba(0,0,0,.4);transition:transform var(--t-fast),box-shadow var(--t-fast)}
.tabbar button.center .orb svg{width:30px;height:30px;filter:none}
.tabbar button.center span{color:var(--tab-ink)}
.tabbar button.center.on span{color:var(--accent)}
.tabbar button.center::after{display:none}
.tabbar button.center:active .orb{transform:scale(.92)}
.tabbar .brand{display:none}
/* Cabecera de pantalla */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-5)}
.head h1{font-size:clamp(22px,7.2vw,30px);text-transform:uppercase;overflow-wrap:normal;hyphens:none}.head > div{min-width:0;flex:1}.head > .row,.head > .ringbtn,.head > .iconbtn,.head > .btn{flex:none}
.head .sub{color:var(--text-2);font-size:var(--fs-sm);margin-top:2px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-size:var(--fs-sm);font-weight:500;margin-bottom:var(--sp-4);padding:6px 0}
.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Superficies */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-5)}
.panel.tight{padding:var(--sp-4)}
.panel + .panel,.section + .section{margin-top:var(--sp-4)}
.section{margin-top:var(--sp-6)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:var(--sp-3)}.section-title h2{flex:1;min-width:0}.section-title .eyebrow,.section-title .btn{flex:none;white-space:nowrap;text-align:right}
.section-title h2{font-size:var(--fs-xl);text-transform:uppercase}
.section-title .eyebrow{margin-bottom:2px}
.row{display:flex;align-items:center;gap:var(--sp-3)}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:var(--sp-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3)}
.divider{height:1px;background:var(--line);margin:var(--sp-4) 0}
.list{display:flex;flex-direction:column}
.list > *{padding:14px 0;border-bottom:1px solid var(--line)}
.list > *:last-child{border-bottom:0}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:var(--r-md);font-weight:600;font-size:var(--fs-md);letter-spacing:.02em;transition:transform var(--t-fast) var(--ease),background var(--t-fast),opacity var(--t-fast);user-select:none;min-height:48px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-glow)}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:var(--surface-2);border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{border-color:var(--line-2)}
.btn.quiet{background:transparent;color:var(--text-2);padding:10px 12px;min-height:40px}
.btn.danger{background:var(--bad-soft);color:var(--bad);border:1px solid transparent}
.btn.good{background:var(--good);color:#06110B}
.btn.block{width:100%}
.btn.big{padding:18px 24px;font-size:var(--fs-lg);border-radius:var(--r-lg)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:var(--fs-sm);border-radius:var(--r-sm)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.display{font-family:var(--font-display);font-size:clamp(17px,5vw,22px);letter-spacing:.04em;text-transform:uppercase;white-space:normal;line-height:1.1;text-align:center}
.iconbtn{width:40px;height:40px;border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--line);color:var(--text-2)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* Chips / pills */
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);white-space:nowrap}
.chip.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.demo{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:4px;gap:4px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-size:var(--fs-sm);font-weight:600;color:var(--muted);transition:all var(--t-fast);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:10px 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface-2);font-size:var(--fs-sm);font-weight:500;color:var(--text-2);transition:all var(--t-fast)}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* Componentes: MetricCard */
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;min-width:0}
.metric .label{font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.metric .value{font-family:var(--font-display);font-size:var(--fs-2xl);font-weight:600;line-height:1;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}.grid3 .metric .value{font-size:var(--fs-xl)}.grid3 .metric .value small{font-size:var(--fs-sm)}.grid3 .metric{padding:12px 12px}
.metric .value small{font-size:var(--fs-md);color:var(--text-2);font-family:var(--font-body);font-weight:500;margin-left:3px}
.metric .delta{font-size:var(--fs-sm);margin-top:6px;font-variant-numeric:tabular-nums;font-weight:500}
.metric.flat{background:transparent;border:0;padding:0}
/* ProgressBar */
.bar{height:6px;background:var(--ring-track);border-radius:var(--r-pill);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:var(--r-pill);transition:width var(--t-slow) var(--ease)}
.bar.thick{height:10px}
.bar.good > i{background:var(--good)}
/* ProgressRing */
.ring{position:relative;display:inline-grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .track{stroke:var(--ring-track)}
.ring .fill{stroke:var(--accent);transition:stroke-dashoffset var(--t-slow) var(--ease)}
.ring.good .fill{stroke:var(--good)}
.ring .inner{position:absolute;text-align:center}
.ring .inner b{display:block;font-family:var(--font-display);font-size:var(--fs-xl);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.ring .inner span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Tarjetas de HOY */
.hero{background:linear-gradient(160deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--line);border-radius:var(--r-xl);padding:var(--sp-6) var(--sp-5);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,var(--accent-soft),transparent 70%);pointer-events:none}
.hero .big{font-family:var(--font-display);font-size:var(--fs-3xl);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.005em}
.today-card{display:flex;align-items:center;gap:var(--sp-4);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-4) var(--sp-5);cursor:pointer;transition:border-color var(--t-fast),transform var(--t-fast)}
.today-card:active{transform:scale(.99)}
.today-card:hover{border-color:var(--line-2)}
.today-card .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);flex:none;color:var(--text-2)}
.today-card .ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.today-card .ico.accent{background:var(--accent-soft);color:var(--accent)}
.today-card .ico.good{background:var(--good-soft);color:var(--good)}
.today-card .body{flex:1;min-width:0}
.today-card .t{font-family:var(--font-display);font-size:var(--fs-xl);font-weight:600;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.today-card .s{color:var(--text-2);font-size:var(--fs-sm);margin-top:2px}
.today-card .r{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-display);font-size:var(--fs-xl);font-weight:600}
.today-card .r small{display:block;font-family:var(--font-body);font-size:var(--fs-xs);color:var(--muted);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.banner{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px 12px;background:var(--warn-soft);border:1px solid transparent;border-radius:var(--r-md);padding:12px 14px;font-size:var(--fs-sm);color:var(--text)}
.banner.info{background:var(--accent-soft)}
.banner.good{background:var(--good-soft)}
.banner > span{min-width:0}.banner.col{grid-template-columns:1fr}.banner.col .btn{justify-self:start}.banner .chip{vertical-align:middle;margin-right:6px}.banner .btn{white-space:nowrap}

/* Modo entrenamiento */
.session{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;animation:fadeUp var(--t-med) var(--ease)}
.session .top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 10px}
.session .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px;gap:10px}
.session .ex-name{font-family:var(--font-display);font-size:var(--fs-2xl);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.session .huge{font-family:var(--font-display);font-size:96px;font-weight:700;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.session .huge small{font-size:32px;color:var(--text-2);font-weight:600;margin-left:6px}
.session .reps{font-family:var(--font-display);font-size:var(--fs-2xl);font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
.session .bottom{padding:12px 18px calc(var(--safe-b) + 20px);display:flex;flex-direction:column;gap:10px;max-width:520px;width:100%;margin:0 auto}
.stepper{display:flex;align-items:center;justify-content:center;gap:10px}
.stepper button{width:56px;height:56px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--font-display);font-size:24px;font-weight:600;color:var(--text)}
.stepper button:active{transform:scale(.94)}
.stepper .val{min-width:120px;text-align:center}
.setdots{display:flex;gap:6px;justify-content:center}
.setdots i{width:26px;height:5px;border-radius:3px;background:var(--surface-3)}
.setdots i.done{background:var(--good)}
.setdots i.cur{background:var(--accent)}
.rest .huge{color:var(--accent)}
.rpe-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.rpe-grid button{padding:14px 0;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--font-display);font-size:22px;font-weight:600}
.rpe-grid button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rir-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.rir-grid button{padding:14px 0;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--font-display);font-size:22px;font-weight:600}
.rir-grid button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.exlist{display:flex;flex-direction:column;gap:8px}
.exrow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.exrow .n{flex:1;min-width:0}
.exrow .n b{display:block;font-weight:600}
.exrow .n span{font-size:var(--fs-sm);color:var(--text-2);display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.exrow .w{font-family:var(--font-display);font-size:var(--fs-xl);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.exrow .w small{display:block;font-family:var(--font-body);font-size:var(--fs-xs);color:var(--muted);font-weight:500}
.exrow.done{border-color:var(--good);opacity:.85}
.exrow .idx{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:var(--fs-xs);font-weight:600;color:var(--muted);flex:none}
.exrow.done .idx{background:var(--good-soft);color:var(--good)}

/* Nutrición */
.meal{display:flex;gap:14px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.meal .thumb{width:64px;height:64px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:28px;background:var(--surface-2);position:relative;overflow:hidden}
.meal .thumb img,.recipe-hero img,.photo-slot img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.meal.eaten .thumb.has::after{inset:auto 4px 4px auto;width:20px;height:20px;border-radius:50%;font-size:12px}
.recipe-hero{overflow:hidden;position:relative}
.free-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.free-item:last-child{border-bottom:0}.free-item input{width:80px;padding:8px 10px;text-align:right}
.results{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);margin-top:6px}.results button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:var(--fs-sm)}.results button:last-child{border-bottom:0}.results button span{color:var(--muted);font-variant-numeric:tabular-nums}
.warm .huge{color:var(--text-2)}
.meal .thumb::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.06),transparent)}
.meal .body{flex:1;min-width:0}
.meal .type{font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.meal .name{font-weight:600;margin-top:2px;line-height:1.25}
.meal .macros{font-size:var(--fs-sm);color:var(--text-2);margin-top:4px;font-variant-numeric:tabular-nums}
.meal .acts{display:flex;flex-direction:column;gap:6px;flex:none}
.meal.eaten{border-color:var(--good)}
.meal.eaten .thumb::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;background:rgba(79,191,138,.85);color:#06110B;font-weight:700;font-size:26px}
.macro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macro{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 8px;text-align:center}
.macro b{display:block;font-family:var(--font-display);font-size:var(--fs-xl);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.macro span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.macro .bar{margin-top:8px;height:4px}
.daytabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.daytabs::-webkit-scrollbar{display:none}
.daytabs{justify-content:space-between}.daytabs button{flex:1 0 42px;max-width:52px;padding:8px 0;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);text-align:center}
.daytabs button b{display:block;font-family:var(--font-display);font-size:18px;line-height:1}
.daytabs button span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.daytabs button.on{background:var(--accent-soft);border-color:var(--accent)}
.daytabs button.on b{color:var(--accent)}
.daytabs button.today{box-shadow:inset 0 -2px 0 var(--accent)}
.water{display:flex;align-items:center;gap:14px}
.water .cups{display:flex;gap:5px;flex-wrap:wrap}
.water .cups i{width:16px;height:22px;border-radius:4px 4px 6px 6px;background:var(--surface-3);border:1px solid var(--line)}
.water .cups i.on{background:var(--info);border-color:transparent}
.shop-group{margin-top:var(--sp-4)}
.shop-group h3{font-size:var(--fs-lg);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.shop-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.shop-item:last-child{border-bottom:0}
.shop-item .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;transition:all var(--t-fast)}
.shop-item.on .box{background:var(--good);border-color:var(--good);color:#06110B}
.shop-item.on span{text-decoration:line-through;color:var(--muted)}
.shop-item .q{margin-left:auto;color:var(--text-2);font-variant-numeric:tabular-nums;font-size:var(--fs-sm)}
.recipe-hero{height:180px;border-radius:var(--r-lg);display:grid;place-items:center;font-size:72px;background:linear-gradient(160deg,var(--surface-2),var(--surface-3));border:1px solid var(--line)}
.ingr{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:var(--fs-sm)}
.ingr:last-child{border-bottom:0}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{list-style:none;display:flex;gap:12px;font-size:var(--fs-sm);color:var(--text-2)}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:8px;background:var(--surface-2);color:var(--text);display:grid;place-items:center;font-weight:600;font-size:var(--fs-xs);flex:none}

/* Gráficos */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis text{fill:var(--muted);font-size:13px;font-family:var(--font-body)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .raw{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:2 3}
.chart .area{fill:url(#fgrad);opacity:.9}
.chart .dot{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.chart .dot.raw{fill:var(--muted);r:2.2;stroke-width:0}
.chart .goal{stroke:var(--good);stroke-dasharray:4 4;stroke-width:1.2}
.chart .goal-t{fill:var(--good);font-size:12px}
.chart-wrap{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--surface-3);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font-size:var(--fs-xs);white-space:nowrap;transform:translate(-50%,-110%);display:none;font-variant-numeric:tabular-nums;box-shadow:var(--shadow-2);z-index:5}
.legend{display:flex;gap:14px;font-size:var(--fs-xs);color:var(--text-2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:2px;background:var(--accent);vertical-align:middle;margin-right:5px}
.legend i.raw{background:var(--muted);height:1px}
.legend i.goal{background:var(--good)}

/* Fotos */
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.photo-slot{aspect-ratio:3/4;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line-2);display:grid;place-items:center;text-align:center;color:var(--muted);font-size:var(--fs-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;overflow:hidden;cursor:pointer;position:relative}
.photo-slot img{width:100%;height:100%;object-fit:cover;display:block}
.photo-slot.has{border-style:solid}
.compare{position:relative;aspect-ratio:3/4;}.compare.none{aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden;background:var(--surface-2);border:1px solid var(--line);user-select:none;touch-action:none}
.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.compare .after{clip-path:inset(0 0 0 var(--cut,50%))}
.compare .handle{position:absolute;top:0;bottom:0;left:var(--cut,50%);width:2px;background:#fff;transform:translateX(-1px);box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.compare .handle::after{content:"◂ ▸";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#111;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700;letter-spacing:.05em}
.compare .tag{position:absolute;top:10px;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.compare .tag.l{left:10px}.compare .tag.r{right:10px}
.compare .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:var(--fs-sm);padding:20px;text-align:center}

/* Marcas */
.pr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-4)}
.pr .grid3 > div b{display:block;font-family:var(--font-display);font-size:var(--fs-xl);font-weight:600;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}.pr .grid3 > div b small{font-family:var(--font-body);font-size:var(--fs-xs);color:var(--text-2);font-weight:500;margin-left:3px}
.pr .grid3 > div span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:4px 0}
.calday{aspect-ratio:1;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.calday.off{opacity:.3;cursor:default}
.calday.today{border-color:var(--accent);color:var(--accent);font-weight:600}
.calday.sel{background:var(--accent-soft);border-color:var(--accent)}
.calday .marks{display:flex;gap:2px}
.calday .marks i{width:5px;height:5px;border-radius:50%}
.calday .marks i.w{background:var(--accent)} .calday .marks i.n{background:var(--good)} .calday .marks i.p{background:var(--info)} .calday .marks i.f{background:var(--warn)} .calday .marks i.s{background:var(--text-2)}

/* Logros */
.ach{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.ach .badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);border:1px solid var(--line)}
.ach .badge svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.ach.on .badge{background:var(--accent-soft);border-color:var(--accent)}
.ach.on .badge svg{color:var(--accent)}
.ach b{display:block;font-weight:600}
.ach span{font-size:var(--fs-sm);color:var(--text-2)}
.ach:not(.on){opacity:.55}

/* Notificaciones */
.notif{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.notif:last-child{border-bottom:0}
.notif .body{flex:1;min-width:0}
.notif .body b{display:block;font-weight:600;font-size:var(--fs-sm)}
.notif .body span{font-size:var(--fs-xs);color:var(--text-2)}
.notif input[type=time]{width:auto;padding:6px 8px;font-size:var(--fs-sm)}
.toggle{width:46px;height:26px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line);position:relative;flex:none;transition:background var(--t-fast)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--text-2);transition:transform var(--t-fast),background var(--t-fast)}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(20px);background:var(--accent-ink)}

/* Iconos circulares con halo (estilo avisos) */
.ring-ico{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--accent);background:radial-gradient(closest-side,rgba(200,255,63,.10),transparent 80%),var(--surface-2);border:1.5px solid rgba(200,255,63,.45);box-shadow:0 0 14px rgba(200,255,63,.18)}
.ring-ico svg{width:24px;height:24px;fill:currentColor;stroke:none;display:block}
.ring-ico.sm{width:40px;height:40px}.ring-ico.sm svg{width:18px;height:18px}
.ring-ico.xl{width:64px;height:64px}.ring-ico.xl svg{width:30px;height:30px}
.ring-ico.blue{color:#9CC4FF;border-color:rgba(156,196,255,.45);box-shadow:0 0 14px rgba(156,196,255,.18);background:radial-gradient(closest-side,rgba(156,196,255,.10),transparent 80%),var(--surface-2)}
.ring-ico.red{color:#FF5C5C;border-color:rgba(255,92,92,.5);box-shadow:0 0 14px rgba(255,92,92,.22);background:radial-gradient(closest-side,rgba(255,92,92,.12),transparent 80%),var(--surface-2)}
.ring-ico.muted{color:var(--text-2);border-color:var(--line-2);box-shadow:none;background:var(--surface-2)}
.ring-ico.done{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);box-shadow:0 0 14px var(--accent-glow)}
/* Tarjeta de aviso */
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center;padding:14px 14px 14px 16px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent),var(--surface);border:1px solid var(--line);position:relative}
.alert .ring-ico{grid-row:1/3}
.alert .cat{font-size:var(--fs-xs);letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.alert.blue .cat{color:#9CC4FF}.alert.red .cat{color:#FF5C5C}.alert.red{border-color:rgba(255,92,92,.35)}
.alert .ttl{font-weight:600;font-size:var(--fs-lg);line-height:1.2;margin-top:2px}
.alert .sub{color:var(--text-2);font-size:var(--fs-sm);margin-top:2px}
.alert .side{display:flex;align-items:center;gap:8px;align-self:start}
.alert .when{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.alert .x{width:30px;height:30px;border-radius:50%;background:var(--surface-3);color:var(--text-2);display:grid;place-items:center;border:1px solid var(--line-2)}
.alert .x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.alert .act{grid-column:2/4;justify-self:end;margin-top:4px}
.alert .prog{grid-column:2/4;display:flex;align-items:center;gap:10px;margin-top:6px}
.alert .prog .bar{flex:1;height:8px}
.alert.read{opacity:.75}
.btn.pill{border-radius:999px;padding:10px 16px;min-height:40px;font-size:var(--fs-sm)}
.btn.pill svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.btn.pill.red{background:var(--bad-soft);color:var(--bad);border:1px solid rgba(255,92,92,.4)}
.badge{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
/* Filas de «HOY» (lista tipo agenda) */
.agenda{display:flex;flex-direction:column}
.agenda .arow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.agenda .arow:last-child{border-bottom:0}
.agenda .arow .b{flex:1;min-width:0}
.agenda .arow .b b{display:block;font-weight:600;font-size:var(--fs-md)}
.agenda .arow .b span{display:block;font-size:var(--fs-sm);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agenda .arow .r{font-variant-numeric:tabular-nums;color:var(--text-2);font-size:var(--fs-sm);text-align:right;flex:none}
/* Tarjeta de progreso semanal con anillo */
.weekcard{display:flex;align-items:center;gap:18px}
.weekcard .stats{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.weekcard .stats > div{display:flex;align-items:center;gap:10px}
.weekcard .stats svg{width:18px;height:18px;fill:var(--accent);flex:none}
.weekcard .stats b{display:block;font-family:var(--font-display);font-size:var(--fs-lg);line-height:1;font-variant-numeric:tabular-nums}
.weekcard .stats span{font-size:var(--fs-xs);color:var(--muted)}
.quote{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:20px 22px;background:linear-gradient(120deg,#1b2a10 0%,#151a1d 55%,#1a1d22 100%);border:1px solid var(--line);font-family:var(--font-display);font-size:var(--fs-xl);font-weight:600;color:var(--text);letter-spacing:.01em}
.quote::after{content:"";position:absolute;inset:auto -30px -50px auto;width:160px;height:160px;border-radius:50%;background:radial-gradient(closest-side,rgba(200,255,63,.18),transparent 70%)}
:root[data-theme="light"] .quote{background:linear-gradient(120deg,#EAF5D3,#F5F6F8 60%)}
/* Cabecera héroe de entrenamiento */
.hero-train{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:120px 22px 22px;background:radial-gradient(120% 90% at 80% 0%,rgba(200,255,63,.22),transparent 55%),linear-gradient(180deg,#161a1e,#111417);border:1px solid var(--line)}
.hero-train::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 14px);pointer-events:none}
.hero-train .ttl{font-family:var(--font-display);font-size:var(--fs-3xl);font-weight:700;text-transform:uppercase;line-height:.95}
:root[data-theme="light"] .hero-train{background:radial-gradient(120% 90% at 80% 0%,rgba(125,184,0,.22),transparent 55%),linear-gradient(180deg,#f8f9fb,#eef0f3)}
/* Anillos dobles nutrición */
.rings2{display:flex;justify-content:space-around;align-items:center;padding:6px 0 2px}
.rings2 .ring .inner b{font-size:var(--fs-2xl)}
.rings2 .ring .inner span{display:block;margin-top:2px}
.rings2 .lbl{text-align:center;font-size:var(--fs-xs);color:var(--muted);margin-top:8px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.mbar{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;font-size:var(--fs-sm);padding:8px 0}
.mbar .bar{grid-column:1/4;height:6px}
.mbar .v{font-variant-numeric:tabular-nums;color:var(--text-2)}.mbar .p{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;min-width:38px;text-align:right}
.fab{position:fixed;right:20px;bottom:calc(var(--nav-h) + var(--nav-gap) + var(--safe-b) + 14px);width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 0 22px var(--accent-glow),0 10px 22px rgba(0,0,0,.4);z-index:45}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
/* Tiles y pestañas de sesión */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.tile span{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile b{display:block;font-family:var(--font-display);font-size:var(--fs-xl);font-weight:600;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.tile.act{cursor:pointer}.tile.act:active{transform:scale(.97)}
.rest-ctl{display:flex;align-items:center;justify-content:center;gap:22px}
.rest-ctl .rb{width:56px;height:56px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-2);color:var(--text);font-size:var(--fs-sm);font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.rest-ctl .rb.main{width:72px;height:72px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 0 22px var(--accent-glow)}
.rest-ctl .rb svg{width:26px;height:26px;fill:currentColor;stroke:none}
.session .ring .fill{transition:stroke-dashoffset 1s linear}
/* Perfil */
.avatar{width:84px;height:84px;border-radius:50%;background:var(--surface-2);border:2px solid var(--accent);box-shadow:0 0 22px var(--accent-glow);display:grid;place-items:center;font-family:var(--font-display);font-size:34px;font-weight:700;color:var(--accent);margin:0 auto}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:4px 14px}
.menu .mrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:var(--fs-md)}
.menu .mrow:last-child{border-bottom:0}
.menu .mrow .mi{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--text-2);flex:none}
.menu .mrow .mi svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu .mrow .ml{flex:1;min-width:0}.menu .mrow .mv{color:var(--muted);font-size:var(--fs-sm);white-space:nowrap}
.menu .mrow .chev{color:var(--muted)}.menu .mrow .chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.menu .mrow.danger{color:var(--bad)}.menu .mrow.danger .mi{color:var(--bad);background:var(--bad-soft)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 8px}
.stat3 > div{text-align:center;border-right:1px solid var(--line)}.stat3 > div:last-child{border-right:0}
.stat3 b{display:block;font-family:var(--font-display);font-size:var(--fs-2xl);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat3 span{font-size:var(--fs-xs);color:var(--muted)}
/* Recetas: rejilla */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer}
.rcard .ph{height:110px;display:grid;place-items:center;font-size:44px;background:linear-gradient(160deg,var(--surface-2),var(--surface-3))}
.rcard .rb{padding:10px 12px}.rcard .rb b{display:block;font-size:var(--fs-sm);font-weight:600;line-height:1.25}.rcard .rb span{font-size:var(--fs-xs);color:var(--muted)}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{padding:10px 2px;font-weight:600;font-size:var(--fs-sm);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.ringbtn{position:relative;width:40px;height:40px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--text-2)}
.ringbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
/* Restyle: recetas, compra, marcas, calendario, logros, notificaciones, sesión */
.recipe-hero{height:190px;border-radius:var(--r-xl);display:grid;place-items:center;font-size:84px;background:radial-gradient(120% 90% at 80% 0%,rgba(200,255,63,.20),transparent 55%),linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line)}
.shop-item{padding:12px 0}.shop-item .box{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2)}
.shop-item.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 10px var(--accent-glow)}
.shop-group h3{display:flex;align-items:center;gap:8px;font-size:var(--fs-lg);margin:14px 0 4px}
.pr{border-radius:22px;padding:16px}
.pr .grid3 > div b{font-size:var(--fs-xl)}
.calday{border-radius:12px;font-weight:500}.calday.today{box-shadow:0 0 10px var(--accent-glow)}.calday.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.calday.sel .marks i{background:var(--accent-ink)!important;opacity:.6}
.ach{border-radius:20px;padding:14px 16px}.ach .badge{width:52px;height:52px;border-radius:50%}
.ach.on{border-color:rgba(200,255,63,.35)}
.notif{gap:12px;padding:14px 0}.notif .body b{font-size:var(--fs-md)}
.toggle{width:50px;height:30px}.toggle::after{width:22px;height:22px}.toggle.on::after{transform:translateX(20px)}
.session .tiles .tile{padding:10px 6px}.tile .stp{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.tile .stp button{width:38px;height:38px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--text)}
.tile .stp button:active{transform:scale(.94)}
.rpe-grid button,.rir-grid button{border-radius:14px}
.feel-grid button{border-radius:18px}.feel-grid button.on{box-shadow:0 0 14px var(--accent-glow)}
.onb .progress i.on{box-shadow:0 0 8px var(--accent-glow)}
.week-row > div{border-radius:14px}.week-row > div.done{background:var(--accent-soft)}.week-row > div.today{box-shadow:0 0 10px var(--accent-glow)}
.exrow{border-radius:18px;padding:12px 14px}
.metric{border-radius:18px}
.today-card{border-radius:22px}
/* Estados */
.empty{text-align:center;padding:var(--sp-8) var(--sp-4);color:var(--text-2);font-size:var(--fs-sm)}
.empty .display{font-size:var(--fs-xl);color:var(--text);text-transform:uppercase;margin-bottom:6px}
.skeleton{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:pulse 1.4s infinite;border-radius:8px;height:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--nav-gap) + var(--safe-b) + 18px);transform:translateX(-50%);background:var(--tab-bg);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(200,255,63,.45);color:var(--text);padding:10px 18px;border-radius:999px;font-size:var(--fs-sm);font-weight:600;box-shadow:var(--shadow-2);z-index:100;max-width:calc(100% - 32px);animation:fadeUp var(--t-med) var(--ease);display:block;text-align:center;line-height:1.35}
.toast.good{border-color:var(--accent);color:var(--accent)} .toast.bad{border-color:var(--bad);color:var(--bad)}
.offline{position:fixed;top:0;padding-top:calc(4px + env(safe-area-inset-top,0px));left:0;right:0;background:var(--warn);color:#1a1200;font-size:var(--fs-xs);font-weight:600;text-align:center;padding:4px;z-index:120;letter-spacing:.08em;text-transform:uppercase}

/* Modal / hoja inferior */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:flex-end;justify-content:center;animation:fadeUp var(--t-fast)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:var(--sp-5) var(--sp-5) calc(var(--safe-b) + var(--sp-6));width:100%;max-width:640px;max-height:88vh;overflow:auto;animation:sheetUp var(--t-med) var(--ease)}
@keyframes sheetUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto var(--sp-4)}
.sheet h2{font-size:var(--fs-xl);text-transform:uppercase;margin-bottom:var(--sp-3)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field .err{color:var(--bad);font-size:var(--fs-xs)}
.bigin{font-family:var(--font-display);font-size:var(--fs-4xl);font-weight:700;text-align:center;background:transparent;border:0;border-bottom:2px solid var(--line-2);border-radius:0;padding:8px;font-variant-numeric:tabular-nums}
.bigin:focus{border-color:var(--accent)}

/* Onboarding */
.onb{width:100%;max-width:520px;margin:0 auto;overflow-x:hidden;overflow-wrap:anywhere;padding:calc(env(safe-area-inset-top,0px) + 32px) 20px 40px;min-height:100vh;display:flex;flex-direction:column}
.onb .progress{display:flex;gap:4px;margin-bottom:28px}
.onb .progress i{flex:1;height:3px;border-radius:2px;background:var(--surface-3)}
.onb .progress i.on{background:var(--accent)}
.onb h1{font-size:clamp(30px,9vw,44px);text-transform:uppercase;margin-bottom:6px}
.onb .lead{color:var(--text-2);margin-bottom:24px}
.onb .foot{margin-top:auto;padding-top:24px;display:flex;gap:10px;align-items:stretch}.onb .foot .btn{white-space:nowrap}.onb .foot .btn.ghost{flex:0 0 auto;padding-left:22px;padding-right:22px}.onb .foot .btn.block{flex:1 1 auto;width:auto}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;letter-spacing:.22em;font-size:var(--fs-lg);text-transform:uppercase}
.logo img{width:36px;height:36px;border-radius:9px;box-shadow:0 0 12px var(--accent-glow)}
.logo i{display:none}
.applogo{width:120px;height:120px;border-radius:28px;box-shadow:0 0 40px var(--accent-glow),0 20px 40px rgba(0,0,0,.5);display:block;margin:0 auto}

/* Semana */
.week-row{display:flex;gap:6px}
.week-row > div{flex:1;text-align:center;padding:10px 4px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.week-row > div b{display:block;font-family:var(--font-display);font-size:var(--fs-lg);line-height:1}
.week-row > div span{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.week-row > div.done{border-color:var(--good)} .week-row > div.done b{color:var(--good)}
.week-row > div.today{border-color:var(--accent)}
.feel-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.feel-grid button{padding:14px 4px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-size:var(--fs-xs);font-weight:600;color:var(--text-2)}
.feel-grid button span{display:block;font-size:26px;margin-bottom:4px}
.feel-grid button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* ── Escritorio ── */
@media (min-width:1024px){
  body{padding-left:220px}
  .tabbar{left:0;top:0;bottom:0;right:auto;width:220px;max-width:none;height:100vh;margin:0;border-radius:0;border:0;border-right:1px solid var(--line);box-shadow:none;background:var(--bg-2);-webkit-backdrop-filter:none;backdrop-filter:none;flex-direction:column;align-items:stretch;padding:24px 12px;gap:4px;justify-content:flex-start}
  .tabbar .brand{display:block;padding:8px 12px 28px}
  .tabbar button{flex:none;height:auto;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;border-radius:12px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
  .tabbar button::after{display:none}
  .tabbar button.on{background:var(--accent-soft)}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button.center .orb{width:auto;height:auto;margin:0;background:none;color:inherit;box-shadow:none;border-radius:0;display:block}
  .tabbar button.center .orb svg{width:22px;height:22px}
  .tabbar button.center span{color:inherit}
  .tabbar button[data-tab="hoy"]{order:1}.tabbar button[data-tab="entrenar"]{order:2}.tabbar button[data-tab="nutricion"]{order:3}.tabbar button[data-tab="progreso"]{order:4}.tabbar button[data-tab="perfil"]{order:5}
  .screen{padding:40px 40px 60px;max-width:1240px}
  .desk-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
  .desk-grid > .c6{grid-column:span 6} .desk-grid > .c4{grid-column:span 4} .desk-grid > .c3{grid-column:span 3} .desk-grid > .c8{grid-column:span 8} .desk-grid > .c12{grid-column:span 12}
  .session .huge{font-size:140px}
  .sheet{border-radius:var(--r-xl);margin-bottom:8vh}
  .sheet-bg{align-items:center}
}

</style>

<script>
/* ═══════════════════════════════════════════════
   FORGE · UTILIDADES, VALIDACIÓN Y CAPA DE DATOS
   ═══════════════════════════════════════════════ */
(function () {
  const C = FORGE.CONFIG;

  /* ── Utilidades ── */
  const U = FORGE.U = {
    uid: () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    pad: n => String(n).padStart(2, '0'),
    iso(d) { d = d instanceof Date ? d : new Date(d); return d.getFullYear() + '-' + U.pad(d.getMonth() + 1) + '-' + U.pad(d.getDate()); },
    today: () => U.iso(new Date()),
    parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); },
    addDays(s, n) { const d = U.parse(s); d.setDate(d.getDate() + n); return U.iso(d); },
    diffDays: (a, b) => Math.round((U.parse(b) - U.parse(a)) / 864e5),
    dow: s => U.parse(s).getDay(),
    mondayOf(s) { const d = U.parse(s); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return U.iso(d); },
    fmtDate(s, long) { const d = U.parse(s); return long ? `${C.DOW_LONG[d.getDay()]} ${d.getDate()} de ${C.MONTHS[d.getMonth()].toLowerCase()}` : `${d.getDate()} ${C.MONTHS[d.getMonth()].slice(0, 3).toLowerCase()}`; },
    // Formato español con separador de miles siempre (1.234,5)
    n(v, dec = 1) { if (v == null || isNaN(v)) return '—'; return Number(v).toLocaleString('de-DE', { minimumFractionDigits: dec, maximumFractionDigits: dec }); },
    int: v => (v == null || isNaN(v)) ? '—' : Math.round(v).toLocaleString('de-DE'),
    kg(v) { if (v == null || isNaN(v)) return '—'; const d = Math.abs(v - Math.round(v)) < 1e-9 ? 0 : Math.abs(v * 10 - Math.round(v * 10)) < 1e-9 ? 1 : 2; return U.n(v, d) + ' kg'; },
    sign(v, dec = 1, unit = '') { if (v == null || isNaN(v)) return '—'; const s = v > 0 ? '+' : v < 0 ? '−' : '±'; return s + U.n(Math.abs(v), dec) + unit; },
    pct: v => v == null || isNaN(v) ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + U.n(Math.abs(v), 1) + '%',
    clamp: (v, a, b) => Math.min(b, Math.max(a, v)),
    round: (v, step) => Math.round(v / step) * step,
    avg: a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null,
    sum: a => a.reduce((x, y) => x + y, 0),
    esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
    // Generador pseudoaleatorio con semilla (menús reproducibles por semana)
    rng(seed) { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; },
    shuffle(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
    debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
  };

  /* ── Validación ── */
  const L = C.LIMITS;
  const range = (v, [a, b], label, unit = '') => {
    if (v === '' || v == null || isNaN(v)) return { ok: false, msg: `Introduce ${label}.` };
    v = Number(v);
    if (v < a) return { ok: false, msg: `${label} no puede ser menor de ${U.n(a, 0)}${unit}.` };
    if (v > b) return { ok: false, msg: `${label} no puede ser mayor de ${U.n(b, 0)}${unit}.` };
    return { ok: true, value: v };
  };
  FORGE.validate = {
    weight: v => range(v, L.weight, 'el peso', ' kg'),
    height: v => range(v, L.height, 'la altura', ' cm'),
    age: v => range(v, L.age, 'la edad', ' años'),
    measure: v => v === '' || v == null ? { ok: true, value: null } : range(v, L.measure, 'la medida', ' cm'),
    reps: v => range(v, L.reps, 'las repeticiones'),
    load: v => range(v, L.load, 'la carga', ' kg'),
    steps: v => range(v, L.steps, 'los pasos'),
    cardioMin: v => range(v, L.cardioMin, 'los minutos'),
    water: v => range(v, L.water, 'el agua', ' L'),
    date(s) { if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return { ok: false, msg: 'Fecha no válida.' }; if (s > U.today()) return { ok: false, msg: 'La fecha no puede ser futura.' }; return { ok: true, value: s }; }
  };

  /* ── Base de datos local (localStorage) ──
     Tablas alineadas con el modelo de datos del producto */
  const TABLES = ['users', 'body_measurements', 'progress_photos', 'workout_logs', 'set_logs', 'cardio_logs', 'nutrition_plans', 'meals', 'meal_logs', 'daily_activity', 'weight_logs', 'notifications', 'achievements', 'checkins', 'recommendations', 'alerts'];
  const empty = () => { const d = { meta: { mode: null, version: C.VERSION, program_start: null, theme: 'dark', shopping: {}, notified: {}, accepted_loads: {} } }; TABLES.forEach(t => d[t] = []); return d; };

  const DB = FORGE.db = {
    data: null,
    load() {
      try { const raw = localStorage.getItem(C.DB_KEY); DB.data = raw ? JSON.parse(raw) : empty(); }
      catch (e) { console.warn('DB corrupta, reiniciando', e); DB.data = empty(); }
      TABLES.forEach(t => { if (!Array.isArray(DB.data[t])) DB.data[t] = []; });
      DB.data.meta = Object.assign(empty().meta, DB.data.meta || {});
      return DB.data;
    },
    save() { try { localStorage.setItem(C.DB_KEY, JSON.stringify(DB.data)); DB.lastError = null; } catch (e) { DB.lastError = e; FORGE.ui && FORGE.ui.toast('No se pudieron guardar los datos (almacenamiento lleno).', 'bad'); } },
    reset(mode) { DB.data = empty(); DB.data.meta.mode = mode || null; DB.save(); },
    all: t => DB.data[t],
    get: (t, id) => DB.data[t].find(r => r.id === id) || null,
    where: (t, fn) => DB.data[t].filter(fn),
    insert(t, row) { row = Object.assign({ id: U.uid(), created_at: new Date().toISOString() }, row); DB.data[t].push(row); DB.save(); return row; },
    update(t, id, patch) { const r = DB.get(t, id); if (!r) return null; Object.assign(r, patch); DB.save(); return r; },
    upsert(t, matchFn, row) { const ex = DB.data[t].find(matchFn); if (ex) { Object.assign(ex, row); DB.save(); return ex; } return DB.insert(t, row); },
    remove(t, id) { const i = DB.data[t].findIndex(r => r.id === id); if (i >= 0) { DB.data[t].splice(i, 1); DB.save(); return true; } return false; },
    removeWhere(t, fn) { DB.data[t] = DB.data[t].filter(r => !fn(r)); DB.save(); },
    meta: () => DB.data.meta,
    setMeta(patch) { Object.assign(DB.data.meta, patch); DB.save(); },
    user: () => DB.data.users[0] || null,
    async export(withPhotos) {
      const photos = {};
      if (withPhotos) { const ids = DB.all('progress_photos').map(p => p.id).concat(DB.all('meal_logs').filter(l => l.photo_id).map(l => l.photo_id)); for (const id of ids) { const src = await FORGE.photos.get(id); if (src) photos[id] = src; } }
      return JSON.stringify({ exported_at: new Date().toISOString(), app: 'FORGE', version: C.VERSION, data: DB.data, photos });
    },
    async import(json) { const o = JSON.parse(json); if (!o.data || !o.data.meta) throw new Error('Formato no reconocido'); DB.data = o.data; TABLES.forEach(t => { if (!Array.isArray(DB.data[t])) DB.data[t] = []; }); DB.data.meta = Object.assign(empty().meta, DB.data.meta || {}); DB.save(); if (o.photos) for (const [id, src] of Object.entries(o.photos)) { try { await FORGE.photos.put(id, src); } catch { } } }
  };

  /* ── Fotos (IndexedDB: los datos de imagen no caben en localStorage) ── */
  const P = FORGE.photos = {
    _db: null,
    open() {
      if (P._db) return Promise.resolve(P._db);
      return new Promise((res, rej) => {
        if (!window.indexedDB) return rej(new Error('IndexedDB no disponible'));
        const rq = indexedDB.open(C.PHOTO_DB, 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('photos');
        rq.onsuccess = () => { P._db = rq.result; res(P._db); };
        rq.onerror = () => rej(rq.error);
      });
    },
    async put(id, dataUrl) { const db = await P.open(); return new Promise((res, rej) => { const tx = db.transaction('photos', 'readwrite'); tx.objectStore('photos').put(dataUrl, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); },
    async get(id) { try { const db = await P.open(); return new Promise((res) => { const rq = db.transaction('photos').objectStore('photos').get(id); rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null); }); } catch { return null; } },
    async del(id) { try { const db = await P.open(); return new Promise((res) => { const tx = db.transaction('photos', 'readwrite'); tx.objectStore('photos').delete(id); tx.oncomplete = res; tx.onerror = res; }); } catch { } },
    async clear() { try { const db = await P.open(); return new Promise((res) => { const tx = db.transaction('photos', 'readwrite'); tx.objectStore('photos').clear(); tx.oncomplete = res; tx.onerror = res; }); } catch { } },
    // Reduce la imagen para que ocupe poco (no se retoca: solo se reescala)
    resize(file, max = 900, q = 0.8) {
      return new Promise((res, rej) => {
        const img = new Image(); const url = URL.createObjectURL(file);
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
        };
        img.onerror = () => rej(new Error('No se pudo leer la imagen')); img.src = url;
      });
    }
  };

  /* ── Contexto de programa (semana/día) ── */
  FORGE.program = {
    start: () => DB.meta().program_start,
    cycle: () => DB.meta().cycle || 1,
    finished: () => FORGE.program.week() > C.PROGRAM_WEEKS,
    week(date = U.today()) { const s = FORGE.program.start(); if (!s) return 1; return U.clamp(Math.floor(U.diffDays(s, date) / 7) + 1, 1, 52); },
    dayOfWeek: (date = U.today()) => ((U.dow(date) + 6) % 7) + 1, // 1 = lunes
    weekStart: (w) => U.addDays(FORGE.program.start(), (w - 1) * 7),
    weekDates(w) { const s = FORGE.program.weekStart(w); return Array.from({ length: 7 }, (_, i) => U.addDays(s, i)); },
    stepsGoal(w) { const u = DB.user(); const cy = FORGE.program.cycle(); const ov = u && u.steps_override && u.steps_override[cy > 1 ? cy + ':' + w : w]; if (ov) return ov; const arr = C.STEPS_BY_WEEK; const base = arr[Math.min(w, arr.length) - 1]; const floor = (DB.meta().steps_floor || 0); return Math.max(base, floor); }
  };
})();

<script>
/* ═══════════════════════════════════════════════
   FORGE · SINCRONIZACIÓN EN LA NUBE (capacidad «db» de claude.ai)
   Fuente de verdad: los datos locales. La nube es una copia que se
   empuja tras cada cambio y se trae al abrir la app en otro dispositivo.
   Cada tabla se guarda troceada en documentos «forge/<tabla>__<n>».
   Las fotos van en «photos/<id>».
   ═══════════════════════════════════════════════ */
(function () {
  const U = FORGE.U, DB = FORGE.db, C = FORGE.CONFIG;
  const CHUNK = 110 * 1024; // bytes por documento (límite 256 KiB)
  const TABLES = () => Object.keys(DB.data).filter(k => k !== 'meta');

  const S = FORGE.sync = {
    db: null, status: 'off', // off | connecting | on | error
    lastPushed: {}, timer: null, pushing: false, pulling: false, lastAt: null, unsub: null, remoteStamp: null,
    label() { if (!window.claude || typeof claude.use !== 'function') return 'Datos guardados en este dispositivo'; return { off: 'Solo en este dispositivo', connecting: 'Conectando con la nube…', on: 'Sincronizado con tu cuenta' + (S.lastAt ? ' · ' + S.lastAt : ''), error: 'La nube no responde: los datos siguen guardados aquí' }[S.status]; },
    async init() {
      if (!window.claude || typeof claude.use !== 'function') { S.status = 'off'; return; }
      let db = null; try { db = await claude.use('db'); } catch { }
      if (!db) { S.status = 'off'; S.notify(); return; }
      S.db = db; S.status = 'connecting'; S.notify();
      try { await S.reconcile(); S.status = 'on'; S.watch(); } catch (e) { console.warn('[sync]', e); S.status = 'error'; }
      S.notify();
    },
    notify() { if (FORGE.ui && FORGE.ui.state && FORGE.ui.state.tab === 'perfil' && !FORGE.session.active) FORGE.ui.render(); },
    // ── Lectura completa de la nube ──
    async readRemote() {
      const snap = await S.db.collection('forge').get(); if (snap.empty) return null;
      const chunks = {}; let meta = null;
      snap.docs.forEach(d => { const b = d.data(); if (d.id === 'meta') meta = b; else { const [t, n] = d.id.split('__'); (chunks[t] = chunks[t] || [])[+n] = b.rows || []; } });
      if (!meta) return null;
      const tables = {}; Object.entries(chunks).forEach(([t, arr]) => tables[t] = arr.flat().filter(Boolean));
      return { meta, tables };
    },
    // ── Reconciliación al abrir ──
    async reconcile() {
      const remote = await S.readRemote();
      const local = DB.data; const lu = local.meta.updated_at || 0;
      if (!remote) { if (local.meta.mode === 'user' || local.meta.demo_touched) await S.pushAll(); else S.markAllPushed(); return; }
      const ru = remote.meta.updated_at || 0;
      const localIsFreshDemo = local.meta.mode === 'demo' && !local.meta.demo_touched;
      if (localIsFreshDemo || ru > lu) { S.applyRemote(remote); await FORGE.photos.warmFromCloud(); FORGE.ui.toast('Datos actualizados desde tu cuenta'); FORGE.ui.applyTheme(); FORGE.ui.render(); }
      else if (lu > ru) await S.pushAll();
      else S.markAllPushed();
    },
    applyRemote(remote) {
      const d = DB.data; Object.keys(d).forEach(k => { if (k !== 'meta') d[k] = remote.tables[k] || []; });
      d.meta = Object.assign(d.meta, remote.meta); S.remoteStamp = remote.meta.updated_at || 0;
      try { localStorage.setItem(C.DB_KEY, JSON.stringify(d)); } catch { }
      S.markAllPushed();
    },
    markAllPushed() { TABLES().forEach(t => S.lastPushed[t] = JSON.stringify(DB.data[t])); S.lastPushed.meta = JSON.stringify(DB.data.meta); },
    // ── Escritura ──
    chunk(rows) { const out = []; let cur = [], size = 0; rows.forEach(r => { const s = JSON.stringify(r).length; if (size + s > CHUNK && cur.length) { out.push(cur); cur = []; size = 0; } cur.push(r); size += s; }); if (cur.length || !out.length) out.push(cur); return out; },
    async pushTable(t) {
      const rows = DB.data[t]; const parts = S.chunk(rows);
      for (let i = 0; i < parts.length; i++) await S.db.doc(`forge/${t}__${i}`).set({ rows: parts[i], n: i, total: parts.length });
      // borrar trozos sobrantes de versiones anteriores
      const prev = (S.chunkCount || {})[t] || 0; for (let i = parts.length; i < Math.max(prev, 8); i++) { try { await S.db.doc(`forge/${t}__${i}`).delete(); } catch { } }
      (S.chunkCount = S.chunkCount || {})[t] = parts.length; S.lastPushed[t] = JSON.stringify(rows);
    },
    async pushAll() { for (const t of TABLES()) await S.pushTable(t); await S.pushMeta(); },
    async pushMeta() { const m = Object.assign({}, DB.data.meta); await S.db.doc('forge/meta').set(m); S.lastPushed.meta = JSON.stringify(DB.data.meta); S.remoteStamp = m.updated_at || 0; S.lastAt = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); },
    // Llamado por DB.save(): empuja solo lo que cambió, con retardo
    schedule() {
      if (!S.db || S.status !== 'on') return;
      if (DB.data.meta.mode === 'demo' && !DB.data.meta.demo_touched) return;
      clearTimeout(S.timer); S.timer = setTimeout(S.flush, 1500);
    },
    async flush() {
      if (!S.db || S.pushing) { if (S.pushing) S.schedule(); return; } S.pushing = true;
      try {
        for (const t of TABLES()) { const j = JSON.stringify(DB.data[t]); if (j !== S.lastPushed[t]) await S.pushTable(t); }
        if (JSON.stringify(DB.data.meta) !== S.lastPushed.meta) await S.pushMeta();
        S.status = 'on';

    // Fotos
    async putPhoto(id, dataUrl) { if (!S.db || S.status !== 'on') return; try { await S.db.doc('photos/' + id).set({ data: dataUrl, at: Date.now() }); } catch (e) { console.warn('[sync] foto', e); } },
    async getPhoto(id) { if (!S.db) return null; try { const s = await S.db.doc('photos/' + id).get(); return s.exists ? s.data().data : null; } catch { return null; } },
    async delPhoto(id) { if (!S.db) return; try { await S.db.doc('photos/' + id).delete(); } catch { } },
    async clearPhotos() { if (!S.db) return; try { const s = await S.db.collection('photos').get(); for (const d of s.docs) await S.db.doc('photos/' + d.id).delete(); } catch { } },
    async listPhotoIds() { if (!S.db) return []; try { const s = await S.db.collection('photos').get(); return s.docs.map(d => d.id); } catch { return []; } }
  };

  // Enganches en la capa de datos y en las fotos
  const origSave = DB.save; DB.saveRaw = origSave; DB.save = function () { DB.data.meta.updated_at = Date.now(); if (DB.data.meta.mode === 'demo' && DB.data.meta.seeding !== true) DB.data.meta.demo_touched = true; origSave(); S.schedule(); };
  const P = FORGE.photos; const oPut = P.put, oGet = P.get, oDel = P.del, oClear = P.clear;
  P.put = async (id, d) => { await oPut(id, d); S.putPhoto(id, d); };
  P.get = async id => { const l = await oGet(id); if (l) return l; const r = await S.getPhoto(id); if (r) { try { await oPut(id, r); } catch { } } return r; };
  P.del = async id => { await oDel(id); await S.delPhoto(id); };
  P.clear = async () => { await oClear(); await S.clearPhotos(); };
  P.warmFromCloud = async () => { /* las fotos se traen bajo demanda al mostrarse */ };
})();
