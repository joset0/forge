<script>
/* ═══════════════════════════════════════════════
   FORGE · MOTORES (lógica de negocio, sin UI)
   PROGRESSION · NUTRITION · PROGRESS · NOTIFICATION
   ═══════════════════════════════════════════════ */
(function () {
  const C = FORGE.CONFIG, U = FORGE.U, DB = FORGE.db, PRG = FORGE.program;

  /* ═══════ PROGRESSION ENGINE ═══════ */
  const PE = FORGE.progression = {
    e1rm: (w, r) => r <= 0 ? 0 : r === 1 ? w : w * (1 + r / 30),
    bodyweightAt(date) { const w = FORGE.progress.trendAt(date); return w || (DB.user() && DB.user().initial_weight) || 0; },
    // Historial de un ejercicio: sesiones ordenadas por fecha con sus series completadas
    history(exId) {
      const logs = DB.all('workout_logs').slice().sort((a, b) => a.date < b.date ? -1 : 1);
      return logs.map(l => ({ log: l, sets: DB.where('set_logs', s => s.workout_log_id === l.id && s.exercise_id === exId && s.completed) })).filter(x => x.sets.length);
    },
    bestSet(sets) { return sets.reduce((b, s) => (!b || PE.e1rm(s.weight, s.reps) > PE.e1rm(b.weight, b.reps)) ? s : b, null); },
    sessionE1RM(exId, session) { const ex = FORGE.exercise(exId); const b = PE.bestSet(session.sets); if (!b) return 0; const w = b.weight + (ex.bodyweight ? PE.bodyweightAt(session.log.date) : 0); return PE.e1rm(w, b.reps); },
    fatigueHigh(week) { const cy = PRG.cycle(); const c = DB.where('checkins', x => (x.cycle || 1) === cy && (x.week === week || x.week === week - 1)).sort((a, b) => b.week - a.week)[0]; return !!(c && c.feeling === 'muy_fatigado'); },
    /* Recomendación de carga para un ejercicio dentro de una plantilla.
       Devuelve {status: first|up|keep|down|scheme, weight, reps, prev, msg} — NUNCA aplica nada por sí sola. */
    suggest(exId, tpl, week) {
      const ex = FORGE.exercise(exId); const histAll = PE.history(exId).filter(h => !h.sets[0].deload); const lastAny = histAll[histAll.length - 1];
      // Base de trabajo: la última sesión con el MISMO esquema de repeticiones (evita derivas al alternar 5 y 8 reps)
      const same = histAll.filter(h => (h.sets[0].target_reps || tpl.target_reps) === tpl.target_reps); const last = same.length ? same[same.length - 1] : lastAny;
      const inc = C.INCREMENTS;
      if (!last) return { status: 'first', weight: null, reps: tpl.target_reps, prev: null, msg: ex.mode === 'load' ? 'Primera vez: introduce el peso que utilices. A partir de ahí calculamos la progresión.' : 'Primera vez: registra lo que consigas hoy.' };
      const sets = last.sets; const prevW = Math.max(...sets.map(s => s.weight || 0));
      const prevTarget = last.sets[0].target_reps || tpl.target_reps;
      const planned = last.sets[0].planned_sets || tpl.sets;
      const allDone = sets.length >= planned && sets.every(s => s.reps >= (s.target_reps || prevTarget));
      const rirs = sets.map(s => s.rir).filter(v => v != null); const minRIR = rirs.length ? Math.min(...rirs) : null;
      const totalReps = U.sum(sets.map(s => s.reps)), targetTotal = planned * prevTarget;
      const fat = PE.fatigueHigh(week);
      if (ex.mode === 'time') return { status: 'keep', weight: prevW, reps: tpl.target_reps, prev: prevW, msg: allDone && minRIR >= 2 ? 'Aguantaste todo el tiempo con margen: puedes añadir 2,5 kg de lastre si quieres.' : 'Mantén el lastre y busca completar el tiempo.' };
      if (ex.mode === 'reps') { const prevR = Math.max(...sets.map(s => s.reps)); const up = allDone && minRIR != null && minRIR >= 2 && !fat; return { status: up ? 'up' : 'keep', weight: 0, reps: up ? prevR + 2 : tpl.target_reps, prev: prevR, msg: up ? `Completaste ${prevR} con margen: hoy intenta ${prevR + 2}.` : 'Mantén las repeticiones objetivo con buena técnica.' }; }
      // Sin historial con este esquema: estimar la carga desde el e1RM de la última sesión
      if (!same.length && tpl.target_reps !== prevTarget) {
        const e = PE.e1rm(prevW, Math.max(...sets.map(s => s.reps))); const est = U.round(e / (1 + tpl.target_reps / 30) * 0.96, ex.step || 2.5);
        return { status: 'scheme', weight: Math.max(est, ex.bodyweight ? 0 : ex.step), reps: tpl.target_reps, prev: prevW, msg: `Nuevo esquema: pasas de ${prevTarget} a ${tpl.target_reps} repeticiones. Carga estimada a partir de tu e1RM (${U.kg(Math.round(e))}).` };
      }
      // Si con otro esquema más reciente has mostrado más fuerza, no sugerimos menos de lo que ya levantas
      const floorFromLatest = (() => { if (!lastAny || lastAny === last) return 0; const b = PE.bestSet(lastAny.sets); const e = PE.e1rm(b.weight, b.reps); return U.round(e / (1 + tpl.target_reps / 30) * 0.96, ex.step || 2.5); })();
      const lift = r => { if (r.weight != null && floorFromLatest > r.weight + (ex.step || 1) / 2 && r.status !== 'down') { r.weight = floorFromLatest; r.msg += ` Ajustado al alza por tu sesión más reciente (${U.kg(floorFromLatest)}).`; } return r; };
      if (fat) return lift({ status: 'keep', weight: prevW, reps: tpl.target_reps, prev: prevW, msg: 'Fatiga alta esta semana: mantenemos la carga y priorizamos la recuperación.' });
      if (allDone && minRIR != null && minRIR >= 2) {
        let d = ex.region === 'lower' ? (ex.category === 'compound' ? (minRIR >= 3 ? inc.lower.compound : inc.lowerConservative) : inc.lower.accessory) : inc.upper[ex.category];
        d = Math.max(ex.step || 1, U.round(d, ex.step || 1));
        return lift({ status: 'up', weight: prevW + d, reps: tpl.target_reps, prev: prevW, msg: `Completaste todas las series con ${minRIR}+ repeticiones en reserva. Sugerimos +${U.n(d, d % 1 ? 2 : 0)} kg.` });
      }
      if (allDone) return lift({ status: 'keep', weight: prevW, reps: tpl.target_reps, prev: prevW, msg: minRIR == null ? 'Completaste las series. Registra el RIR para que podamos afinar la progresión.' : 'Series completadas al límite (RIR 0-1): consolidamos la carga antes de subir.' });
      if (targetTotal && totalReps / targetTotal >= 0.85) return lift({ status: 'keep', weight: prevW, reps: tpl.target_reps, prev: prevW, msg: `Faltaron pocas repeticiones (${totalReps}/${targetTotal}). Repetimos el peso para completarlas.` });
      const nw = Math.max(ex.bodyweight ? 0 : ex.step, U.round(prevW * 0.95, ex.step || 1));
      return { status: 'down', weight: nw, reps: tpl.target_reps, prev: prevW, msg: `Quedaron bastantes repeticiones sin hacer (${totalReps}/${targetTotal}). Bajamos un 5% para recuperar la técnica y el ritmo.` };
    },
    // Plantilla del día ya ajustada por fatiga (volumen) y con recomendaciones por ejercicio
    plan(workoutId, week) {
      const tpl = FORGE.workoutTemplate(workoutId, week); if (!tpl) return null;
      const fat = PE.fatigueHigh(week); const deload = PE.isDeload(week); const cycle = PRG.cycle();
      const accepted = DB.meta().accepted_loads || {}; const swaps = DB.meta().swaps || {};
      tpl.fatigueAdjusted = fat; tpl.deload = deload;
      tpl.exercises = tpl.exercises.map(e => {
        const swapKey = `${workoutId}:${e.exercise_id}`, swapWeekKey = `${cycle}:${week}:${workoutId}:${e.exercise_id}`;
        const exId = swaps[swapWeekKey] || swaps[swapKey] || e.exercise_id; const ex = FORGE.exercise(exId);
        let sets = fat && ex.category === 'accessory' ? Math.max(2, e.sets - 1) : e.sets; if (deload) sets = Math.max(2, Math.round(e.sets * 0.6));
        const sug = PE.suggest(exId, e, week);
        if (deload && ex.mode === 'load' && sug.weight != null && sug.status !== 'first') { const w0 = sug.prev != null ? sug.prev : sug.weight; sug.weight = Math.max(ex.bodyweight ? 0 : ex.step, U.round(w0 * 0.9, ex.step || 1)); sug.status = 'deload'; sug.msg = `Semana de descarga: ${U.kg(sug.weight)} (≈90 % de tu carga) y menos series para llegar fresco al siguiente bloque.`; }
        const key = `${cycle}:${week}:${workoutId}:${exId}`; const acc = accepted[key];
        return { ...e, exercise_id: exId, original_id: e.exercise_id, swapped: exId !== e.exercise_id, sets, exercise: ex, suggestion: sug, weight: acc != null ? acc : sug.weight, target_reps: sug.reps || e.target_reps, acceptedKey: key, accepted: acc != null, deload };
      });
      return tpl;
    },
    isDeload: week => C.DELOAD_WEEKS.includes(week),
    alternatives(exId) { return (C.ALTERNATIVES[exId] || []).map(id => FORGE.exercise(id)).filter(Boolean); },
    swapExercise(workoutId, exId, altId, week, permanent) { const m = DB.meta().swaps || {}; const k = permanent ? `${workoutId}:${exId}` : `${PRG.cycle()}:${week}:${workoutId}:${exId}`; if (altId) m[k] = altId; else { delete m[k]; delete m[`${workoutId}:${exId}`]; delete m[`${PRG.cycle()}:${week}:${workoutId}:${exId}`]; } DB.setMeta({ swaps: m }); },
    acceptLoad(key, weight) { const m = DB.meta().accepted_loads || {}; m[key] = weight; DB.setMeta({ accepted_loads: m }); },
    // Índice de fuerza: media del cambio de e1RM en básicos (primera sesión vs última)
    strengthIndex() {
      const mains = FORGE.EXERCISES.filter(e => e.main);
      const per = mains.map(ex => { const h = PE.history(ex.id); if (h.length < 2) return null; const a = PE.sessionE1RM(ex.id, h[0]), b = PE.sessionE1RM(ex.id, h[h.length - 1]); return a > 0 ? (b - a) / a * 100 : null; }).filter(v => v != null);
      const sessions = DB.where('workout_logs', l => l.completed).length;
      if (sessions < 3 || !per.length) return { ok: false, sessions, msg: 'Registra al menos 3 sesiones para comenzar a calcular tu tendencia de fuerza.' };
      return { ok: true, pct: U.avg(per), sessions };
    },
    // Cambio semanal de fuerza (semana w vs w-1) en e1RM medio de básicos
    weeklyStrength(w) {
      const rng = wk => { const ds = PRG.weekDates(wk); return [ds[0], ds[6]]; };
      const avgE = wk => { const [a, b] = rng(wk); const vals = FORGE.EXERCISES.filter(e => e.main).map(ex => { const h = PE.history(ex.id).filter(s => s.log.date >= a && s.log.date <= b); return h.length ? Math.max(...h.map(s => PE.sessionE1RM(ex.id, s))) : null; }).filter(v => v); return vals.length ? U.avg(vals) : null; };
      const cur = avgE(w), prev = avgE(w - 1); if (!cur || !prev) return null; return (cur - prev) / prev * 100;
    },
    prCard(exId) {
      const h = PE.history(exId); if (!h.length) return null; const ex = FORGE.exercise(exId);
      const first = PE.bestSet(h[0].sets), best = h.reduce((b, s) => { const bs = PE.bestSet(s.sets); return (!b || PE.e1rm(bs.weight, bs.reps) > PE.e1rm(b.weight, b.reps)) ? bs : b; }, null), last = PE.bestSet(h[h.length - 1].sets);
      const e0 = PE.sessionE1RM(exId, h[0]), e1 = Math.max(...h.map(s => PE.sessionE1RM(exId, s)));
      return { ex, first, best, last, sessions: h.length, e1rmFirst: e0, e1rmBest: e1, pct: e0 ? (e1 - e0) / e0 * 100 : null, series: h.map(s => ({ date: s.log.date, v: PE.sessionE1RM(exId, s) })) };
    }
  };

  /* ═══════ NUTRITION ENGINE ═══════ */
  const NE = FORGE.nutrition = {
    // Objetivos calóricos: Mifflin-St Jeor × actividad − déficit moderado
    baseTargets(u, weight) {
      const w = weight || u.initial_weight;
      const bmr = u.sex === 'f' ? 10 * w + 6.25 * u.height - 5 * u.age - 161 : 10 * w + 6.25 * u.height - 5 * u.age + 5;
      const af = { sedentario: 1.25, ligero: 1.4, moderado: 1.55, alto: 1.7 }[u.activity_level || 'ligero'];
      const tdee = bmr * af; const deficit = U.clamp(tdee * 0.18, 350, 600);
      const kcal = U.round(tdee - deficit, 50);
      const protein = Math.round(U.clamp(w * 1.6, 110, 210));
      const fat = Math.round(U.clamp(w * 0.7, 45, 90));
      const carbs = Math.max(80, Math.round((kcal - protein * 4 - fat * 9) / 4));
      return { calories: kcal, protein, carbs, fat };
    },
    planFor(week) {
      const cy = PRG.cycle(); let p = DB.where('nutrition_plans', x => x.week === week && (x.cycle || 1) === cy)[0]; if (p) return p;
      const u = DB.user(); if (!u) return null;
      const prev = DB.all('nutrition_plans').slice().sort((a, b) => b.week - a.week)[0];
      const t = NE.baseTargets(u, FORGE.progress.trendAt(U.today()) || u.initial_weight);
      const adj = (DB.meta().kcal_adjust || 0);
      const kcal = U.round(t.calories + adj, 50);
      const carbs = Math.max(80, Math.round((kcal - t.protein * 4 - t.fat * 9) / 4));
      return DB.insert('nutrition_plans', { user_id: u.id, week, cycle: cy, calories: kcal, protein: t.protein, carbs, fat: t.fat, adjust: adj, from: prev ? prev.week : null });
    },
    adjustCalories(delta) { const m = (DB.meta().kcal_adjust || 0) + delta; DB.setMeta({ kcal_adjust: m }); const w = PRG.week(); const p = NE.planFor(w); if (p) { const kcal = p.calories + delta; DB.update('nutrition_plans', p.id, { calories: kcal, carbs: Math.max(80, Math.round((kcal - p.protein * 4 - p.fat * 9) / 4)), adjust: m }); } },
    recipeMacros(r, scale = 1) {
      const t = { calories: 0, protein: 0, carbs: 0, fat: 0 };
      r.ingredients.forEach(i => { const f = FORGE.food(i.food); const g = i.grams * scale / 100; t.calories += f.calories * g; t.protein += f.protein * g; t.carbs += f.carbs * g; t.fat += f.fat * g; });
      Object.keys(t).forEach(k => t[k] = Math.round(t[k])); return t;
    },
    allowed(r, tags) { return !r.ingredients.some(i => { const f = FORGE.food(i.food); return f.tag && tags.includes(f.tag); }); },
    candidates(type) { const u = DB.user(); const tags = (u && u.diet_tags) || []; return FORGE.RECIPES.filter(r => r.type === type && NE.allowed(r, tags)); },
    scaleFor(r, type, plan) { const target = plan.calories * C.MEAL_SPLIT[type]; const base = NE.recipeMacros(r, 1).calories; return U.clamp(Math.round(target / base * 20) / 20, 0.7, 1.5); },
    // Fuente de proteína principal de una receta (para variar carnes, huevos, legumbres…)
    mainProtein(r) { let best = null, bp = 0; r.ingredients.forEach(i => { const f = FORGE.food(i.food); const p = f.protein * i.grams / 100; if (p > bp) { bp = p; best = f; } }); if (!best) return 'otros'; const g = { pollo: 'pollo', pavo: 'pavo', pavolonchas: 'pavo', ternera: 'ternera', terpicada: 'ternera', lomo: 'cerdo', conejo: 'conejo', salmon: 'pescado', merluza: 'pescado', bacalao: 'pescado', gambas: 'pescado', atun: 'pescado', sardinas: 'pescado', huevo: 'huevo', claras: 'huevo', lentejas: 'legumbre', garbanzos: 'legumbre', alubias: 'legumbre', hummus: 'legumbre', tofu: 'tofu', whey: 'batido' }; return g[best.id] || 'lacteo'; },
    // Genera 7 días × 4 comidas para una semana: sin repetir recetas, sin repetir la casilla de la semana anterior
    // y variando la proteína principal (no repetir la misma en comida y cena del mismo día ni dos días seguidos en la misma casilla)
    generateWeek(week) {
      const cy = PRG.cycle(); const ex = DB.where('meals', m => m.week === week && (m.cycle || 1) === cy); if (ex.length) return ex;
      const u = DB.user(); const plan = NE.planFor(week); if (!u || !plan) return [];
      const rnd = U.rng(week * 7919 + cy * 131 + (u.seed || 17));
      const prev = DB.where('meals', m => m.week === week - 1 && (m.cycle || 1) === cy);
      const rows = []; const chosen = {}; // chosen[day] = { type: recipe }
      ['comida', 'cena', 'desayuno', 'merienda'].forEach(type => {
        const pool = U.shuffle(NE.candidates(type), rnd);
        const prevIds = prev.filter(m => m.meal_type === type).map(m => m.recipe_id);
        const used = new Set();
        for (let d = 1; d <= 7; d++) {
          chosen[d] = chosen[d] || {};
          const dayProteins = Object.values(chosen[d]).map(r => NE.mainProtein(r));
          const prevDay = d > 1 && chosen[d - 1][type] ? NE.mainProtein(chosen[d - 1][type]) : null;
          const score = r => (used.has(r.id) ? 100 : 0) + (prevIds.includes(r.id) ? 10 : 0) + (type !== 'desayuno' && type !== 'merienda' && dayProteins.includes(NE.mainProtein(r)) ? 5 : 0) + (prevDay === NE.mainProtein(r) ? 3 : 0);
          const r = pool.slice().sort((a, b) => score(a) - score(b))[0];
          used.add(r.id); chosen[d][type] = r;
          const scale = NE.scaleFor(r, type, plan);
          rows.push({ nutrition_plan_id: plan.id, week, cycle: cy, day: d, meal_type: type, recipe_id: r.id, scale, ...NE.recipeMacros(r, scale) });
        }

      rows.forEach(r => DB.insert('meals', r)); return DB.where('meals', m => m.week === week && (m.cycle || 1) === cy);
    },
    mealsFor(week, day) { NE.generateWeek(week); const cy = PRG.cycle(); return C.MEAL_ORDER.map(t => DB.where('meals', m => m.week === week && (m.cycle || 1) === cy && m.day === day && m.meal_type === t)[0]).filter(Boolean); },
    mealTime(type) { const u = DB.user(); return (u && u.meal_times && u.meal_times[type]) || C.MEAL_TIME[type] || ''; },
    waterGoal() { const u = DB.user(); return (u && u.water_goal) || C.WATER_GOAL_L; },
    alternatives(meal) {
      const plan = NE.planFor(meal.week); const used = DB.where('meals', m => m.week === meal.week && (m.cycle || 1) === (meal.cycle || 1) && m.day === meal.day).map(m => m.recipe_id);
      return NE.candidates(meal.meal_type).filter(r => !used.includes(r.id)).map(r => { const scale = NE.scaleFor(r, meal.meal_type, plan); const m = NE.recipeMacros(r, scale); return { recipe: r, scale, macros: m, diff: Math.abs(m.calories - meal.calories) }; }).sort((a, b) => a.diff - b.diff).slice(0, 5);
    },
    swap(mealId, recipeId, scale) { const r = FORGE.recipe(recipeId); return DB.update('meals', mealId, { recipe_id: recipeId, scale, ...NE.recipeMacros(r, scale) }); },
    logMeal(meal, date = U.today()) {
      const r = FORGE.recipe(meal.recipe_id);
      return DB.insert('meal_logs', { user_id: DB.user().id, date, meal_id: meal.id, recipe_id: r.id, meal_type: meal.meal_type, name: r.name, calories: meal.calories, protein: meal.protein, carbs: meal.carbs, fat: meal.fat });
    },
    // Comida fuera del plan (a ojo o desde el catálogo)
    logFree(date, f) { const u = DB.user(); return DB.insert('meal_logs', { user_id: u.id, date, meal_id: null, recipe_id: null, meal_type: f.meal_type || 'otro', name: f.name, calories: Math.round(f.calories), protein: Math.round(f.protein || 0), carbs: Math.round(f.carbs || 0), fat: Math.round(f.fat || 0), items: f.items || null, free: true }); },
    freeLogs: date => DB.where('meal_logs', l => l.date === date && l.free),
    itemsMacros(items) { const t = { calories: 0, protein: 0, carbs: 0, fat: 0 }; items.forEach(i => { const f = FORGE.food(i.food); const g = i.grams / 100; t.calories += f.calories * g; t.protein += f.protein * g; t.carbs += f.carbs * g; t.fat += f.fat * g; }); Object.keys(t).forEach(k => t[k] = Math.round(t[k])); return t; },
    unlogMeal(mealId, date) { DB.removeWhere('meal_logs', l => l.meal_id === mealId && l.date === date); },
    isLogged: (mealId, date) => DB.where('meal_logs', l => l.meal_id === mealId && l.date === date).length > 0,
    dayIntake(date) { const t = { calories: 0, protein: 0, carbs: 0, fat: 0, n: 0 }; DB.where('meal_logs', l => l.date === date).forEach(l => { t.calories += l.calories; t.protein += l.protein; t.carbs += l.carbs; t.fat += l.fat; t.n++; }); return t; },
    adherence(week) { const ds = PRG.weekDates(week).filter(d => d <= U.today()); if (!ds.length) return null; const logged = ds.reduce((n, d) => n + Math.min(4, NE.dayIntake(d).n), 0); return logged / (ds.length * 4) * 100; },
    shoppingList(week) {
      const meals = NE.generateWeek(week); const agg = {};
      meals.forEach(m => { const r = FORGE.recipe(m.recipe_id); r.ingredients.forEach(i => { agg[i.food] = (agg[i.food] || 0) + i.grams * m.scale; }); });
      const groups = {}; Object.entries(agg).forEach(([id, g]) => { const f = FORGE.food(id); (groups[f.section] = groups[f.section] || []).push({ food: f, grams: g, label: NE.qty(f, g) }); });
      Object.values(groups).forEach(a => a.sort((x, y) => x.food.name.localeCompare(y.food.name)));
      return Object.keys(FORGE.SECTIONS).filter(s => groups[s]).map(s => ({ section: s, title: FORGE.SECTIONS[s], items: groups[s] }));
    },
    qty(f, g) {
      if (f.id === 'huevo') return Math.ceil(g / 60) + ' ud';
      if (f.id === 'leche') return U.n(Math.ceil(g / 100) / 10, 1) + ' L';
      if (f.id === 'aceite') return Math.ceil(g / 5) * 5 + ' ml';
      if (g >= 1000) return U.n(Math.ceil(g / 50) * 50 / 1000, 2).replace(/,?0+$/, '') + ' kg';
      return Math.ceil(g / 10) * 10 + ' g';
    },
    nextMeal(date = U.today()) { const w = PRG.week(date), d = PRG.dayOfWeek(date); const ms = NE.mealsFor(w, d); return ms.find(m => !NE.isLogged(m.id, date)) || null; }
  };

  /* ═══════ PROGRESS ENGINE ═══════ */
  const PR = FORGE.progress = {
    weights() { return DB.all('weight_logs').slice().sort((a, b) => a.date < b.date ? -1 : 1); },
    // Media móvil de 7 días (evita alarmas por fluctuaciones diarias)
    trendAt(date, win = 7) { const from = U.addDays(date, -(win - 1)); const v = PR.weights().filter(w => w.date >= from && w.date <= date).map(w => w.weight); return v.length ? U.avg(v) : null; },
    trendSeries() { const ws = PR.weights(); return ws.map(w => ({ date: w.date, raw: w.weight, trend: PR.trendAt(w.date) })); },
    weightStats() {
      const ws = PR.weights(); const u = DB.user(); if (!ws.length || !u) return null;
      const last = ws[ws.length - 1]; const t = U.today();
      const avg7 = PR.trendAt(t) ?? PR.trendAt(last.date), avg30 = PR.trendAt(t, 30) ?? PR.trendAt(last.date, 30);
      const w7 = PR.trendAt(U.addDays(t, -7)), w30 = PR.trendAt(U.addDays(t, -30), 7) ?? PR.trendAt(U.addDays(t, -30), 14);
      const start = u.initial_weight; const goal = u.target_weight;
      const cur = avg7 ?? last.weight;
      return { current: last.weight, date: last.date, avg7, avg30, weekly: w7 != null ? avg7 - w7 : null, monthly: w30 != null ? avg7 - w30 : null, total: cur - start, pct: U.clamp((start - cur) / (start - goal) * 100, 0, 100), n: ws.length, remaining: cur - goal };
    },
    // Composición corporal estimada (fórmula de la Marina de EE. UU.) a partir de cuello, cintura/abdomen (y cadera en mujeres)
    bodyComp(m, weight) {
      const u = DB.user(); if (!u || !m || !m.neck || !u.height) return null; const waist = (u.sex === 'm' ? (m.abdomen || m.waist) : m.waist); if (!waist) return null;
      const L = Math.log10; let bf;
      if (u.sex === 'f') { if (!m.hip) return null; bf = 163.205 * L(waist + m.hip - m.neck) - 97.684 * L(u.height) - 78.387; } else bf = 86.010 * L(waist - m.neck) - 70.041 * L(u.height) + 36.76;
      if (!isFinite(bf) || bf < 3 || bf > 60) return null; const w = weight || PR.trendAt(m.date) || m.weight; return { fat: bf, lean: w ? w * (1 - bf / 100) : null, weight: w, date: m.date };
    },
    bodyCompSeries() { return PR.measurements().map(m => PR.bodyComp(m)).filter(Boolean); },
    measurements: () => DB.all('body_measurements').slice().sort((a, b) => a.date < b.date ? -1 : 1),
    measureDelta(field) { const ms = PR.measurements().filter(m => m[field] != null); if (ms.length < 2) return null; return { first: ms[0][field], last: ms[ms.length - 1][field], delta: ms[ms.length - 1][field] - ms[0][field] }; },
    measureWeekDelta(field, week) { const ds = PRG.weekDates(week); const ms = PR.measurements().filter(m => m[field] != null); const before = ms.filter(m => m.date < ds[0]).pop(), inWeek = ms.filter(m => m.date >= ds[0] && m.date <= ds[6]).pop(); if (!before || !inWeek) return null; return inWeek[field] - before[field]; },
    activity: date => DB.where('daily_activity', a => a.date === date)[0] || null,
    setActivity(date, patch) { const u = DB.user(); return DB.upsert('daily_activity', a => a.date === date, Object.assign({ user_id: u.id, date, steps: 0, cardio_minutes: 0, water: 0, calories_burned: 0 }, PR.activity(date) || {}, patch)); },
    stepsAvg(week) { const ds = PRG.weekDates(week).filter(d => d <= U.today()); const v = ds.map(d => (PR.activity(d) || {}).steps || 0); return v.length ? U.avg(v) : 0; },
    totalSteps: () => U.sum(DB.all('daily_activity').map(a => a.steps || 0)),
    workoutsInWeek(week) { const ds = PRG.weekDates(week); return DB.where('workout_logs', l => l.completed && l.date >= ds[0] && l.date <= ds[6]); },
    workoutDoneToday: (id, date = U.today()) => DB.where('workout_logs', l => l.completed && l.date === date && l.workout_id === id)[0] || null,
    adherence(week) {
      const u = DB.user(); const days = (u.training_days || C.DEFAULT_TRAINING_DAYS).length;
      const w = Math.min(100, PR.workoutsInWeek(week).length / days * 100);
      const n = NE.adherence(week); const s = Math.min(100, PR.stepsAvg(week) / PRG.stepsGoal(week) * 100);
      const parts = [w, n, s].filter(v => v != null); return { workouts: w, nutrition: n, steps: s, total: parts.length ? U.avg(parts) : null };
    },
    weeklyReport(week) {
      const ds = PRG.weekDates(week); const cy = PRG.cycle(); const u = DB.user(); const days = (u.training_days || C.DEFAULT_TRAINING_DAYS).length;
      const wStart = PR.trendAt(U.addDays(ds[0], -1)) ?? PR.trendAt(ds[0]), wEnd = PR.trendAt(ds[6] > U.today() ? U.today() : ds[6]);
      const waist = PR.measureWeekDelta('waist', week);
      const workouts = PR.workoutsInWeek(week).length; const steps = PR.stepsAvg(week); const nut = NE.adherence(week); const str = PE.weeklyStrength(week);
      const checkin = DB.where('checkins', c => c.week === week && (c.cycle || 1) === cy)[0];
      const best = [], improve = [];
      const imp = (text, goal) => improve.push({ text, goal });
      if (workouts >= days) best.push('Has completado todos los entrenamientos planificados.'); else if (workouts) imp(`Entrenamientos: ${workouts}/${days}. Intenta cerrar la semana completa.`, `Completar los ${days} entrenamientos de fuerza.`); else imp('No hay entrenamientos registrados esta semana.', `Completar los ${days} entrenamientos de fuerza.`);
      if (wStart != null && wEnd != null) { const d = wEnd - wStart; if (d <= -0.4) best.push(`Tu tendencia de peso ha bajado ${U.n(Math.abs(d))} kg.`); else if (d > 0.3) imp('La tendencia de peso ha subido ligeramente: revisa raciones y pasos.', 'Registrar las 4 comidas cada día y cumplir el objetivo de pasos.'); }
      if (waist != null && waist < 0) best.push(`Cintura −${U.n(Math.abs(waist))} cm.`);
      if (steps >= PRG.stepsGoal(week)) best.push(`Media de ${U.int(steps)} pasos: objetivo cumplido.`); else if (steps > 0) imp(`Pasos: ${U.int(steps)}/día frente a ${U.int(PRG.stepsGoal(week))}. Un paseo de 15 min añade ~1.500.`, `Llegar a ${U.int(PRG.stepsGoal(week + 1))} pasos de media diaria.`);
      if (nut != null) { if (nut >= 85) best.push(`Nutrición al ${U.int(nut)}%.`); else imp(`Nutrición al ${U.int(nut)}%: registra cada comida con un toque desde HOY.`, 'Registrar al menos el 85% de las comidas.'); }
      if (str != null && str > 0) best.push(`Fuerza +${U.n(str)}% en básicos.`);
      const nextGoal = improve.length ? improve[0].goal : `Mantener el ritmo y alcanzar ${U.int(PRG.stepsGoal(week + 1))} pasos/día.`;
      return { week, dates: ds, wStart, wEnd, delta: (wStart != null && wEnd != null) ? wEnd - wStart : null, waist, workouts, days, steps, nut, str, checkin, best, improve, nextGoal };
    },
    // ADAPTACIÓN INTELIGENTE: recomendaciones a partir de tendencia, pasos, adherencia y fatiga
    recommendations() {
      const u = DB.user(); const out = []; if (!u) return out;
      const t = U.today(); const now = PR.trendAt(t); const ws = PR.weights();
      const span = ws.length ? U.diffDays(ws[0].date, t) : 0;
      if (ws.length < 5 || span < 14) { out.push({ kind: 'info', text: 'Sigue registrando tu peso a diario. Con dos semanas de datos podremos ajustar calorías y actividad con criterio.' }); return out; }
      const win = Math.min(21, span); const before = PR.trendAt(U.addDays(t, -win)); const rate = before != null ? (now - before) / (win / 7) : null; // kg/semana
      const w = PRG.week(); const steps = PR.stepsAvg(w), goal = PRG.stepsGoal(w); const fat = PE.fatigueHigh(w);
      const lo = -now * 0.005, hi = -now * 0.01; // rango deseado (negativo)
      if (rate != null) {
        if (rate < hi * 1.4) out.push({ kind: 'warn', text: `Estás perdiendo ${U.n(Math.abs(rate))} kg/semana, más rápido de lo recomendado. Sube 150 kcal para proteger la masa muscular y el rendimiento.`, action: { label: 'Subir 150 kcal', delta: 150 } });
        else if (rate <= lo) out.push({ kind: 'good', text: `Tu peso baja a un ritmo adecuado (${U.n(Math.abs(rate))} kg/semana). Mantendremos las calorías.` });
        else if (rate <= -0.15) out.push({ kind: 'info', text: 'El peso baja despacio. Antes de tocar calorías, asegura la adherencia a las comidas y el objetivo de pasos esta semana.' });
        else if (steps < goal * 0.9) out.push({ kind: 'warn', text: `Tu peso lleva ${Math.round(win / 7)} semanas estable. Podemos aumentar la actividad antes de reducir calorías: sube tu objetivo a ${U.int(goal + 1000)} pasos.`, action: { label: `Objetivo ${U.int(goal + 1000)} pasos`, steps: goal + 1000 } });
        else out.push({ kind: 'warn', text: `Peso estable ${Math.round(win / 7)} semanas con buena actividad. Sugerimos reducir 150 kcal (sin cambios extremos).`, action: { label: 'Bajar 150 kcal', delta: -150 } });
      }
      if (fat) out.push({ kind: 'warn', text: 'Has indicado fatiga alta: esta semana reducimos accesorios, mantenemos los básicos y el cardio se queda en zona suave.' });
      const str = PE.strengthIndex(); if (str.ok && str.pct < -3) out.push({ kind: 'warn', text: 'La fuerza ha caído más de un 3%. Revisa el descanso y no bajes más las calorías por ahora.' });
      return out;
    },
    // Logros: se calculan con datos reales y se guardan al desbloquearse
    checkAchievements() {
      const u = DB.user(); if (!u) return []; const have = DB.all('achievements').map(a => a.type); const now = [];
      const st = PR.weightStats(); const w = PRG.week();
      const cond = {
        week1: () => U.diffDays(PRG.start(), U.today()) >= 7 && PR.workoutsInWeek(1).length >= 1,
        kg5: () => st && st.avg7 != null && u.initial_weight - st.avg7 >= 5,
        w10: () => DB.where('workout_logs', l => l.completed).length >= 10,
        steps100k: () => PR.totalSteps() >= 100000,
        pullup1: () => DB.where('set_logs', s => s.exercise_id === 'pullup' && s.completed && s.reps >= 1).length > 0,
        pr: () => FORGE.EXERCISES.filter(e => e.main).some(e => { const c = PE.prCard(e.id); return c && c.sessions >= 2 && c.pct > 0; }),
        half: () => st && st.pct >= 50,
        goal: () => st && st.avg7 != null && st.avg7 <= u.target_weight
      };
      FORGE.ACHIEVEMENTS.forEach(a => { if (!have.includes(a.id) && cond[a.id] && cond[a.id]()) { DB.insert('achievements', { user_id: u.id, type: a.id, date: U.today() }); now.push(a); } });
      return now;
    },
    dayMarks(date) {
      return { w: DB.where('workout_logs', l => l.completed && l.date === date).length > 0, n: NE.dayIntake(date).n > 0, p: DB.where('weight_logs', x => x.date === date).length > 0, f: DB.where('progress_photos', x => x.date === date).length > 0, s: ((PR.activity(date) || {}).steps || 0) > 0 };
    },
    transformation() {
      const u = DB.user(); const st = PR.weightStats(); const waist = PR.measureDelta('waist'); const str = PE.strengthIndex();
      const workouts = DB.where('workout_logs', l => l.completed).length; const days = DB.all('daily_activity').filter(a => a.steps > 0);
      const w = PRG.week(); const ad = []; for (let i = 1; i <= w; i++) { const a = PR.adherence(i); if (a.total != null) ad.push(a.total); }
      return { u, st, waist, str, workouts, stepsAvg: days.length ? U.avg(days.map(a => a.steps)) : null, adherence: ad.length ? U.avg(ad) : null };
    }
  };

  /* ═══════ NOTIFICATION ENGINE ═══════
     Genera avisos con categoría, estilo (lima / azul / rojo) y acción,
     los guarda en la tabla «alerts» (centro de avisos) y, si hay permiso, los envía al sistema. */
  const NO = FORGE.notifications = {
    init() { const have = DB.all('notifications').map(n => n.type); const u = DB.user(); FORGE.DEFAULT_NOTIFICATIONS.forEach(n => { if (!have.includes(n.type)) DB.insert('notifications', { user_id: u ? u.id : null, type: n.type, label: n.label, text: n.text, scheduled_time: n.time, enabled: n.enabled }); }); },
    permission: () => ('Notification' in window) ? Notification.permission : 'unsupported',
    async request() { if (!('Notification' in window)) return 'unsupported'; try { return await Notification.requestPermission(); } catch { return 'denied'; } },
    /* push(title, body, opts): opts = { category, kind: 'lime'|'blue'|'red', icon, action:{label,tab,view,params}, progress:{pct}, type } */
    push(title, body, opts = {}) {
      const u = DB.user(); const now = new Date();
      DB.removeWhere('alerts', x => x.date === U.today() && x.type === (opts.type || 'info') && x.title === title);
      const a = DB.insert('alerts', { user_id: u ? u.id : null, type: opts.type || 'info', category: opts.category || 'Aviso', kind: opts.kind || 'lime', icon: opts.icon || 'bell', title, body, action: opts.action || null, progress: opts.progress || null, at: now.toISOString(), date: U.today(), read: false });
      const all = DB.all('alerts'); if (all.length > 60) { all.sort((x, y) => x.at < y.at ? -1 : 1); DB.removeWhere('alerts', r => all.slice(0, all.length - 60).some(o => o.id === r.id)); }
      if (FORGE.ui && !(FORGE.session && FORGE.session.active) && !(FORGE.itimer && FORGE.itimer.active) && FORGE.ui.state.tab === 'hoy' && !document.getElementById('sheet')) FORGE.ui.render();
      if ('Notification' in window && Notification.permission === 'granted') { try { new Notification(title, { body, tag: 'forge-' + (opts.type || title) }); } catch { } }
      return a;
    },
    unread: () => DB.where('alerts', a => !a.read).length,
    markAllRead() { let ch = false; DB.all('alerts').forEach(a => { if (!a.read) { a.read = true; ch = true; } }); if (ch) DB.save(); },
    // Mensaje dinámico según el tipo (solo si tiene sentido en este momento)
    compose(n) {
      const t = U.today(), w = PRG.week(), d = PRG.dayOfWeek(); const u = DB.user(); const plan = NO.todayPlan(); const act = FORGE.progress.activity(t) || {};
      switch (n.type) {
        case 'morning': return { title: 'Buenos días', body: plan.workout ? `Hoy toca ${plan.workout.name} (${plan.workout.duration} min), ${U.int(PRG.stepsGoal(w))} pasos y ${U.int((NE.planFor(w) || {}).calories)} kcal.` : `Hoy: ${plan.cardio ? plan.cardio.name : 'descanso activo'}, ${U.int(PRG.stepsGoal(w))} pasos.`, category: 'Resumen', icon: 'home', action: { label: 'Ver el día', tab: 'hoy' } };
        case 'workout': if (!plan.workout || FORGE.progress.workoutDoneToday(plan.workout.id)) return null; return { title: '¡Es hora de entrenar!', body: `Hoy toca: ${plan.workout.name} · ${plan.workout.duration} min`, category: 'Entrenamiento', icon: 'train', action: { label: 'Ver rutina', tab: 'entrenar', view: 'workout', params: { id: plan.workout.id } } };
        case 'meal_comida': case 'meal_cena': { const type = n.type.split('_')[1]; const m = NE.mealsFor(w, d).find(x => x.meal_type === type); if (!m || NE.isLogged(m.id, t)) return null; return { title: type === 'cena' ? 'Hora de cenar' : 'Hora de comer', body: FORGE.recipe(m.recipe_id).name, category: 'Comida', icon: 'food', action: { label: 'Ver receta', tab: 'nutricion', view: 'recipe', params: { meal: m.id, date: t } } }; }
        case 'steps': { const s = act.steps || 0; const g = PRG.stepsGoal(w); if (s >= g) return null; return { title: `Te quedan ${U.int(g - s)} pasos`, body: `Llevas ${U.int(s)} de ${U.int(g)} hoy. Un paseo de 15 minutos lo resuelve.`, category: 'Actividad', icon: 'steps', progress: { pct: s / g * 100 }, action: { label: 'Registrar pasos', act: 'steps-sheet' } }; }
        case 'water': { const v = act.water || 0; const g = NE.waterGoal(); if (v >= g * 0.6) return null; return { title: '¡Bebe agua!', body: `Llevas ${U.n(v, 1)} L de ${U.n(g, 1)} L hoy`, category: 'Hidratación', icon: 'drop', progress: { pct: v / g * 100 } }; }
        case 'weight': { const last = FORGE.progress.weights().slice(-1)[0]; const gap = last ? U.diffDays(last.date, t) : 99; if (gap === 0) return null; if (gap >= 2) return { title: `Llevas ${gap === 99 ? 'días' : gap + ' días'} sin registrar tu peso`, body: 'Mantén tu seguimiento al día para ver tu progreso', category: 'Atención', kind: 'red', icon: 'alert', action: { label: 'Registrar ahora', act: 'weight-sheet' } }; return { title: 'Recuerda registrar tu peso', body: 'Mejor en ayunas, a la misma hora', category: 'Peso', icon: 'scale', action: { label: 'Registrar', act: 'weight-sheet' } }; }
        case 'rest': return { title: 'Es hora de descansar', body: 'Dormir bien también te acerca a tus objetivos', category: 'Recuerdo', kind: 'blue', icon: 'moon', action: { label: 'Más consejos', tab: 'perfil', view: 'ayuda' } };
        case 'measures': { if (U.dow(t) !== 1) return null; const last = FORGE.progress.measurements().slice(-1)[0]; if (last && U.diffDays(last.date, t) < 7) return null; return { title: 'Actualiza tus medidas', body: 'Es momento de registrar tu progreso semanal', category: 'Medidas', icon: 'progress', action: { label: 'Registrar', act: 'measure-sheet' } }; }
        case 'review': if (U.dow(t) !== 0) return null; return { title: 'Tu semana está lista', body: 'Revisa peso, fuerza, pasos y nutrición de la semana', category: 'Revisión', icon: 'trophy', action: { label: 'Ver semana', tab: 'progreso', view: 'semana' } };
        default: return null;
      }
    },
    todayPlan(date = U.today()) {
      const u = DB.user(); const w = PRG.week(date), d = PRG.dayOfWeek(date); const days = (u && u.training_days) || C.DEFAULT_TRAINING_DAYS;
      const idx = days.indexOf(d);
      if (idx >= 0) return { workout: FORGE.workoutTemplate(['A', 'B', 'C', 'D'][idx % 4], w), cardio: null, rest: false };
      const free = [1, 2, 3, 4, 5, 6].filter(x => !days.includes(x));
      if (d === 7) return { workout: null, cardio: null, rest: true };
      const cm = FORGE.PROGRAM.cardio; const isInt = free[0] === d && w >= 2;
      return { workout: null, cardio: isInt ? { ...cm.intervals, detail: cm.intervals.byWeek[Math.min(w, 12) - 1], minutes: 25 } : { ...cm.moderate, detail: `${cm.moderate.minutesByWeek[Math.min(w, 12) - 1]} min en zona 2`, minutes: cm.moderate.minutesByWeek[Math.min(w, 12) - 1] }, rest: false };
    },
    tick() {
      const now = new Date(); const hm = U.pad(now.getHours()) + ':' + U.pad(now.getMinutes()); const t = U.today();
      const fired = DB.meta().notified || {}; let changed = false;
      DB.all('notifications').filter(n => n.enabled && n.scheduled_time <= hm).forEach(n => {
        if (fired[n.type] === t) return; fired[n.type] = t; changed = true;
        const m = NO.compose(n); if (m) NO.push(m.title, m.body, { ...m, type: n.type });
      });
      if (changed) DB.setMeta({ notified: fired });
    }
  };
})();
