    's-rest-add': d => { S.rest = Math.max(1, S.rest + (+d.d || 30)); S.restTotal = Math.max(S.restTotal, S.rest); S.paintRest(); },
    's-rest-pause': () => { S.paused = !S.paused; S.render(); },
    's-rest-skip': () => S.endRest(),
    's-rpe': d => { S.rpe = +d.v; S.render(); },
    's-rir': d => { S.rir = +d.v; S.render(); },
    's-next': () => S.nextEx(),
    'session-skip-ex': async () => { if (S.phase === 'rest') clearInterval(S.timer); const ok = await UI.confirm('Saltar ejercicio', 'Las series ya completadas se conservan. ¿Pasamos al siguiente?', 'Saltar'); if (!ok) { if (S.phase === 'rest') S.startRest(S.rest); return; } if (S.exIdx + 1 < S.plan.exercises.length) { S.exIdx++; S.loadEx(); S.render(); } else S.finish(); },
    'session-exit': async () => { clearInterval(S.timer); const n = DB.where('set_logs', s => s.workout_log_id === S.log.id).length; const ok = await UI.confirm('Salir de la sesión', n ? `Has registrado ${n} series. Se guardan y podrás retomar la sesión hoy desde donde la dejaste.` : 'No has registrado ninguna serie. La sesión se descartará.', 'Salir'); if (!ok) { if (S.phase === 'rest') S.startRest(S.rest); return; } if (!n) DB.remove('workout_logs', S.log.id); else DB.update('workout_logs', S.log.id, { duration: (S.log.duration || 0) + Math.round((Date.now() - S.startedAt) / 60000) }); S.unmount(); UI.render(); }
  });
})();
</script>
<script>
/* ═══════════════════════════════════════════════
   FORGE · NUTRICIÓN: menú semanal, recetas, sustitución, lista de compra
   ═══════════════════════════════════════════════ */
(function () {
  const U = FORGE.U, C = FORGE.CONFIG, DB = FORGE.db, UI = FORGE.ui, CP = FORGE.cp, I = FORGE.icons, e = U.esc;
  const PRG = FORGE.program, PR = FORGE.progress, NE = FORGE.nutrition, NO = FORGE.notifications;
  const macroBar = (label, v, goal, unit) => `<div class="macro"><b class="num">${U.int(v)}</b><span>${label}</span>${CP.ProgressBar(goal ? v / goal * 100 : 0, v > goal * 1.1 ? '' : 'good')}<span class="num" style="text-transform:none;letter-spacing:0">${U.int(goal)} ${unit}</span></div>`;

  UI.screens.nutricion = {
    render(view, p) {
      if (view === 'recipe') return this.recipe(p);
      if (view === 'compra') return this.compra(p);
      if (view === 'objetivos') return this.plan();
      if (view === 'plan') return this.weekPlan(p);
      if (view === 'recetas') return this.recetas(p);
      const w = p.week || PRG.week(); const today = U.today(); const dates = PRG.weekDates(w);
      const day = p.day || (w === PRG.week() ? PRG.dayOfWeek() : 1); const date = dates[day - 1];
      const plan = NE.planFor(w); const meals = NE.mealsFor(w, day); const intake = NE.dayIntake(date);
      const tabs = `<div class="daytabs">${dates.map((dt, i) => `<button class="${i + 1 === day ? 'on' : ''}${dt === today ? ' today' : ''}" data-act="go" data-tab="nutricion" data-params='{"week":${w},"day":${i + 1}}'><b>${U.parse(dt).getDate()}</b><span>${C.DOW[U.dow(dt)]}</span></button>`).join('')}</div>`;
      const nav = `<div class="row between" style="margin-bottom:10px"><button class="btn quiet sm" data-act="go" data-tab="nutricion" data-params='{"week":${Math.max(1, w - 1)}}' ${w <= 1 ? 'disabled' : ''}>‹ Semana ${w - 1}</button><span class="eyebrow">Semana ${w}</span><button class="btn quiet sm" data-act="go" data-tab="nutricion" data-params='{"week":${w + 1}}' ${w >= PRG.week() + 1 ? 'disabled' : ''}>Semana ${w + 1} ›</button></div>`;
      const rem = Math.max(0, plan.calories - intake.calories); const pc = v => Math.min(100, v);
      const mrow = (l, v, g, unit) => `<div class="mbar"><span>${l}</span><span class="v num">${U.int(v)} / ${U.int(g)} ${unit}</span><span class="p num">${U.int(pc(v / g * 100))}%</span>${CP.ProgressBar(pc(v / g * 100), v > g * 1.1 ? '' : '')}</div>`;
      return `<div class="screen">${UI.header('Nutrición', `Objetivo ${U.int(plan.calories)} kcal · ${plan.protein} g proteína`, `<div class="row" style="gap:8px"><button class="ringbtn" data-act="go" data-tab="nutricion" data-view="recetas" aria-label="Recetas">${I.food}</button><button class="ringbtn" data-act="go" data-tab="nutricion" data-view="objetivos" aria-label="Objetivos">${I.ruler}</button></div>`)}
        ${nav}${tabs}
        <div class="panel" style="margin-top:14px"><div class="rings2"><div>${CP.ProgressRing({ pct: intake.calories / plan.calories * 100, big: U.int(intake.calories), small: 'kcal', size: 124 })}<div class="lbl">Consumidas</div></div><div>${CP.ProgressRing({ pct: rem / plan.calories * 100, big: U.int(rem), small: 'kcal', size: 124, cls: 'good' })}<div class="lbl">Restantes</div></div></div>
        <div class="divider"></div>${mrow('Proteínas', intake.protein, plan.protein, 'g')}${mrow('Carbohidratos', intake.carbs, plan.carbs, 'g')}${mrow('Grasas', intake.fat, plan.fat, 'g')}</div>
        <div class="tabs" style="margin-top:16px"><button class="on">Comidas</button><button data-act="go" data-tab="nutricion" data-view="plan" data-params='{"week":${w}}'>Plan semanal</button></div>
        <div class="section" style="margin-top:0"><div class="section-title"><h2>${date === today ? 'Hoy' : U.fmtDate(date, true)}</h2><span class="eyebrow">${intake.n}/4 registradas</span></div>
        <div class="stack">${meals.map(m => CP.MealCard(m, date, { time: true })).join('')}</div>
        ${(() => { const fl = NE.freeLogs(date); return `<div class="section"><div class="section-title"><h2>Fuera del plan</h2><span class="eyebrow">${fl.length ? fl.length + (fl.length === 1 ? ' registrada' : ' registradas') : ''}</span></div>${fl.length ? `<div class="stack" style="margin-bottom:10px">${fl.map(l => CP.FreeMealCard(l)).join('')}</div>` : ''}${date <= today ? `<button class="btn ghost block" data-act="free-meal" data-date="${date}">+ Comí otra cosa</button>` : ''}</div>`; })()}
        <p class="muted" style="font-size:var(--fs-xs);margin-top:12px">Total del menú: ${U.int(U.sum(meals.map(m => m.calories)))} kcal · ${U.sum(meals.map(m => m.protein))} g proteína. Las comidas se generan cada semana sin repetir recetas y se pueden cambiar por equivalentes.</p><button class="btn ghost block pill" style="margin-top:10px" data-act="go" data-tab="nutricion" data-view="compra" data-params='{"week":${w}}'>Lista de compra de la semana ${w}</button></div>${date <= today ? `<button class="fab" data-act="free-meal" data-date="${date}" aria-label="Comí otra cosa">${I.plus}</button>` : ''}</div>`;
    },
    weekPlan(p) {
      const w = (p && p.week) || PRG.week(); const dates = PRG.weekDates(w); const today = U.today(); NE.generateWeek(w);
      const rows = dates.map((dt, i) => { const plan = NO.todayPlan(dt); const ms = NE.mealsFor(w, i + 1); const logged = ms.filter(m => NE.isLogged(m.id, dt)).length; const kcal = U.sum(ms.map(m => m.calories)); const doneW = plan.workout ? !!PR.workoutDoneToday(plan.workout.id, dt) : plan.cardio ? DB.where('cardio_logs', c => c.date === dt).length > 0 : false; const icon = plan.workout ? 'train' : plan.cardio ? 'heart' : 'moon'; return `<div class="arow" data-act="go" data-tab="nutricion" data-params='{"week":${w},"day":${i + 1}}'><div class="ring-ico sm ${doneW ? 'done' : plan.rest ? 'blue' : dt === today ? '' : 'muted'}">${doneW ? FORGE.tabIcons.check : FORGE.tabIcons[icon]}</div><div class="b"><b>${C.DOW_LONG[U.dow(dt)]} ${U.parse(dt).getDate()}${dt === today ? ' · hoy' : ''}</b><span>${plan.workout ? plan.workout.name : plan.cardio ? plan.cardio.name : 'Descanso'} · ${U.int(kcal)} kcal · ${ms.map(m => FORGE.recipe(m.recipe_id).emoji).join(' ')}</span></div><div class="r">${dt <= today ? `<span class="chip ${logged >= 4 ? 'good' : ''}">${logged}/4</span>` : ''}</div></div>`; }).join('');
      return `<div class="screen">${UI.backBtn('Nutrición')}${UI.header('Plan semanal', `Semana ${w} · ${U.fmtDate(dates[0])} – ${U.fmtDate(dates[6])}`)}
        <div class="row between" style="margin-bottom:10px"><button class="btn quiet sm" data-act="go" data-tab="nutricion" data-view="plan" data-params='{"week":${w - 1}}' ${w <= 1 ? 'disabled' : ''}>‹ Semana ${w - 1}</button><button class="btn quiet sm" data-act="go" data-tab="nutricion" data-view="plan" data-params='{"week":${w + 1}}' ${w >= PRG.week() + 1 ? 'disabled' : ''}>Semana ${w + 1} ›</button></div>
        <div class="panel tight"><div class="agenda">${rows}</div></div>
        <div class="row" style="gap:8px;margin-top:12px"><button class="btn ghost pill" style="flex:1" data-act="go" data-tab="nutricion" data-view="compra" data-params='{"week":${w}}'>Lista de compra</button><button class="btn ghost pill" style="flex:1" data-act="menu-regen" data-week="${w}">Regenerar menú</button></div></div>`;
    },
    recetas(p) {
      const f = (p && p.f) || 'todas'; const q = ((p && p.q) || '').toLowerCase(); const u = DB.user();
      const list = FORGE.RECIPES.filter(r => NE.allowed(r, u.diet_tags || [])).filter(r => f === 'todas' || r.type === f).filter(r => !q || r.name.toLowerCase().includes(q));
      const filters = [['todas', 'Todas'], ['desayuno', 'Desayunos'], ['comida', 'Comidas'], ['merienda', 'Meriendas'], ['cena', 'Cenas']];
      return `<div class="screen">${UI.backBtn('Nutrición')}${UI.header('Recetas', `${list.length} recetas`)}
        <input type="search" id="rq" placeholder="Buscar recetas…" value="${e(q)}" style="margin-bottom:10px">
        <div class="pills" style="margin-bottom:14px">${filters.map(([k, l]) => `<button class="pill${f === k ? ' on' : ''}" data-act="go" data-tab="nutricion" data-view="recetas" data-params='{"f":"${k}","q":"${e(q)}"}'>${l}</button>`).join('')}</div>
        <div class="rgrid">${list.map(r => { const m = NE.recipeMacros(r, 1); return `<div class="rcard" data-act="recipe-info" data-id="${r.id}"><div class="ph">${r.emoji}</div><div class="rb"><b>${e(r.name)}</b><span>${U.int(m.calories)} kcal · ${r.time} min</span></div></div>`; }).join('')}</div>
        ${list.length ? '' : CP.Empty('Sin resultados', 'Prueba con otra palabra o filtro.')}</div>`;
    },
    recipe(p) {
      const m = DB.get('meals', p.meal); if (!m) return `<div class="screen">${UI.backBtn()}${CP.Empty('Receta no encontrada', '')}</div>`;
      const r = FORGE.recipe(m.recipe_id); const log = DB.where('meal_logs', l => l.meal_id === m.id && l.date === p.date)[0]; const eaten = !!log;
      return `<div class="screen">${UI.backBtn('Menú')}<div class="recipe-hero" ${log && log.photo_id ? `data-photo-id="${log.photo_id}"` : ''}>${r.emoji}</div><div class="eyebrow accent" style="margin-top:16px">${C.MEAL_LABEL[m.meal_type]} · ${r.time} min</div><h1 style="font-size:var(--fs-2xl);margin:4px 0 12px">${e(r.name)}</h1>
        <div class="macro-row"><div class="macro"><b class="num">${U.int(m.calories)}</b><span>kcal</span></div><div class="macro"><b class="num">${m.protein}</b><span>proteína</span></div><div class="macro"><b class="num">${m.carbs}</b><span>carbos</span></div><div class="macro"><b class="num">${m.fat}</b><span>grasa</span></div></div>
        <div class="row" style="margin-top:14px;gap:8px">${eaten ? `<button class="btn ghost block" data-act="meal-unlog" data-meal="${m.id}" data-date="${p.date}">Registrado ✓ · deshacer</button>` : `<button class="btn primary big block display" data-act="meal-log" data-meal="${m.id}" data-date="${p.date}">He comido esto</button>`}<button class="btn ghost big" data-act="meal-swap" data-meal="${m.id}" data-date="${p.date}">${I.swap.replace('<svg', '<svg style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2"')}</button></div>
        <div class="section"><div class="section-title"><h2>Ingredientes</h2><span class="eyebrow">ración ×${U.n(m.scale, 2)}</span></div><div class="panel tight">${r.ingredients.map(i => { const f = FORGE.food(i.food); const g = Math.round(i.grams * m.scale / 5) * 5; return `<div class="ingr"><span>${e(f.name)}</span><span class="num t2">${f.id === 'huevo' ? Math.max(1, Math.round(g / 60)) + ' ud' : f.id === 'aceite' ? g + ' ml' : g + ' g'}</span></div>`; }).join('')}</div></div>
        <div class="section"><div class="section-title"><h2>Preparación</h2></div><ol class="steps">${r.steps.map(s => `<li>${e(s)}</li>`).join('')}</ol></div></div>`;
    },
    compra(p) {
      const w = p.week || PRG.week(); const groups = NE.shoppingList(w); const checks = (DB.meta().shopping || {})[w] || {};
      const total = groups.reduce((n, g) => n + g.items.length, 0), done = groups.reduce((n, g) => n + g.items.filter(i => checks[i.food.id]).length, 0);
      return `<div class="screen">${UI.backBtn('Menú')}${UI.header('Lista de compra', `Semana ${w} · ${done}/${total} productos`)}${CP.ProgressBar(total ? done / total * 100 : 0, 'good')}
        ${groups.map(g => `<div class="shop-group"><h3>${g.title}</h3>${g.items.map(i => `<div class="shop-item${checks[i.food.id] ? ' on' : ''}" data-act="shop-toggle" data-week="${w}" data-food="${i.food.id}"><div class="box">${checks[i.food.id] ? I.check.replace('<svg', '<svg style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:3"') : ''}</div><span>${e(i.food.name)}</span><span class="q">${i.label}</span></div>`).join('')}</div>`).join('')}
        <button class="btn quiet block" style="margin-top:16px" data-act="shop-clear" data-week="${w}">Desmarcar todo</button></div>`;
    },
    plan() {
      const w = PRG.week(); const plan = NE.planFor(w); const u = DB.user(); const base = NE.baseTargets(u, PR.trendAt(U.today()) || u.initial_weight);
      return `<div class="screen">${UI.backBtn('Nutrición')}${UI.header('Objetivos', `Semana ${w}`)}
        <div class="panel"><div class="eyebrow">Calculado para ti</div><p class="t2" style="font-size:var(--fs-sm);margin:6px 0 12px">Gasto estimado con Mifflin-St Jeor y tu actividad, con un déficit moderado. Recomendado ahora: <b class="num" style="color:var(--text)">${U.int(base.calories)} kcal · ${base.protein} g proteína · ${base.fat} g grasa</b>. Ajuste acumulado aplicado: <b class="num" style="color:var(--text)">${plan.adjust > 0 ? '+' : ''}${plan.adjust || 0} kcal</b>.</p>
        <div class="stack"><div class="grid2">${UI.field('Calorías', `<input type="number" inputmode="numeric" id="p-kcal" value="${plan.calories}">`)}${UI.field('Proteína (g)', `<input type="number" inputmode="numeric" id="p-prot" value="${plan.protein}">`)}</div><div class="grid2">${UI.field('Grasas (g)', `<input type="number" inputmode="numeric" id="p-fat" value="${plan.fat}">`)}${UI.field('Carbohidratos (g)', `<input type="number" inputmode="numeric" id="p-carb" value="${plan.carbs}" readonly style="opacity:.7">`)}</div><div class="muted" style="font-size:var(--fs-xs)">Los carbohidratos se calculan con lo que queda tras proteína y grasa.</div><div id="p-err" class="bad" style="font-size:var(--fs-xs)"></div><button class="btn primary block display" data-act="plan-save">Guardar objetivos</button></div></div>
        <div class="section"><div class="section-title"><h2>Preferencias</h2></div><div class="panel tight"><div class="pills">${Object.entries(FORGE.DIET_TAGS).map(([k, l]) => `<button class="pill${(u.diet_tags || []).includes(k) ? ' on' : ''}" data-act="diet-toggle" data-k="${k}">${l}</button>`).join('')}</div><p class="muted" style="font-size:var(--fs-xs);margin-top:10px">Se aplican a los menús que se generen a partir de ahora.</p></div></div>
        <div class="section"><div class="section-title"><h2>Menú de la semana</h2></div><button class="btn ghost block" data-act="menu-regen" data-week="${w}">Regenerar el menú de la semana ${w}</button><p class="muted" style="font-size:var(--fs-xs);margin-top:8px">Genera una combinación nueva de recetas con los objetivos actuales. Las comidas ya registradas se conservan en tu historial.</p></div></div>`;
    },
    after() { const rq = document.getElementById('rq'); if (rq) { rq.focus({ preventScroll: true }); rq.setSelectionRange(rq.value.length, rq.value.length); rq.addEventListener('input', U.debounce(() => UI.go('nutricion', 'recetas', { f: (UI.state.params || {}).f || 'todas', q: rq.value }), 350)); }
      const k = document.getElementById('p-kcal'); if (k) { const upd = () => { const kcal = +k.value, p = +document.getElementById('p-prot').value, f = +document.getElementById('p-fat').value; document.getElementById('p-carb').value = Math.max(0, Math.round((kcal - p * 4 - f * 9) / 4)); }; ['p-kcal', 'p-prot', 'p-fat'].forEach(id => document.getElementById(id).addEventListener('input', upd)); } }
  };

  /* Comida fuera del plan: a ojo o desde el catálogo, con foto opcional */
  const FM = { mode: 'ojo', items: [], q: '', photo: null };
  function freeBody(date) {
    const t = NE.itemsMacros(FM.items); const hour = new Date().getHours(); const defType = hour < 11 ? 'desayuno' : hour < 16 ? 'comida' : hour < 19 ? 'merienda' : 'cena';
    const types = ['desayuno', 'comida', 'merienda', 'cena', 'otro'];
    const results = FM.q.length >= 2 ? FORGE.FOODS.filter(f => f.name.toLowerCase().includes(FM.q.toLowerCase())).slice(0, 8) : [];
    return `<h2>Comí otra cosa</h2><p class="t2" style="font-size:var(--fs-sm);margin-bottom:10px">${U.fmtDate(date, true)} · se suma a las calorías del día.</p>
      <div class="seg" style="margin-bottom:12px"><button class="${FM.mode === 'ojo' ? 'on' : ''}" data-fm="ojo">A ojo</button><button class="${FM.mode === 'cat' ? 'on' : ''}" data-fm="cat">Catálogo</button></div>
      <div class="stack">
        ${UI.field('Tipo de comida', `<select id="fm-type">${types.map(x => `<option value="${x}" ${x === (FM.type || defType) ? 'selected' : ''}>${C.MEAL_LABEL[x]}</option>`).join('')}</select>`)}
        ${FM.mode === 'ojo' ? `${UI.field('Qué has comido', `<input type="text" id="fm-name" placeholder="Ej.: bocadillo de lomo con queso" value="${e(FM.name || '')}">`)}<div class="grid2">${UI.field('Calorías (kcal)', `<input type="number" inputmode="numeric" id="fm-kcal" placeholder="600" value="${FM.kcal || ''}">`)}${UI.field('Proteína (g)', `<input type="number" inputmode="numeric" id="fm-prot" placeholder="30" value="${FM.prot || ''}">`)}</div><div class="grid2">${UI.field('Carbohidratos (g) · opcional', `<input type="number" inputmode="numeric" id="fm-carb" placeholder="—" value="${FM.carb || ''}">`)}${UI.field('Grasa (g) · opcional', `<input type="number" inputmode="numeric" id="fm-fat" placeholder="—" value="${FM.fat || ''}">`)}</div>`
        : `${UI.field('Buscar alimento', `<input type="search" id="fm-q" placeholder="pollo, arroz, pan…" value="${e(FM.q)}" autocomplete="off">`)}<div class="results" id="fm-results" ${results.length ? '' : 'style="display:none"'}>${results.map(f => `<button data-add="${f.id}">${e(f.name)}<span>${f.calories} kcal/100 g</span></button>`).join('')}</div>
          <div class="panel tight" id="fm-items">${FM.items.length ? FM.items.map((i, k) => `<div class="free-item"><span style="flex:1">${e(FORGE.food(i.food).name)}</span><input type="number" inputmode="numeric" value="${i.grams}" data-g="${k}"><span class="muted" style="font-size:var(--fs-xs)">g</span><button class="btn quiet sm" data-rm="${k}">✕</button></div>`).join('') + `<div class="row between" style="padding-top:10px;font-size:var(--fs-sm)"><b>Total</b><span class="num t2">${t.calories} kcal · ${t.protein} g prot · ${t.carbs} g carb · ${t.fat} g grasa</span></div>` : '<div class="muted" style="font-size:var(--fs-sm);text-align:center;padding:6px">Busca y añade alimentos con sus gramos.</div>'}</div>`}
        <label class="btn ghost block">📷 ${FM.photo ? 'Foto añadida ✓ (cambiar)' : 'Añadir foto (opcional)'}<input type="file" accept="image/*" capture="environment" class="hide" id="fm-photo"></label>
        <div id="fm-err" class="bad" style="font-size:var(--fs-xs)"></div>
        <button class="btn primary big block display" id="fm-save">Registrar</button></div>`;
  }
  function openFree(date) {
    Object.assign(FM, { mode: FM.mode || 'ojo', items: [], q: '', photo: null, name: '', kcal: '', prot: '', carb: '', fat: '', type: null });
    const bg = UI.sheet(freeBody(date), wire);
    function readInputs() { const g = id => { const el = bg.querySelector('#' + id); return el ? el.value : undefined; }; ['name', 'kcal', 'prot', 'carb', 'fat'].forEach(k => { const v = g('fm-' + k); if (v !== undefined) FM[k] = v; }); const ty = g('fm-type'); if (ty) FM.type = ty; }
    function rerender() { readInputs(); bg.querySelector('.sheet').innerHTML = '<div class="grip"></div>' + freeBody(date); wire(bg); }
    function wire(bg) {
      bg.querySelectorAll('[data-fm]').forEach(b => b.onclick = () => { readInputs(); FM.mode = b.dataset.fm; rerender(); });
      const q = bg.querySelector('#fm-q'); if (q) { q.focus(); q.addEventListener('input', () => { FM.q = q.value; const res = FORGE.FOODS.filter(f => FM.q.length >= 2 && f.name.toLowerCase().includes(FM.q.toLowerCase())).slice(0, 8); const box = bg.querySelector('#fm-results'); box.style.display = res.length ? '' : 'none'; box.innerHTML = res.map(f => `<button data-add="${f.id}">${e(f.name)}<span>${f.calories} kcal/100 g</span></button>`).join(''); wireAdd(); }); }
      function wireAdd() { bg.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { const f = FORGE.food(b.dataset.add); const def = { huevo: 120, aceite: 10, pan: 80, arroz: 80, pasta: 80, avena: 60, whey: 30, almendras: 25, nueces: 20 }[f.id] || (f.section === 'carniceria' || f.section === 'pescaderia' ? 150 : 100); FM.items.push({ food: f.id, grams: def }); FM.q = ''; rerender(); }); }
      wireAdd();

      const carbs = Math.round((kcal - p * 4 - f * 9) / 4); if (carbs < 50) return err.textContent = 'Con esos valores quedan muy pocos carbohidratos. Sube calorías o baja proteína/grasa.';
      const w = PRG.week(); const plan = NE.planFor(w); const u = DB.user(); const base = NE.baseTargets(u, PR.trendAt(U.today()) || u.initial_weight);
      DB.update('nutrition_plans', plan.id, { calories: kcal, protein: p, fat: f, carbs, adjust: kcal - base.calories }); DB.setMeta({ kcal_adjust: kcal - base.calories });

        <button class="btn ghost block pill" style="margin-top:12px" data-act="measure-sheet">Registrar nuevas medidas</button>

        </div></div>`;
    },

    medidas(p) {

          <div class="seg" style="margin-bottom:8px">${PTYPES.map(([t, l]) => `<button class="${sel === t ? 'on' : ''}" data-act="go" data-tab="progreso" data-view="fotos" data-params='{"type":"${t}","vs":"${cmp}"}'>${{ front: 'Frontal', left: 'Izq.', right: 'Dcha.', back: 'Espalda' }[t]}</button>`).join('')}</div>
          <div class="pills" style="margin-bottom:12px">${opts.map(([v, l]) => `<button class="pill${cmp === v ? ' on' : ''}" data-act="go" data-tab="progreso" data-view="fotos" data-params='{"type":"${sel}","vs":"${v}"}'>Semana 1 vs ${l}</button>`).join('')}</div>
          <div id="compare-box">${CP.PhotoComparison(before ? { src: '' } : null, after ? { src: '' } : null, [before ? `Semana ${weekOf(before.date)} · ${U.fmtDate(before.date)}` : '', after ? `Semana ${weekOf(after.date)} · ${U.fmtDate(after.date)}` : ''])}</div>

    },
    marcas(p) {
      const mains = FORGE.EXERCISES.filter(x => x.main); const sel = (p && p.ex) || 'squat';
      const cards = mains.map(ex => { const c = PE.prCard(ex.id); return `<div class="pr" data-act="go" data-tab="progreso" data-view="marcas" data-params='{"ex":"${ex.id}"}' style="cursor:pointer;${sel === ex.id ? 'border-color:var(--accent)' : ''}"><div class="row between"><div class="row" style="gap:10px"><div class="ring-ico sm ${c && c.pct > 0 ? '' : 'muted'}">${FORGE.tabIcons.train}</div><b>${e(ex.name)}</b></div><span class="eyebrow">${c ? c.sessions + ' ses.' : 'sin datos'}</span></div>${c ? `<div class="grid3" style="margin-top:10px"><div><b class="num">${U.kg(c.last.weight).replace(' kg', '')}<small>kg × ${c.last.reps}</small></b><span>Actual</span></div><div><b class="num">${U.kg(c.first.weight).replace(' kg', '')}<small>kg × ${c.first.reps}</small></b><span>Inicial</span></div><div><b class="num ${c.pct > 0 ? 'good' : ''}">${c.pct != null && c.sessions >= 2 ? U.pct(c.pct) : '—'}</b><span>Progreso</span></div></div>` : `<div class="muted" style="font-size:var(--fs-sm);margin-top:6px">Se creará con tu primera sesión.</div>`}</div>`; }).join('');
      const c = PE.prCard(sel); const ex = FORGE.exercise(sel);
      const chart = c && c.series.length >= 2 ? CP.LineChart({ series: [{ points: c.series.map(s => ({ x: s.date, y: Math.round(s.v * 10) / 10 })), cls: 'line', area: true }], unit: ' kg e1RM', fmt: v => U.n(v, 0) }) : `<div class="empty">${c ? 'Con dos sesiones más verás la evolución del e1RM.' : 'Registra al menos 3 sesiones para comenzar a calcular tu tendencia de fuerza.'}</div>`;
      return `<div class="screen">${UI.backBtn('Progreso')}${UI.header('Fuerza', 'Marcas personales y e1RM estimado')}
        <div class="stack">${cards}</div>
        <div class="section"><div class="section-title"><h2>${e(ex.name)}</h2><span class="eyebrow">e1RM ${c && c.sessions ? U.kg(Math.round(c.e1rmBest)) : '—'}</span></div><div class="panel tight">${chart}</div><p class="muted" style="font-size:var(--fs-xs);margin-top:8px">e1RM = 1RM estimado con la fórmula de Epley a partir de tu mejor serie (peso × (1 + reps/30)). ${ex.bodyweight ? 'En dominadas se suma tu peso corporal al lastre.' : ''} No necesitas hacer levantamientos máximos.</p></div></div>`;
    },
    transformacion() {
      const t = PR.transformation(); const u = t.u; const st = t.st;
      const photos = DB.all('progress_photos').filter(x => x.type === 'front').sort((a, b) => a.date < b.date ? -1 : 1); const b = photos[0], a = photos.length > 1 ? photos[photos.length - 1] : null;
      return `<div class="screen">${UI.backBtn('Progreso')}${UI.header('Mi transformación', `Semana ${PRG.week()} · ${U.fmtDate(PRG.start())} → hoy`)}
        <div class="hero"><div class="eyebrow">Peso</div><div class="big num" style="margin-top:6px">${U.n(u.initial_weight, 0)} → ${st && st.avg7 != null ? U.n(st.avg7) : U.n(u.initial_weight, 0)}<span style="font-size:var(--fs-lg);color:var(--text-2);font-family:var(--font-body);font-weight:500;margin-left:6px">kg</span></div><div class="t2" style="font-size:var(--fs-sm);margin-top:4px">Objetivo ${U.n(u.target_weight, 0)} kg · ${st ? U.int(st.pct) : 0}% completado</div><div style="margin-top:12px">${CP.ProgressBar(st ? st.pct : 0, '', true)}</div></div>
        <div class="grid3" style="margin-top:16px">${CP.MetricCard({ label: 'Cintura', value: t.waist ? `${U.n(t.waist.first, 0)} → ${U.n(t.waist.last, 0)}` : '—', unit: t.waist ? 'cm' : '', delta: t.waist ? U.sign(t.waist.delta, 1, ' cm') : 'sin medidas', deltaCls: 'good' })}${CP.MetricCard({ label: 'Fuerza', value: t.str.ok ? U.pct(t.str.pct) : '—', delta: t.str.ok ? 'e1RM básicos' : 'mín. 3 sesiones', deltaCls: 'good' })}${CP.MetricCard({ label: 'Entrenamientos', value: t.workouts })}${CP.MetricCard({ label: 'Pasos', value: t.stepsAvg ? U.int(t.stepsAvg) : '—', unit: 'prom.' })}${CP.MetricCard({ label: 'Adherencia', value: t.adherence != null ? U.int(t.adherence) : '—', unit: '%' })}${CP.MetricCard({ label: 'Logros', value: DB.all('achievements').length, unit: `/ ${FORGE.ACHIEVEMENTS.length}` })}</div>
        <div class="section"><div class="section-title"><h2>Antes / después</h2><span class="eyebrow">frontal</span></div><div id="compare-box">${CP.PhotoComparison(b ? { src: '' } : null, a ? { src: '' } : null, [b ? `Semana ${PRG.week(b.date)}` : '', a ? `Semana ${PRG.week(a.date)}` : ''])}</div></div></div>`;
    },
    semana(p) {
      const cur = PRG.week(); const w = (p && p.week) || (U.dow(U.today()) === 0 ? cur : Math.max(1, cur - (PRG.dayOfWeek() < 7 && cur > 1 ? 1 : 0)));
      const r = PR.weeklyReport(w); const checkin = DB.where('checkins', c => c.week === cur && (c.cycle || 1) === PRG.cycle())[0];
      const feel = `<div class="panel"><div class="eyebrow accent">Semana ${cur}</div><h2 style="font-size:var(--fs-xl);margin:4px 0 12px">¿Cómo te sientes?</h2><div class="feel-grid">${[['muy_fatigado', '😴', 'Muy fatigado'], ['normal', '😐', 'Normal'], ['bien', '🙂', 'Bien'], ['excelente', '🔥', 'Excelente']].map(([v, ic, l]) => `<button class="${checkin && checkin.feeling === v ? 'on' : ''}" data-act="checkin" data-v="${v}"><span>${ic}</span>${l}</button>`).join('')}</div><p class="muted" style="font-size:var(--fs-xs);margin-top:10px">${checkin && checkin.feeling === 'muy_fatigado' ? 'Fatiga alta: esta semana reducimos accesorios y cardio intenso, mantenemos básicos y priorizamos descanso.' : 'Con fatiga alta reducimos accesorios y cardio intenso, manteniendo los ejercicios principales.'}</p></div>`;
      const nav = `<div class="row between" style="margin:14px 0 10px"><button class="btn quiet sm" data-act="go" data-tab="progreso" data-view="semana" data-params='{"week":${w - 1}}' ${w <= 1 ? 'disabled' : ''}>‹ Semana ${w - 1}</button><span class="eyebrow">Revisión</span><button class="btn quiet sm" data-act="go" data-tab="progreso" data-view="semana" data-params='{"week":${w + 1}}' ${w >= cur ? 'disabled' : ''}>Semana ${w + 1} ›</button></div>`;
      return `<div class="screen">${UI.backBtn('Progreso')}${UI.header('Tu semana', U.dow(U.today()) === 0 ? 'Domingo · día de revisión' : 'Cada domingo, resumen y ajustes')}${feel}${nav}${CP.WeeklyReport(r)}
        <div class="section"><div class="section-title"><h2>Recomendaciones</h2></div><div class="stack">${PR.recommendations().map(x => `<div class="banner ${x.kind === 'good' ? 'good' : x.kind === 'info' ? 'info' : ''}"><span>${e(x.text)}</span>${x.action ? `<button class="btn sm ghost" data-act="rec-apply" data-delta="${x.action.delta || ''}" data-steps="${x.action.steps || ''}">${e(x.action.label)}</button>` : ''}</div>`).join('')}</div></div></div>`;
    },
    calendario(p) {
      const t = U.today(); const base = (p && p.month) || t.slice(0, 7); const [y, m] = base.split('-').map(Number);
      const first = new Date(y, m - 1, 1); const start = U.mondayOf(U.iso(first)); const cells = [];
      for (let i = 0; i < 42; i++) cells.push(U.addDays(start, i));
      while (cells.length > 7 && cells.slice(-7).every(d => U.parse(d).getMonth() !== m - 1)) cells.splice(-7, 7);
      const sel = (p && p.date) || (base === t.slice(0, 7) ? t : null);
      const prevM = U.iso(new Date(y, m - 2, 1)).slice(0, 7), nextM = U.iso(new Date(y, m, 1)).slice(0, 7);
      const grid = `<div class="cal">${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(d => `<div class="dow">${d}</div>`).join('')}${cells.map(d => CP.CalendarDay(d, U.parse(d).getMonth() === m - 1, d <= t ? PR.dayMarks(d) : null, d === sel)).join('')}</div>`;
      let detail = '';
      if (sel) {
        const wl = DB.where('workout_logs', l => l.completed && l.date === sel); const cl = DB.where('cardio_logs', c => c.date === sel); const ml = DB.where('meal_logs', l => l.date === sel); const wt = DB.where('weight_logs', x => x.date === sel)[0]; const ac = PR.activity(sel); const ph = DB.where('progress_photos', x => x.date === sel); const ms = DB.where('body_measurements', x => x.date === sel)[0];
        const rows = [];
        wl.forEach(l => rows.push(`🏋️ ${e((FORGE.PROGRAM.workouts.find(x => x.id === l.workout_id) || {}).name || l.workout_id)} · ${l.duration || '—'} min · ${DB.where('set_logs', s => s.workout_log_id === l.id && s.completed).length} series`));
        cl.forEach(c => rows.push(`🏃 ${c.type === 'intervalos' ? 'Intervalos' : 'Cardio moderado'} · ${c.duration} min${c.distance ? ` · ${U.n(c.distance)} km` : ''}`));
        if (ml.length) { const t2 = NE.dayIntake(sel); rows.push(`🍽️ ${ml.length} comidas · ${U.int(t2.calories)} kcal · ${t2.protein} g proteína`); ml.forEach(l => rows.push(`&nbsp;&nbsp;· ${e(l.name)} <span class="muted">${U.int(l.calories)} kcal${l.free ? ' · fuera del plan' : ''}</span>`)); const withPh = ml.filter(l => l.photo_id); if (withPh.length) rows.push(`<div class="photo-grid" style="margin-top:6px">${withPh.map(l => `<div class="photo-slot has" data-photo-id="${l.photo_id}" style="aspect-ratio:1"></div>`).join('')}</div>`); }
        if (wt) rows.push(`⚖️ ${U.kg(wt.weight)}`);
        if (ac && ac.steps) rows.push(`🚶 ${U.int(ac.steps)} pasos · objetivo ${U.int(PRG.stepsGoal(PRG.week(sel)))}`);
        if (ac && ac.water) rows.push(`💧 ${U.n(ac.water, 2)} L`);
        if (ph.length) rows.push(`📸 ${ph.length} fotos`);
        if (ms) rows.push(`📏 Medidas registradas${ms.waist ? ` · cintura ${U.n(ms.waist)} cm` : ''}`);
        detail = `<div class="section"><div class="section-title"><h2>${U.fmtDate(sel, true)}</h2><span class="eyebrow">Sem. ${PRG.week(sel)}</span></div>${rows.length ? `<div class="panel tight"><div class="list">${rows.map(r => `<div style="font-size:var(--fs-sm)">${r}</div>`).join('')}</div></div>` : CP.Empty('Sin registros', 'No hay actividad guardada este día.')}</div>`;
      }
      return `<div class="screen">${UI.backBtn('Progreso')}${UI.header('Calendario', '')}<div class="row between" style="margin-bottom:10px"><button class="btn quiet sm" data-act="go" data-tab="progreso" data-view="calendario" data-params='{"month":"${prevM}"}'>‹</button><b class="display" style="font-size:var(--fs-xl);text-transform:uppercase">${C.MONTHS[m - 1]} ${y}</b><button class="btn quiet sm" data-act="go" data-tab="progreso" data-view="calendario" data-params='{"month":"${nextM}"}' ${nextM > t.slice(0, 7) ? 'disabled' : ''}>›</button></div>${grid}<div class="legend" style="flex-wrap:wrap"><span><i style="background:var(--accent);height:6px;width:6px;border-radius:3px"></i>Entreno</span><span><i style="background:var(--good);height:6px;width:6px;border-radius:3px"></i>Nutrición</span><span><i style="background:var(--info);height:6px;width:6px;border-radius:3px"></i>Peso</span><span><i style="background:var(--warn);height:6px;width:6px;border-radius:3px"></i>Foto</span><span><i style="background:var(--text-2);height:6px;width:6px;border-radius:3px"></i>Pasos</span></div>${detail}</div>`;
    },
    logros() {
      PR.checkAchievements(); const have = DB.all('achievements');
      return `<div class="screen">${UI.backBtn('Progreso')}${UI.header('Logros', `${have.length} de ${FORGE.ACHIEVEMENTS.length}`)}<div class="stack">${FORGE.ACHIEVEMENTS.map(a => CP.AchievementCard(a, have.find(h => h.type === a.id))).join('')}</div></div>`;
    },
    async after(view) {
      // Cargar imágenes desde IndexedDB en los huecos correspondientes
      const box = document.getElementById('compare-box'); if (box && box.querySelector('[data-compare]')) {
        const photos = DB.all('progress_photos');
        const imgs = box.querySelectorAll('img'); const tags = box.querySelectorAll('.tag');
        // Buscar las fotos por etiqueta (fecha) — se pasa vía closure sencilla: recomputar
        const type = (UI.state.params && UI.state.params.type) || 'front';
        const list = photos.filter(x => x.type === type).sort((a, b) => a.date < b.date ? -1 : 1);
        const b = list[0]; let a = null; const vs = UI.state.params && UI.state.params.vs;
        if (vs && vs !== 'latest') { const ds = PRG.weekDates(+vs); a = list.filter(x => x.date >= ds[0] && x.date <= ds[6]).pop(); } else a = list.length > 1 ? list[list.length - 1] : null;
        if (b) imgs[0].src = photoCache[b.id] || (photoCache[b.id] = await FORGE.photos.get(b.id)) || '';
        if (a) imgs[1].src = photoCache[a.id] || (photoCache[a.id] = await FORGE.photos.get(a.id)) || '';
      }
    }
  };

  Object.assign(UI.actions, {
    'weight-del': async d => { if (await UI.confirm('Eliminar registro', 'Se eliminará este pesaje.', 'Eliminar', true)) { DB.remove('weight_logs', d.id); UI.render(); } },
    'measure-del': async d => { if (await UI.confirm('Eliminar medidas', 'Se eliminará este registro de medidas.', 'Eliminar', true)) { DB.remove('body_measurements', d.id); UI.render(); } },
    'measure-sheet': () => {
      const last = PR.measurements().slice(-1)[0] || {}; const t = U.today();
      UI.sheet(`<h2>Registrar medidas</h2><p class="t2" style="font-size:var(--fs-sm);margin-bottom:12px">En centímetros. Deja en blanco las que no midas.</p><div class="grid2">${MFIELDS.map(([k, l]) => UI.field(l, `<input type="number" inputmode="decimal" step="0.1" id="m-${k}" placeholder="${last[k] != null ? U.n(last[k]) : '—'}">`)).join('')}${UI.field('Fecha', `<input type="date" id="m-date" value="${t}" max="${t}">`)}</div><div id="m-err" class="bad" style="font-size:var(--fs-xs);margin-top:8px"></div><button class="btn primary big block display" style="margin-top:14px" id="m-save">Guardar</button>`, bg => {
        bg.querySelector('#m-save').onclick = () => {
          const row = {}; let any = false; for (const [k] of MFIELDS) { const v = bg.querySelector('#m-' + k).value.replace(',', '.'); const r = FORGE.validate.measure(v); if (!r.ok) { bg.querySelector('#m-err').textContent = r.msg; return; } if (r.value != null) { row[k] = r.value; any = true; } }
          const dt = FORGE.validate.date(bg.querySelector('#m-date').value); if (!dt.ok) { bg.querySelector('#m-err').textContent = dt.msg; return; } if (!any) { bg.querySelector('#m-err').textContent = 'Introduce al menos una medida.'; return; }
          const wt = DB.where('weight_logs', x => x.date === dt.value)[0];
          DB.upsert('body_measurements', x => x.date === dt.value, { user_id: DB.user().id, date: dt.value, weight: wt ? wt.weight : null, ...row }); UI.closeSheet(); UI.toast('Medidas guardadas', 'good'); UI.render();
        };
      });

    'photo-add': async (d, el) => {
      const f = el.files && el.files[0]; if (!f) return; if (!f.type.startsWith('image/')) return UI.toast('Selecciona una imagen.', 'bad');
      try { UI.toast('Guardando foto…'); const src = await FORGE.photos.resize(f); const t = U.today(); const ex = DB.where('progress_photos', x => x.date === t && x.type === d.type)[0]; if (ex) { await FORGE.photos.del(ex.id); DB.remove('progress_photos', ex.id); } const row = DB.insert('progress_photos', { user_id: DB.user().id, date: t, type: d.type, image_url: 'idb' }); await FORGE.photos.put(row.id, src); photoCache[row.id] = src; UI.toast('Foto guardada (solo en este dispositivo)', 'good'); UI.render(); }
      catch (err) { UI.toast('No se pudo guardar la foto: ' + err.message, 'bad'); }
    },
    'photo-open': async d => { const ph = DB.get('progress_photos', d.id); const src = photoCache[d.id] || await FORGE.photos.get(d.id); UI.sheet(`<div class="eyebrow">${PTYPES.find(t => t[0] === ph.type)[1]} · Semana ${PRG.week(ph.date)} · ${U.fmtDate(ph.date, true)}</div><img src="${src}" style="width:100%;border-radius:14px;margin:12px 0" alt=""><button class="btn danger block" data-act="photo-del" data-id="${d.id}">Eliminar foto</button>`); },
    'photo-del': async d => { UI.closeSheet(); if (await UI.confirm('Eliminar foto', 'Se eliminará definitivamente de este dispositivo.', 'Eliminar', true)) { await FORGE.photos.del(d.id); delete photoCache[d.id]; DB.remove('progress_photos', d.id); UI.render(); } },
    checkin: d => { const w = PRG.week(), cy = PRG.cycle(); DB.upsert('checkins', c => c.week === w && (c.cycle || 1) === cy, { user_id: DB.user().id, week: w, cycle: cy, feeling: d.v, date: U.today() }); UI.toast(d.v === 'muy_fatigado' ? 'Ajustamos el volumen de esta semana' : 'Registrado', 'good'); UI.render(); }
  });
})();

<script>
/* ═══════════════════════════════════════════════
   FORGE · PERFIL: datos, notificaciones, tema, privacidad y datos
   ═══════════════════════════════════════════════ */
(function () {
  const U = FORGE.U, C = FORGE.CONFIG, DB = FORGE.db, UI = FORGE.ui, CP = FORGE.cp, I = FORGE.icons, e = U.esc;
  const PRG = FORGE.program, NO = FORGE.notifications, PR = FORGE.progress, NE = FORGE.nutrition;

  UI.screens.perfil = {

      const st = PR.weightStats(); const w = PRG.week(); const block = FORGE.blockForWeek(w);
      // Racha: días seguidos con algún registro (hasta hoy o ayer)
      let streak = 0; { let d = U.today(); const has = x => PR.dayMarks(x); if (!Object.values(has(d)).some(Boolean)) d = U.addDays(d, -1); while (Object.values(has(d)).some(Boolean) && streak < 400) { streak++; d = U.addDays(d, -1); } }

      return `<div class="screen">${UI.header('Perfil', '', `<button class="ringbtn" ${go('datos')} aria-label="Editar">${I.ruler}</button>`)}
        ${demo ? `<div class="banner col" style="margin-bottom:16px"><span><span class="chip demo">Demo</span>Datos de demostración. Empieza tu programa real cuando quieras.</span><button class="btn sm primary pill" data-act="start-real">Empezar</button></div>` : ''}
        <div style="text-align:center;margin:6px 0 16px"><div class="avatar">${e((u.name || '?').trim().charAt(0).toUpperCase())}</div><h2 style="font-size:var(--fs-2xl);margin-top:12px">${e(u.name)}</h2><div class="t2" style="font-size:var(--fs-sm);margin-top:2px">Semana ${w} · ${e(block.name)}</div></div>
        <div class="stat3"><div><b class="num">${w}</b><span>Semanas</span></div><div><b class="num">${st ? U.sign(st.total, 1) : '0'}</b><span>kg de peso</span></div><div><b class="num">${streak}</b><span>Racha días</span></div></div>
        <div class="section"><div class="menu">
          ${row('user', 'Mis datos', `${u.age} años · ${u.height} cm`, go('datos'))}
          ${row('ruler', 'Mis objetivos', `${U.n(u.initial_weight, 0)} → ${U.n(u.target_weight, 0)} kg`, `data-act="go" data-tab="nutricion" data-view="objetivos"`)}
          ${row('bell', 'Notificaciones', { granted: 'Activadas', denied: 'Bloqueadas', default: 'En la app', unsupported: 'En la app' }[perm], go('notificaciones'))}
          ${row('cal', 'Apariencia', theme === 'dark' ? 'Modo oscuro' : 'Modo claro', `data-act="theme" data-v="${theme === 'dark' ? 'light' : 'dark'}"`)}
          ${(window.claude && typeof claude.use === 'function') ? row('progress', 'Nube', FORGE.sync.status === 'on' ? 'Sincronizado' : FORGE.sync.status === 'connecting' ? 'Conectando…' : 'Solo este dispositivo', `data-act="sync-now"`) : ''}
          ${row('photo', 'Exportar datos', '', `data-act="export"`)}
          ${row('heart', 'Cómo funciona FORGE', '', go('ayuda'))}
        </div></div>
        <div class="section"><div class="menu">${row('close', 'Importar una copia', '', `data-act="import"`)}${row('close', 'Eliminar cuenta y todos los datos', '', `data-act="delete-account"`, 'danger')}</div></div>
        <div style="text-align:center;margin-top:20px"><img src="${FORGE.LOGO}" alt="" style="width:44px;height:44px;border-radius:11px;box-shadow:0 0 14px var(--accent-glow)"><p class="muted" style="font-size:var(--fs-xs);margin-top:8px">FORGE ${C.VERSION} · ${e(FORGE.sync.label())}</p></div></div>`;
    },
    ayuda() {
      return `<div class="screen">${UI.backBtn('Perfil')}${UI.header('Cómo funciona FORGE', 'Entrenador, nutricionista y seguimiento')}
        <div class="stack">
          <div class="panel tight"><div class="row" style="margin-bottom:6px"><div class="ring-ico sm">${FORGE.tabIcons.train}</div><b>Progresión</b></div><p class="t2" style="font-size:var(--fs-sm)">Si completas todas las series con 2+ repeticiones en reserva, sugerimos subir carga (+1–2,5 kg tren superior, +2,5–5 kg tren inferior). Con RIR 0–1 se mantiene; si faltan repeticiones, se mantiene o se baja un 5 %. Con fatiga alta se recorta el volumen accesorio. Antes de cada básico hay series de aproximación. Tú confirmas siempre.</p></div>
          <div class="panel tight"><div class="row" style="margin-bottom:6px"><div class="ring-ico sm">${FORGE.tabIcons.food}</div><b>Nutrición</b></div><p class="t2" style="font-size:var(--fs-sm)">Calorías con Mifflin-St Jeor × actividad y déficit moderado; 1,6 g/kg de proteína. Menú nuevo cada semana (7 × 4 comidas, 92 recetas) variando la proteína principal, con sustituciones equivalentes, comidas fuera del plan y lista de compra.</p></div>
          <div class="panel tight"><div class="row" style="margin-bottom:6px"><div class="ring-ico sm">${FORGE.tabIcons.progress}</div><b>Progreso</b></div><p class="t2" style="font-size:var(--fs-sm)">Media móvil de 7 días para el peso (ignora las oscilaciones diarias), e1RM de Epley para la fuerza, adherencia semanal y recomendaciones cuando hay al menos dos semanas de datos. Nunca cambios extremos.</p></div>
          <div class="panel tight"><div class="row" style="margin-bottom:6px"><div class="ring-ico sm blue">${FORGE.tabIcons.moon}</div><b>Descanso</b></div><p class="t2" style="font-size:var(--fs-sm)">Duerme 7-9 horas: es cuando el músculo se repara y el apetito se regula. Misma hora de acostarte, pantallas fuera 30 min antes, habitación oscura y fresca. Si una semana vas muy fatigado, dilo en «Tu semana» y ajustamos el volumen.</p></div>
        </div></div>`;
    },
    datos() {
      const u = DB.user(); const days = u.training_days || C.DEFAULT_TRAINING_DAYS;
      return `<div class="screen">${UI.backBtn('Perfil')}${UI.header('Mis datos', '')}<div class="panel"><div class="stack">
        ${UI.field('Nombre', `<input type="text" id="u-name" value="${e(u.name)}">`)}
        <div class="grid2">${UI.field('Edad', `<input type="number" inputmode="numeric" id="u-age" value="${u.age}">`)}${UI.field('Altura (cm)', `<input type="number" inputmode="numeric" id="u-height" value="${u.height}">`)}</div>
        <div class="grid2">${UI.field('Peso inicial (kg)', `<input type="number" inputmode="decimal" id="u-w0" value="${u.initial_weight}">`)}${UI.field('Peso objetivo (kg)', `<input type="number" inputmode="decimal" id="u-w1" value="${u.target_weight}">`)}</div>
        ${UI.field('Nivel de actividad (fuera del entrenamiento)', `<select id="u-act">${[['sedentario', 'Sedentario · trabajo de oficina'], ['ligero', 'Ligero · algo de movimiento diario'], ['moderado', 'Moderado · trabajo activo'], ['alto', 'Alto · trabajo físico']].map(([v, l]) => `<option value="${v}" ${u.activity_level === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`)}
        ${UI.field('Días de fuerza (4)', `<div class="pills" id="u-days">${[1, 2, 3, 4, 5, 6].map(n => `<button class="pill${days.includes(n) ? ' on' : ''}" data-act="u-day" data-v="${n}">${C.DOW_LONG[n % 7]}</button>`).join('')}</div>`)}
        ${UI.field('Hora de entrenar', `<input type="time" id="u-hour" value="${u.train_hour || '18:00'}">`)}
        ${UI.field('Objetivo de agua (litros al día)', `<input type="number" inputmode="decimal" step="0.25" id="u-water" value="${NE.waterGoal()}">`)}
        <div class="eyebrow" style="margin-top:4px">Horarios de las comidas</div>
        <div class="grid2">${C.MEAL_ORDER.map(t => UI.field(C.MEAL_LABEL[t], `<input type="time" id="u-mt-${t}" value="${NE.mealTime(t)}">`)).join('')}</div>
        <div id="u-err" class="bad" style="font-size:var(--fs-xs)"></div><button class="btn primary block display" data-act="u-save">Guardar</button></div></div>
        <p class="muted" style="font-size:var(--fs-xs);margin-top:10px">Cambiar el nivel de actividad o el peso objetivo recalcula los objetivos calóricos de las próximas semanas.</p></div>`;
    },
    notificaciones() {
      const perm = NO.permission(); const list = DB.all('notifications');
      return `<div class="screen">${UI.backBtn('Perfil')}${UI.header('Notificaciones', 'Cada aviso se puede activar y programar')}
        ${perm !== 'granted' ? `<div class="banner info" style="margin-bottom:14px"><span>${perm === 'unsupported' ? 'Este navegador no admite notificaciones del sistema: verás los avisos dentro de la app mientras esté abierta.' : perm === 'denied' ? 'Las notificaciones están bloqueadas en el navegador. Actívalas en los ajustes del sitio para recibir avisos.' : 'Activa las notificaciones del navegador para recibir los avisos aunque no estés mirando la app.'}</span>${perm === 'default' ? '<button class="btn sm primary" data-act="notif-perm">Activar</button>' : ''}</div>` : `<div class="banner good" style="margin-bottom:14px"><span>Notificaciones del sistema activadas. Los avisos se envían mientras FORGE esté abierta o en segundo plano en una pestaña.</span></div>`}
        <div class="panel tight">${list.map(n => CP.NotificationCard(n)).join('')}</div>
        <p class="muted" style="font-size:var(--fs-xs);margin-top:10px">Los avisos son inteligentes: no te recordamos registrar el peso si ya lo hiciste, ni entrenar si ya completaste la sesión. Los pasos restantes se calculan con tu registro del día.</p>
        <button class="btn ghost block" style="margin-top:12px" data-act="notif-test">Probar un aviso ahora</button></div>`;
    }
  };

  Object.assign(UI.actions, {
    'sync-now': async () => { const S = FORGE.sync; if (S.status === 'on') { await S.flush(); UI.toast('Sincronizado', 'good'); } else { UI.toast('Conectando…'); await S.init(); UI.toast(S.status === 'on' ? 'Nube conectada' : 'No se pudo conectar con la nube', S.status === 'on' ? 'good' : 'bad'); } UI.render(); },
    theme: d => { DB.setMeta({ theme: d.v }); UI.applyTheme(); UI.render(); },
    'notif-toggle': d => { const n = DB.get('notifications', d.id); DB.update('notifications', d.id, { enabled: !n.enabled }); UI.render(); },
    'notif-time': (d, el) => { if (/^\d{2}:\d{2}$/.test(el.value)) DB.update('notifications', d.id, { scheduled_time: el.value }); },
    'notif-perm': async () => { const r = await NO.request(); UI.toast(r === 'granted' ? 'Notificaciones activadas' : 'No se concedió el permiso', r === 'granted' ? 'good' : 'bad'); UI.render(); },
    'notif-test': () => { const p = NO.todayPlan(); NO.push('Buenos días', p.workout ? `Hoy toca ${p.workout.name}.` : 'Hoy: cardio y pasos.', { type: 'morning', category: 'Resumen', icon: 'home', action: { label: 'Ver el día', tab: 'hoy' } }); UI.toast('Aviso enviado: míralo en Inicio → campana', 'good'); },
    'u-day': (d, el) => { const box = document.getElementById('u-days'); const on = box.querySelectorAll('.on').length; if (el.classList.contains('on')) el.classList.remove('on'); else if (on < 4) el.classList.add('on'); else UI.toast('Máximo 4 días. Quita uno para cambiarlo.'); },
    'u-save': () => {
      const u = DB.user(); const V = FORGE.validate; const err = document.getElementById('u-err');
      const name = UI.val('#u-name'); if (!name) return err.textContent = 'El nombre no puede estar vacío.';
      const age = V.age(UI.val('#u-age')), h = V.height(UI.val('#u-height')), w0 = V.weight(UI.val('#u-w0')), w1 = V.weight(UI.val('#u-w1'));
      for (const r of [age, h, w0, w1]) if (!r.ok) return err.textContent = r.msg;
      if (w1.value >= w0.value) return err.textContent = 'El peso objetivo debe ser menor que el inicial.';
      const days = [...document.querySelectorAll('#u-days .on')].map(b => +b.dataset.v).sort(); if (days.length !== 4) return err.textContent = 'Elige exactamente 4 días de fuerza.';
      const water = parseFloat(UI.val('#u-water')); if (!(water >= 1 && water <= 6)) return err.textContent = 'El objetivo de agua debe estar entre 1 y 6 litros.';
      const meal_times = {}; for (const t of C.MEAL_ORDER) { const v = UI.val('#u-mt-' + t); if (!/^\d{2}:\d{2}$/.test(v)) return err.textContent = 'Revisa los horarios de las comidas.'; meal_times[t] = v; }
      DB.update('users', u.id, { name, age: age.value, height: h.value, initial_weight: w0.value, target_weight: w1.value, activity_level: UI.val('#u-act'), training_days: days, train_hour: UI.val('#u-hour'), water_goal: Math.round(water * 4) / 4, meal_times });
      // Sincronizar avisos de comidas con los horarios
      DB.all('notifications').forEach(n => { if (n.type === 'meal_comida') DB.update('notifications', n.id, { scheduled_time: meal_times.comida }); if (n.type === 'meal_cena') DB.update('notifications', n.id, { scheduled_time: meal_times.cena }); });
      // Recalcular el plan de la semana actual con los nuevos datos (sin tocar semanas pasadas)
      const wk = PRG.week(); const p = DB.where('nutrition_plans', x => x.week === wk && (x.cycle || 1) === PRG.cycle())[0]; if (p) { const t = NE.baseTargets(DB.user(), PR.trendAt(U.today()) || w0.value); const kcal = U.round(t.calories + (DB.meta().kcal_adjust || 0), 50); DB.update('nutrition_plans', p.id, { calories: kcal, protein: t.protein, fat: t.fat, carbs: Math.max(80, Math.round((kcal - t.protein * 4 - t.fat * 9) / 4)) }); }
      UI.toast('Datos guardados', 'good'); UI.go('perfil');
    },
    export: async () => {
      UI.toast('Preparando la copia…'); const json = await DB.export(true); const name = `forge-copia-${U.today()}.json`;
      let dl = null; try { dl = window.claude && claude.use ? await claude.use('downloads') : null; } catch { }
      if (dl) { try { const r = await dl.save({ filename: name, data: json }); UI.toast(r.status === 'saved' ? 'Copia guardada' : 'Copia enviada', 'good'); return; } catch (err) { if (err && err.code === 'cancelled') return; } }
      if (!window.claude) { try { const blob = new Blob([json], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); UI.toast('Copia descargada', 'good'); return; } catch { } }
      const jsonNoPhotos = await DB.export(false); UI.sheet(`<h2>Exportar datos</h2><p class="t2" style="font-size:var(--fs-sm)">Copia este texto y guárdalo en un archivo (por ejemplo, forge-copia.json). En esta vista las fotos no se incluyen.</p><textarea id="exp" style="height:220px;font-size:11px;font-family:monospace;margin:12px 0" readonly>${e(jsonNoPhotos)}</textarea><button class="btn primary block" id="exp-copy">Copiar al portapapeles</button>`, bg => { const ta = bg.querySelector('#exp'); bg.querySelector('#exp-copy').onclick = async () => { try { await navigator.clipboard.writeText(jsonNoPhotos); UI.toast('Copiado', 'good'); } catch { ta.select(); document.execCommand('copy'); UI.toast('Copiado', 'good'); } }; }); return;
    },
    import: () => { UI.sheet(`<h2>Importar copia</h2><p class="t2" style="font-size:var(--fs-sm)">Elige el archivo de una exportación de FORGE (o pega su contenido). Sustituirá los datos actuales.</p><label class="btn ghost block" style="margin:12px 0">Elegir archivo .json<input type="file" accept=".json,application/json" class="hide" id="imp-file"></label><textarea id="imp" style="height:120px;font-size:11px;font-family:monospace;margin-bottom:12px" placeholder="{ ... }"></textarea><button class="btn primary block" id="imp-ok">Importar</button>`, bg => {
      const doImport = async txt => { try { if (!txt.trim()) return; if (!await UI.confirm('Sustituir datos', 'Se reemplazarán todos los datos actuales por la copia.', 'Importar', true)) return; await DB.import(txt); UI.closeSheet(); UI.applyTheme(); UI.go('hoy'); UI.toast('Datos importados', 'good'); } catch (err) { UI.toast('No se pudo importar: ' + err.message, 'bad'); } };
      bg.querySelector('#imp-file').addEventListener('change', ev => { const f = ev.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => doImport(String(rd.result)); rd.readAsText(f); });
      bg.querySelector('#imp-ok').onclick = () => doImport(bg.querySelector('#imp').value); }); },
    'delete-account': async () => { if (!await UI.confirm('Eliminar cuenta', 'Se borrarán todos tus registros, fotos y ajustes de este dispositivo. Esta acción no se puede deshacer.', 'Eliminar todo', true)) return; DB.reset(null); await FORGE.photos.clear(); FORGE.onboarding.step = 0; FORGE.onboarding.data.name = ''; UI.render(); UI.toast('Cuenta eliminada'); }
  });
})();
</script>
<script>
/* ═══════════════════════════════════════════════
   FORGE · DATOS DE DEMOSTRACIÓN (separados de los datos del usuario)
   y ARRANQUE DE LA APLICACIÓN
   ═══════════════════════════════════════════════ */
(function () {
  const U = FORGE.U, C = FORGE.CONFIG, DB = FORGE.db, UI = FORGE.ui, PRG = FORGE.program, PR = FORGE.progress, NE = FORGE.nutrition, NO = FORGE.notifications;

  /* DEMO: 4 semanas simuladas de un usuario de 100 kg → 80 kg.
     Se marca con meta.mode = 'demo' y se borra por completo al empezar con datos reales. */
  FORGE.demo = {
    seed() {
      DB.reset('demo'); DB.data.meta.seeding = true; const rnd = U.rng(20260909); const today = U.today();
      const start = U.addDays(U.mondayOf(today), -21); // semana 4 en curso
      const u = DB.insert('users', { name: 'Alex', age: 23, sex: 'm', height: 172, initial_weight: 100, target_weight: 80, activity_level: 'ligero', initial_steps: 4000, goals: ['grasa', 'musculo', 'fuerza', 'resistencia', 'cardio'], equipment: ['banco', 'barra', 'discos', 'mancuernas', 'dominadas', 'bandas', 'chaleco', 'poleas'], diet_tags: ['pescado'], training_days: [1, 3, 4, 6], train_hour: '18:00', seed: 42 });
      DB.setMeta({ program_start: start, mode: 'demo' });
      const days = U.diffDays(start, today);
      // Peso: tendencia −0,75 kg/semana con oscilación diaria
      for (let i = 0; i <= days; i++) { const d = U.addDays(start, i); if (rnd() < 0.1 && i > 0 && i < days) continue; const w = 100 - i * 0.107 + (rnd() - 0.5) * 0.9; DB.insert('weight_logs', { user_id: u.id, date: d, weight: Math.round(w * 10) / 10 }); }
      // Medidas: inicio, semana 2 y semana 4
      [[0, 104, 108, 112, 106, 41, 36, 35.5, 64, 63.5], [13, 102.6, 106.4, 111.5, 105.2, 40.6, 36, 35.5, 63.5, 63], [days - 1, 101.3, 105, 111, 104.6, 40.2, 36.2, 35.8, 63, 62.6]].forEach(r => DB.insert('body_measurements', { user_id: u.id, date: U.addDays(start, r[0]), weight: null, waist: r[1], abdomen: r[2], chest: r[3], hip: r[4], neck: r[5], arm_right: r[6], arm_left: r[7], thigh_right: r[8], thigh_left: r[9] }));
      // Entrenamientos: cargas iniciales fijadas en semana 1 y progresión realista
      const startW = { squat: 70, bench: 60, deadlift: 90, ohp: 40, row: 55, pullup: 0, rdl: 60, lunge: 20, bulgarian: 16, goblet: 20, hipthrust: 60, legcurl: 0, calf: 30, inclinedb: 30, latpull: 50, cablerow: 45, facepull: 20, lateral: 10, curl: 16, triceps: 25, dips: 0, crunch: 25, plank: 0 };
      const cur = { ...startW }; const sessionsDone = {};
      for (let i = 0; i < days; i++) {
        const d = U.addDays(start, i); const plan = NO.todayPlan(d); const w = PRG.week(d);
        if (plan.workout) {
          if (rnd() < 0.06) continue; // alguna sesión perdida
          const tpl = FORGE.workoutTemplate(plan.workout.id, w);
          const log = DB.insert('workout_logs', { user_id: u.id, workout_id: tpl.id, week: w, date: d, duration: 52 + Math.round(rnd() * 16), completed: true, difficulty: 7 + Math.round(rnd() * 2), notes: '' });
          tpl.exercises.forEach(ex => {
            const E = FORGE.exercise(ex.exercise_id); const n = sessionsDone[E.id] || 0; const rir = n === 0 ? 2 : Math.floor(rnd() * 4); const rpe = U.clamp(10 - rir - Math.round(rnd()), 6, 10);
            for (let s = 1; s <= ex.sets; s++) { const reps = E.mode === 'time' ? ex.target_reps : (s === ex.sets && rir === 0 && rnd() < 0.4 ? ex.target_reps - 1 : ex.target_reps); DB.insert('set_logs', { workout_log_id: log.id, exercise_id: E.id, set_number: s, weight: cur[E.id], reps, target_reps: ex.target_reps, planned_sets: ex.sets, rpe, rir, completed: true }); }
            // progresión aplicada en la siguiente sesión (como si el usuario aceptara la sugerencia)
            if (rir >= 2 && E.mode === 'load') { const inc = E.region === 'lower' ? (E.category === 'compound' ? (rir >= 3 ? 5 : 2.5) : 2.5) : (E.category === 'compound' ? 2.5 : 1); cur[E.id] = cur[E.id] + Math.max(E.step || 1, U.round(inc, E.step || 1)); }
            sessionsDone[E.id] = n + 1;
          });
        } else if (plan.cardio && rnd() < 0.8) {
          const min = plan.cardio.minutes; const km = plan.cardio.id === 'CI' ? null : Math.round((min / 11 + rnd()) * 10) / 10;
          DB.insert('cardio_logs', { user_id: u.id, date: d, type: plan.cardio.id === 'CI' ? 'intervalos' : 'moderado', duration: min, distance: km, pace: km ? (() => { const s = min * 60 / km; return Math.floor(s / 60) + ':' + U.pad(Math.round(s % 60)) + ' min/km'; })() : null, hr: 128 + Math.round(rnd() * 20), rpe: plan.cardio.id === 'CI' ? 8 : 5 });
        }
      }
      // Pasos y agua
      for (let i = 0; i <= days; i++) { const d = U.addDays(start, i); const w = PRG.week(d); const goal = PRG.stepsGoal(w); const steps = i === days ? 6890 : Math.round(goal * (0.8 + rnd() * 0.35)); const cardio = DB.where('cardio_logs', c => c.date === d)[0]; PR.setActivity(d, { steps, water: i === days ? 1.5 : Math.round((1.8 + rnd() * 0.9) * 4) / 4, cardio_minutes: cardio ? cardio.duration : 0 }); }
      // Nutrición: menús de las 4 semanas y ~90% de comidas registradas
      for (let w = 1; w <= 4; w++) NE.generateWeek(w);
      for (let i = 0; i <= days; i++) { const d = U.addDays(start, i); const w = PRG.week(d), dow = PRG.dayOfWeek(d); NE.mealsFor(w, dow).forEach((m, k) => { if (i === days) { if (k === 0) NE.logMeal(m, d); return; } if (rnd() < 0.9) NE.logMeal(m, d); }); }
      // Sensación semanal
      [['bien', 1], ['normal', 2], ['bien', 3]].forEach(([f, w]) => DB.insert('checkins', { user_id: u.id, week: w, feeling: f, date: U.addDays(start, w * 7 - 1) }));
      NO.init(); PR.checkAchievements();
      const tp = NO.todayPlan(); const nm = NE.nextMeal(today); const ago = m => new Date(Date.now() - m * 60000).toISOString();
      [
        tp.workout ? { type: 'workout', category: 'Entrenamiento', kind: 'lime', icon: 'train', title: '¡Es hora de entrenar!', body: `Hoy toca: ${tp.workout.name} · ${tp.workout.duration} min`, action: { label: 'Ver rutina', tab: 'entrenar', view: 'workout', params: { id: tp.workout.id } }, at: ago(1) } : null,
        nm ? { type: 'meal_comida', category: 'Comida', kind: 'lime', icon: 'food', title: 'Hora de comer', body: FORGE.recipe(nm.recipe_id).name, action: { label: 'Ver receta', tab: 'nutricion', view: 'recipe', params: { meal: nm.id, date: today } }, at: ago(10) } : null,
        { type: 'water', category: 'Hidratación', kind: 'lime', icon: 'drop', title: '¡Bebe agua!', body: 'Llevas 1,5 L de 2,5 L hoy', progress: { pct: 60 }, at: ago(25) },
        { type: 'pr', category: 'Logro', kind: 'lime', icon: 'trophy', title: '¡Gran trabajo!', body: 'Has completado tu entrenamiento de ayer', action: { label: 'Ver progreso', tab: 'progreso' }, at: ago(60 * 20), date: U.addDays(today, -1) },
        { type: 'rest', category: 'Recuerdo', kind: 'blue', icon: 'moon', title: 'Es hora de descansar', body: 'Dormir bien también te acerca a tus objetivos', action: { label: 'Más consejos', tab: 'perfil', view: 'ayuda' }, at: ago(60 * 22), date: U.addDays(today, -1) },
        { type: 'measures', category: 'Medidas', kind: 'lime', icon: 'progress', title: 'Actualiza tus medidas', body: 'Es momento de registrar tu progreso', action: { label: 'Registrar', act: 'measure-sheet' }, at: ago(60 * 24 * 2), date: U.addDays(today, -2) }
      ].filter(Boolean).forEach(a => DB.insert('alerts', { user_id: u.id, read: a.type === 'pr' || a.type === 'rest' || a.type === 'measures', date: today, ...a }));
      DB.data.meta.notified = { morning: today, weight: today, workout: today, meal_comida: today, water: today, measures: today, steps: today }; delete DB.data.meta.seeding; DB.data.meta.demo_touched = false; DB.saveRaw();
    }
  };

  /* ═══════ ARRANQUE ═══════ */
  function boot() {
    DB.load(); UI.applyTheme();
    if (!DB.user() && !DB.meta().mode) FORGE.demo.seed(); // primera apertura: demo visible y claramente marcada
    if (DB.user()) { NO.init(); NE.generateWeek(PRG.week()); }
    UI.render();
    FORGE.sync.init();
    setTimeout(() => NO.tick(), 1500); setInterval(() => NO.tick(), 60000);
    // Cambio de día con la app abierta → refrescar HOY
    let day = U.today(); setInterval(() => { if (U.today() !== day) { day = U.today(); UI.render(); } }, 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && !FORGE.session.active && !(FORGE.itimer && FORGE.itimer.active) && !document.getElementById('sheet')) UI.render(); });
    if (!navigator.onLine) window.dispatchEvent(new Event('offline'));
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body></html>
