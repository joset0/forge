          ${CP.MetricCard({ label: 'Peso', value: r.wEnd != null ? U.n(r.wEnd) : '—', unit: 'kg', delta: r.delta != null ? U.sign(r.delta, 1, ' kg') : 'sin registros', deltaCls: r.delta < 0 ? 'good' : r.delta > 0 ? 'warn' : 't2', flat: true })}
          ${CP.MetricCard({ label: 'Cintura', value: r.waist != null ? U.sign(r.waist, 1) : '—', unit: r.waist != null ? 'cm' : '', flat: true, sub: r.waist == null ? 'mide esta semana' : '' })}
          ${CP.MetricCard({ label: 'Entrenos', value: `${r.workouts}/${r.days}`, flat: true, deltaCls: r.workouts >= r.days ? 'good' : 't2', delta: r.workouts >= r.days ? 'completo' : 'pendientes' })}
          ${CP.MetricCard({ label: 'Pasos', value: U.int(r.steps), unit: '/día', flat: true })}
          ${CP.MetricCard({ label: 'Nutrición', value: r.nut != null ? U.int(r.nut) : '—', unit: '%', flat: true })}
          ${CP.MetricCard({ label: 'Fuerza', value: r.str != null ? U.pct(r.str) : '—', flat: true, deltaCls: 'good' })}
        </div>
        <div class="divider"></div>
        <div class="eyebrow good">Lo mejor de la semana</div><ul style="margin:8px 0 16px 18px;font-size:var(--fs-sm)">${li(r.best)}</ul>
        <div class="eyebrow warn">Lo que podemos mejorar</div><ul style="margin:8px 0 16px 18px;font-size:var(--fs-sm)">${li(r.improve)}</ul>
        <div class="eyebrow accent">Objetivo de la próxima semana</div><p style="margin-top:6px;font-weight:500">${e(r.nextGoal)}</p>
        ${r.checkin ? `<div class="divider"></div><div class="row"><span class="t2" style="font-size:var(--fs-sm)">Sensación registrada:</span><span class="chip">${{ muy_fatigado: '😴 Muy fatigado', normal: '😐 Normal', bien: '🙂 Bien', excelente: '🔥 Excelente' }[r.checkin.feeling]}</span></div>` : ''}
      </div>`;
    },
    Empty(title, text, action) { return `<div class="empty"><div class="display">${e(title)}</div><div>${e(text)}</div>${action ? `<div style="margin-top:14px">${action}</div>` : ''}</div>`; },
    Ring: (...a) => CP.ProgressRing(...a)
  };
})();
</script>
<script>
/* ═══════════════════════════════════════════════
   FORGE · NÚCLEO DE UI: router, hoja inferior, toasts, acciones
   ═══════════════════════════════════════════════ */
(function () {
  const U = FORGE.U, C = FORGE.CONFIG, DB = FORGE.db, I = FORGE.icons, CP = FORGE.cp, e = U.esc;
  const UI = FORGE.ui = {
    state: { tab: 'hoy', view: null, params: {} },
    screens: {},      // tab → { render(view, params) → html, after?() }
    actions: {},      // data-act → fn(dataset, el, ev)
    TABS: [['hoy', 'Inicio', 'home'], ['progreso', 'Progreso', 'progress'], ['entrenar', 'Entrenar', 'train', true], ['nutricion', 'Nutrición', 'food'], ['perfil', 'Perfil', 'user']],
    go(tab, view = null, params = {}) { UI.closeSheet(); UI.state = { tab, view, params }; window.scrollTo(0, 0); UI.render(); },
    back() { const s = UI.state; if (s.view) { const parent = s.params.back || null; UI.go(s.tab, parent, s.params.backParams || {}); } else UI.go('hoy'); },
    render() {
      const root = document.getElementById('app'); const s = UI.state;
      if (!DB.user() || !DB.meta().mode || FORGE.onboarding.step === 8) { root.innerHTML = FORGE.onboarding.render(); root.classList.add('onb-mode'); FORGE.onboarding.after && FORGE.onboarding.after(); return; }
      root.classList.remove('onb-mode');
      const scr = UI.screens[s.tab]; let html = '';
      try { html = scr.render(s.view, s.params); } catch (err) { console.error(err); html = `<div class="screen">${CP.Empty('Algo ha fallado', 'No se pudo mostrar esta pantalla. Vuelve a HOY e inténtalo de nuevo.', '<button class="btn ghost" data-act="go" data-tab="hoy">Ir a HOY</button>')}<pre class="muted" style="font-size:11px;white-space:pre-wrap;margin-top:12px">${e(err.message)}</pre></div>`; }
      root.innerHTML = html + UI.tabbar();
      try { scr.after && scr.after(s.view, s.params); } catch (err) { console.error(err); }
      UI.wireCharts(root); UI.wireCompare(root); UI.loadPhotos(root);
    },
    async loadPhotos(root) {
      const cache = FORGE.photoCache = FORGE.photoCache || {};
      for (const el of root.querySelectorAll('[data-photo-id]')) { const id = el.dataset.photoId; if (!id || el.querySelector('img')) continue; const src = cache[id] || (cache[id] = await FORGE.photos.get(id)); if (src && el.isConnected) { el.innerHTML = `<img src="${src}" alt="">`; el.classList.add('has'); } }
    },
    tabbar() {
      const demo = DB.meta().mode === 'demo';
      return `<nav class="tabbar"><div class="brand"><span class="logo"><img src="${FORGE.LOGO}" alt="">Forge</span>${demo ? '<div style="margin-top:6px"><span class="chip demo">Demo</span></div>' : ''}</div>${UI.TABS.map(([id, label, ic, center]) => `<button class="${UI.state.tab === id ? 'on' : ''}${center ? ' center' : ''}" data-act="go" data-tab="${id}" aria-label="${label}">${center ? `<div class="orb">${FORGE.tabIcons[ic]}</div>` : FORGE.tabIcons[ic]}<span>${label}</span></button>`).join('')}</nav>`;
    },
    header(title, sub, right = '') { return `<div class="head"><div><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div>${right}</div>`; },
    backBtn(label = 'Volver') { return `<button class="back" data-act="back">${I.back}${e(label)}</button>`; },
    toast(msg, cls = '', ms = 2600) { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast ' + cls; t.innerHTML = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); },
    sheet(html, after) { UI.closeSheet(); const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'sheet'; bg.innerHTML = `<div class="sheet"><div class="grip"></div>${html}</div>`; bg.addEventListener('click', ev => { if (ev.target === bg) UI.closeSheet(); }); document.body.appendChild(bg); after && after(bg); return bg; },
    closeSheet() { const s = document.getElementById('sheet'); if (s) s.remove(); },
    confirm(title, text, okLabel = 'Confirmar', danger = false) {
      return new Promise(res => { UI.sheet(`<h2>${e(title)}</h2><p class="t2" style="margin-bottom:18px">${e(text)}</p><div class="row"><button class="btn ghost" style="flex:1" data-x="0">Cancelar</button><button class="btn ${danger ? 'danger' : 'primary'}" style="flex:1" data-x="1">${e(okLabel)}</button></div>`, bg => { bg.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { UI.closeSheet(); res(b.dataset.x === '1'); }); }); });
    },
    // Tooltips de gráficos (crosshair simple por punto)
    wireCharts(root) {
      root.querySelectorAll('.chart-wrap').forEach(w => {
        const tip = w.querySelector('.tip'); const svg = w.querySelector('svg');
        const show = ev => { const t = ev.target.closest('[data-tip]'); if (!t) { tip.style.display = 'none'; return; } const r = w.getBoundingClientRect(); const b = t.getBoundingClientRect(); tip.textContent = t.dataset.tip; tip.style.display = 'block'; tip.style.left = (b.left - r.left + b.width / 2) + 'px'; tip.style.top = (b.top - r.top) + 'px'; };
        svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show); svg.addEventListener('pointerleave', () => tip.style.display = 'none');
      });
    },
    wireCompare(root) {
      root.querySelectorAll('[data-compare]').forEach(c => {
        const set = ev => { const r = c.getBoundingClientRect(); const x = U.clamp((ev.clientX - r.left) / r.width * 100, 0, 100); c.style.setProperty('--cut', x + '%'); };
        let down = false; c.addEventListener('pointerdown', ev => { down = true; c.setPointerCapture(ev.pointerId); set(ev); }); c.addEventListener('pointermove', ev => down && set(ev)); c.addEventListener('pointerup', () => down = false); c.addEventListener('pointercancel', () => down = false);
      });
    },
    field(label, inputHtml, err) { return `<div class="field"><label>${e(label)}</label>${inputHtml}${err ? `<div class="err">${e(err)}</div>` : ''}</div>`; },
    val(sel) { const el = document.querySelector(sel); return el ? el.value.trim().replace(',', '.') : ''; },
    applyTheme() { const t = DB.data && DB.meta().theme || 'dark'; document.documentElement.setAttribute('data-theme', t); document.documentElement.style.colorScheme = t; }
  };

  // Acciones globales (delegación de eventos)
  Object.assign(UI.actions, {
    go: d => UI.go(d.tab, d.view || null, d.params ? JSON.parse(d.params) : {}),
    back: () => UI.back(),
    'close-sheet': () => UI.closeSheet(),
    'alert-close': d => { DB.remove('alerts', d.id); UI.render(); },
    'alert-go': d => { const a = DB.get('alerts', d.id); if (!a) return; DB.update('alerts', a.id, { read: true }); const x = a.action; if (x.act && UI.actions[x.act]) { UI.go('hoy'); UI.actions[x.act]({}); } else UI.go(x.tab || 'hoy', x.view || null, x.params || {}); },
    'alerts-clear': () => { FORGE.db.removeWhere('alerts', () => true); UI.render(); }
  });
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]'); if (!el) return;
    const fn = UI.actions[el.dataset.act]; if (!fn) return;
    if (el.tagName === 'INPUT') return; // los inputs se gestionan con change
    ev.preventDefault(); fn(el.dataset, el, ev);
  });
  document.addEventListener('change', ev => {
    const el = ev.target.closest('[data-act]'); if (!el || el.tagName !== 'INPUT' && el.tagName !== 'SELECT') return;
    const fn = UI.actions[el.dataset.act]; if (fn) fn(el.dataset, el, ev);
  });
  window.addEventListener('online', () => { const o = document.getElementById('offline'); if (o) o.remove(); });
  window.addEventListener('offline', () => { if (!document.getElementById('offline')) { const d = document.createElement('div'); d.id = 'offline'; d.className = 'offline'; d.textContent = 'Sin conexión · tus datos se guardan en este dispositivo'; document.body.appendChild(d); } });

  /* ═══════ ONBOARDING ═══════ */
  const OB = FORGE.onboarding = {
    step: 0, data: { name: '', sex: 'm', age: '', height: '', weight: '', target: '', steps: '', goals: ['grasa', 'musculo', 'fuerza', 'resistencia'], equipment: ['banco', 'barra', 'discos', 'mancuernas', 'dominadas', 'bandas', 'chaleco', 'poleas'], diet: [], days: [1, 2, 4, 5], hour: '18:00', waist: '', abdomen: '', chest: '', hip: '', neck: '', arm_right: '', arm_left: '', thigh_right: '', thigh_left: '' }, err: '',
    STEPS: ['Bienvenida', 'Datos físicos', 'Objetivos', 'Equipamiento', 'Alimentación', 'Horario', 'Medidas iniciales'],
    render() {
      const d = OB.data, s = OB.step; const prog = `<div class="progress">${OB.STEPS.map((_, i) => `<i class="${i <= s ? 'on' : ''}"></i>`).join('')}</div>`;
      const inp = (k, ph, type = 'number', extra = '') => `<input type="${type}" inputmode="${type === 'number' ? 'decimal' : 'text'}" placeholder="${ph}" value="${e(d[k])}" data-ob="${k}" ${extra}>`;
      const pills = (k, opts) => `<div class="pills">${opts.map(([v, l]) => `<button class="pill${d[k].includes(v) ? ' on' : ''}" data-act="ob-pill" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
      let body = '';
      if (s === 0) body = `<div style="margin:24px 0 28px"><img class="applogo" src="${FORGE.ICON}" alt="FORGE"></div><h1>Construye un cuerpo más fuerte, resistente y funcional mientras pierdes grasa.</h1><p class="lead">Un entrenador, un nutricionista y tu progreso en el bolsillo. Cada día te diremos exactamente qué hacer.</p>${UI.field('¿Cómo te llamas?', inp('name', 'Tu nombre', 'text', 'autocomplete="given-name"'))}`;
      if (s === 1) body = `<h1>Datos físicos</h1><p class="lead">Con esto calculamos tus calorías y tu ritmo de pérdida de grasa.</p><div class="stack">${UI.field('Sexo', `<div class="seg"><button class="${d.sex === 'm' ? 'on' : ''}" data-act="ob-set" data-k="sex" data-v="m">Hombre</button><button class="${d.sex === 'f' ? 'on' : ''}" data-act="ob-set" data-k="sex" data-v="f">Mujer</button></div>`)}<div class="grid2">${UI.field('Edad', inp('age', '23'))}${UI.field('Altura (cm)', inp('height', '172'))}</div><div class="grid2">${UI.field('Peso actual (kg)', inp('weight', '100'))}${UI.field('Peso objetivo (kg)', inp('target', '80'))}</div>${UI.field('Pasos actuales al día (aprox.)', inp('steps', '4000'))}</div>`;
      if (s === 2) body = `<h1>Objetivos</h1><p class="lead">Marca todo lo que quieres conseguir. El programa combina fuerza, resistencia y pérdida de grasa.</p>${pills('goals', [['grasa', 'Perder grasa'], ['musculo', 'Conservar músculo'], ['fuerza', 'Ganar fuerza'], ['resistencia', 'Aumentar resistencia'], ['cardio', 'Mejorar capacidad cardiovascular'], ['funcional', 'Fuerza funcional'], ['trabajo', 'Capacidad de trabajo diaria']])}`;
      if (s === 3) body = `<h1>Equipamiento</h1><p class="lead">Marca lo que tienes. El programa usa lo disponible.</p>${pills('equipment', [['banco', 'Banco'], ['barra', 'Barra'], ['discos', 'Discos'], ['mancuernas', 'Mancuernas'], ['dominadas', 'Barra de dominadas'], ['bandas', 'Bandas elásticas'], ['chaleco', 'Chaleco lastrado'], ['poleas', 'Poleas']])}`;
      if (s === 4) body = `<h1>Alimentación</h1><p class="lead">Los menús semanales evitarán lo que marques. Si comes de todo, no marques nada.</p>${pills('diet', Object.entries(FORGE.DIET_TAGS))}`;
      if (s === 5) body = `<h1>Horario</h1><p class="lead">Elige 4 días de fuerza. Los demás días proponemos cardio suave o intervalos, y el domingo la revisión semanal.</p>${UI.field('Días de fuerza', `<div class="pills">${[1, 2, 3, 4, 5, 6].map(n => `<button class="pill${d.days.includes(n) ? ' on' : ''}" data-act="ob-day" data-v="${n}">${C.DOW_LONG[n % 7]}</button>`).join('')}</div>`)}<div style="margin-top:16px">${UI.field('Hora habitual de entrenar', `<input type="time" value="${d.hour}" data-ob="hour">`)}</div>`;
      if (s === 6) body = `<h1>Medidas iniciales</h1><p class="lead">Opcionales pero muy útiles: la cintura suele mejorar antes que la báscula. Puedes añadirlas después.</p><div class="grid2">${UI.field('Cintura (cm)', inp('waist', '—'))}${UI.field('Abdomen (cm)', inp('abdomen', '—'))}${UI.field('Pecho (cm)', inp('chest', '—'))}${UI.field('Cadera (cm)', inp('hip', '—'))}${UI.field('Cuello (cm)', inp('neck', '—'))}${UI.field('Brazo dcho. (cm)', inp('arm_right', '—'))}${UI.field('Brazo izq. (cm)', inp('arm_left', '—'))}${UI.field('Muslo dcho. (cm)', inp('thigh_right', '—'))}${UI.field('Muslo izq. (cm)', inp('thigh_left', '—'))}</div>`;
      if (s === 7) body = `<div style="margin:auto 0;text-align:center"><div class="eyebrow accent">Generando</div><h1 style="margin:10px 0">Tu programa y tu nutrición</h1><p class="lead">12 semanas · 4 sesiones de fuerza · menús variables · objetivos de pasos progresivos.</p><div class="stack" id="gen-steps" style="text-align:left;max-width:320px;margin:0 auto"></div></div>`;
      if (s === 8) body = `<div style="margin:auto 0;text-align:center"><img class="applogo" src="${FORGE.ICON}" alt="FORGE"><h1 style="font-size:clamp(34px,10vw,56px);margin:24px 0 10px;overflow-wrap:anywhere">Tu transformación comienza hoy</h1><p class="lead">Semana 1 · Construir la base. Tus primeras cargas las fijas tú en la primera sesión: a partir de ahí, calculamos nosotros.</p></div>`;
      const foot = s === 7 ? '' : s === 8 ? `<div class="foot"><button class="btn primary big block display" data-act="ob-finish">Ir a HOY</button></div>` : `<div class="foot">${s > 0 ? `<button class="btn ghost" data-act="ob-prev">Atrás</button>` : (DB.meta().mode !== 'demo' && !DB.user() ? `<button class="btn ghost" data-act="demo-load">Ver demo</button>` : '')}<button class="btn primary block display" data-act="ob-next">${s === 6 ? 'Generar programa' : 'Continuar'}</button></div>`;
      return `<div class="onb">${s < 7 ? prog : ''}${OB.err ? `<div class="banner" style="margin-bottom:16px;background:var(--bad-soft)">${e(OB.err)}</div>` : ''}${body}${foot}</div>`;
    },
    after() { document.querySelectorAll('[data-ob]').forEach(i => i.addEventListener('input', () => OB.data[i.dataset.ob] = i.value)); if (OB.step === 7) OB.generate(); const f = document.querySelector('.onb input'); if (f && OB.step < 6) f.focus({ preventScroll: true }); },
    validate() {
      const d = OB.data, V = FORGE.validate;
      if (OB.step === 0 && !d.name.trim()) return 'Escribe tu nombre para personalizar la app.';
      if (OB.step === 1) { for (const [k, f] of [['age', V.age], ['height', V.height], ['weight', V.weight], ['target', V.weight]]) { const r = f(d[k]); if (!r.ok) return r.msg; } if (Number(d.target) >= Number(d.weight)) return 'El peso objetivo debe ser menor que el peso actual para un programa de pérdida de grasa.'; if (d.steps !== '' && !V.steps(d.steps).ok) return V.steps(d.steps).msg; }
      if (OB.step === 2 && !d.goals.length) return 'Marca al menos un objetivo.';
      if (OB.step === 5 && d.days.length !== 4) return 'Elige exactamente 4 días de fuerza.';
      if (OB.step === 6) { for (const k of ['waist', 'abdomen', 'chest', 'hip', 'neck', 'arm_right', 'arm_left', 'thigh_right', 'thigh_left']) { const r = V.measure(d[k]); if (!r.ok) return r.msg; } }
      return '';
    },
    generate() {
      const d = OB.data; const box = document.getElementById('gen-steps'); const msgs = ['Calculando calorías y macronutrientes', 'Creando el programa de fuerza (bloque 1: base)', 'Generando el menú de la semana 1', 'Fijando objetivos de pasos y cardio', 'Preparando tu panel HOY'];
      msgs.forEach((m, i) => setTimeout(() => { box.insertAdjacentHTML('beforeend', `<div class="row" style="font-size:var(--fs-sm)"><span class="good">${I.check.replace('<svg', '<svg style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2"')}</span>${m}</div>`); }, 350 * i));
      setTimeout(() => {
        const wasDemo = DB.meta().mode === 'demo';
        if (wasDemo) { DB.reset('user'); FORGE.photos.clear(); } else DB.setMeta({ mode: 'user' });
        const u = DB.insert('users', { name: d.name.trim(), age: +d.age, sex: d.sex, height: +d.height, initial_weight: +d.weight, target_weight: +d.target, activity_level: 'ligero', initial_steps: +d.steps || 4000, goals: d.goals, equipment: d.equipment, diet_tags: d.diet, training_days: d.days.slice().sort(), train_hour: d.hour, seed: Math.floor(Math.random() * 1e6) });
        DB.setMeta({ program_start: U.mondayOf(U.today()), mode: 'user' });
        DB.insert('weight_logs', { user_id: u.id, date: U.today(), weight: +d.weight });
        const meas = {}; let any = false; ['waist', 'abdomen', 'chest', 'hip', 'neck', 'arm_right', 'arm_left', 'thigh_right', 'thigh_left'].forEach(k => { if (d[k] !== '') { meas[k] = +d[k]; any = true; } });
        if (any) DB.insert('body_measurements', { user_id: u.id, date: U.today(), weight: +d.weight, ...meas });
        FORGE.notifications.init(); const wk = DB.all('notifications').find(n => n.type === 'workout'); if (wk) { const [h, m] = d.hour.split(':').map(Number); const t = new Date(2000, 0, 1, h, m - 30); DB.update('notifications', wk.id, { scheduled_time: U.pad(t.getHours()) + ':' + U.pad(t.getMinutes()) }); }
        FORGE.nutrition.generateWeek(1);
        OB.step = 8; UI.render();
      }, 350 * msgs.length + 400);
    }
  };
  Object.assign(UI.actions, {
    'ob-next': () => { OB.err = OB.validate(); if (!OB.err) OB.step++; UI.render(); },
    'ob-prev': () => { OB.err = ''; OB.step--; UI.render(); },
    'ob-set': d => { OB.data[d.k] = d.v; UI.render(); },
    'ob-pill': d => { const a = OB.data[d.k]; const i = a.indexOf(d.v); i >= 0 ? a.splice(i, 1) : a.push(d.v); UI.render(); },
    'ob-day': d => { const v = +d.v; const a = OB.data.days; const i = a.indexOf(v); if (i >= 0) a.splice(i, 1); else if (a.length < 4) a.push(v); else UI.toast('Ya tienes 4 días elegidos. Quita uno para cambiarlo.'); UI.render(); },
    'ob-finish': () => { OB.step = 0; UI.go('hoy'); },
    'start-real': async () => { const ok = await UI.confirm('Empezar con mis datos', 'Se borrarán los datos de demostración y empezarás tu programa desde la semana 1 con tus propios registros.', 'Empezar'); if (!ok) return; DB.reset(null); await FORGE.photos.clear(); OB.step = 0; OB.data.name = ''; UI.render(); },
    'demo-load': () => { FORGE.demo.seed(); UI.go('hoy'); UI.toast('Datos de demostración cargados. Cuando quieras, empieza con tus datos desde HOY o PERFIL.'); }
  });
})();
</script>
<script>
/* ═══════════════════════════════════════════════
   FORGE · PANTALLA HOY (centro de la aplicación)
   ═══════════════════════════════════════════════ */
(function () {
  const U = FORGE.U, C = FORGE.CONFIG, DB = FORGE.db, UI = FORGE.ui, CP = FORGE.cp, I = FORGE.icons, e = U.esc;
  const PRG = FORGE.program, PR = FORGE.progress, NE = FORGE.nutrition, NO = FORGE.notifications, PE = FORGE.progression;

  const greeting = () => { const h = new Date().getHours(); return h < 6 ? 'Buenas noches' : h < 13 ? 'Buenos días' : h < 20 ? 'Buenas tardes' : 'Buenas noches'; };

  UI.screens.hoy = {
    render(view, p) {
      if (view === 'avisos') return this.avisos(p);
      const u = DB.user(); const t = U.today(); const w = PRG.week(), d = PRG.dayOfWeek();
      const demo = DB.meta().mode === 'demo'; const T = FORGE.tabIcons;
      const st = PR.weightStats(); const plan = NO.todayPlan(); const nplan = NE.planFor(w);
      const act = PR.activity(t) || { steps: 0, water: 0 }; const goalSteps = PRG.stepsGoal(w);
      const done = plan.workout && PR.workoutDoneToday(plan.workout.id);
      const cardioDone = plan.cardio && DB.where('cardio_logs', c => c.date === t).length > 0;
      const next = NE.nextMeal(t); const intake = NE.dayIntake(t);
      const wk = st ? st.weekly : null; const waist = PR.measureWeekDelta('waist', w) ?? (PR.measureDelta('waist') || {}).delta; const str = PE.weeklyStrength(w) ?? (PE.strengthIndex().ok ? PE.strengthIndex().pct : null);
      const block = FORGE.blockForWeek(w); const recs = PR.recommendations();
      const isSunday = U.dow(t) === 0; const checkin = DB.where('checkins', c => c.week === w && (c.cycle || 1) === PRG.cycle())[0];
      const weightToday = DB.where('weight_logs', x => x.date === t)[0];
      const cur = st ? (st.avg7 ?? st.current) : u.initial_weight; const pct = st ? st.pct : 0;
      const ad = PR.adherence(w); const days = (u.training_days || C.DEFAULT_TRAINING_DAYS).length; const wDone = PR.workoutsInWeek(w).length;
      const unread = NO.unread(); const quote = FORGE.QUOTES[U.diffDays('2026-01-05', t) % FORGE.QUOTES.length];
      const restN = DB.all('notifications').find(n => n.type === 'rest'); const trainN = u.train_hour || '18:00';
      const lastAlerts = DB.all('alerts').filter(a => !a.read).sort((a, b) => a.at < b.at ? 1 : -1).slice(0, 2);

      const head = `<div class="head" style="align-items:flex-start"><div><h1 style="font-family:var(--font-body);text-transform:none;font-size:var(--fs-2xl);font-weight:600;letter-spacing:0">Hola, ${e(u.name)}</h1><div class="sub">Disciplina hoy, resultados mañana</div></div><button class="ringbtn" data-act="go" data-tab="hoy" data-view="avisos" aria-label="Avisos">${I.bell}${unread ? `<span class="badge">${unread}</span>` : ''}</button></div>`;

      const weekCard = `<div class="panel"><div class="eyebrow" style="margin-bottom:12px">Tu progreso esta semana</div><div class="weekcard">${CP.ProgressRing({ pct: ad.total || 0, big: `${U.int(ad.total || 0)}%`, size: 108 })}<div class="stats">
        <div>${T.train}<div><b class="num">${wDone}/${days}</b><span>Entrenamientos</span></div></div>
        <div>${T.steps}<div><b class="num">${U.int(PR.stepsAvg(w))}</b><span>Pasos diarios</span></div></div>
        <div>${T.scale}<div><b class="num">${wk != null ? U.sign(wk, 1, ' kg') : '—'}</b><span>Esta semana</span></div></div>
      </div></div></div>`;

      const goal = `<div class="hero" style="padding:18px 20px"><div class="row between"><div class="eyebrow">Tu objetivo</div><span class="chip accent">${PRG.cycle() > 1 ? `C${PRG.cycle()} · ` : ''}Semana ${Math.min(w, C.PROGRAM_WEEKS)} · Día ${d}</span></div>
        <div class="row between" style="margin-top:8px;align-items:flex-end"><div class="big" style="font-size:var(--fs-3xl)">${U.n(cur)}<span style="font-size:var(--fs-lg);color:var(--text-2);font-family:var(--font-body);font-weight:500;margin-left:6px">kg</span></div><div class="t2 num" style="font-size:var(--fs-sm)">${U.n(u.initial_weight, 0)} → ${U.n(u.target_weight, 0)} kg</div></div>
        <div style="margin:10px 0 6px">${CP.ProgressBar(pct, '', true)}</div>
        <div class="row between" style="font-size:var(--fs-sm)"><span class="t2 num">${U.int(pct)}% completado</span><span class="t2 num">${st && st.remaining > 0 ? `faltan ${U.n(st.remaining)} kg` : st ? 'objetivo alcanzado' : ''}</span></div>
        <div style="margin-top:12px">${weightToday ? `<button class="btn ghost sm pill" data-act="weight-sheet">Peso de hoy: ${U.kg(weightToday.weight)} · editar</button>` : `<button class="btn primary sm pill" data-act="weight-sheet">Registrar peso de hoy</button>`}</div></div>`;

      const trainRow = plan.workout
        ? CP.AgendaRow({ icon: 'train', title: 'Entrenamiento', sub: `${plan.workout.name} · ${plan.workout.duration} min${done ? ' · completado' : ''}`, right: done ? '✓' : trainN, tab: 'entrenar', view: 'workout', params: { id: plan.workout.id }, done })
        : plan.rest ? CP.AgendaRow({ icon: 'heart', kind: 'blue', title: 'Descanso activo', sub: 'Pasea, hidrátate y revisa tu semana', right: '', tab: 'progreso', view: 'semana' })
          : CP.AgendaRow({ icon: 'heart', title: plan.cardio.name, sub: `${plan.cardio.detail}${cardioDone ? ' · registrado' : ''}`, right: cardioDone ? '✓' : `${plan.cardio.minutes} min`, tab: 'entrenar', view: 'cardio', done: cardioDone });
      const mealRow = CP.AgendaRow({ icon: 'food', title: next ? C.MEAL_LABEL[next.meal_type] : 'Comidas', sub: next ? FORGE.recipe(next.recipe_id).name : `${intake.n}/4 registradas · ${U.int(intake.calories)} kcal`, right: next ? NE.mealTime(next.meal_type) : '✓', tab: 'nutricion', done: !next && intake.n >= 4 });
      const waterRow = `<div class="arow" style="cursor:default"><div class="ring-ico sm ${act.water >= NE.waterGoal() ? 'done' : ''}">${act.water >= NE.waterGoal() ? T.check : T.drop}</div><div class="b"><b>Agua</b><span>Llevas ${U.n(act.water || 0, 1)} L de ${U.n(NE.waterGoal(), 1)} L</span><div style="margin-top:6px;max-width:220px">${CP.ProgressBar(Math.min(100, (act.water || 0) / NE.waterGoal() * 100))}</div></div><div class="row" style="gap:6px"><button class="iconbtn" data-act="water" data-d="-0.25" aria-label="Quitar 250 ml">${I.minus}</button><button class="iconbtn" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent)" data-act="water" data-d="0.25" aria-label="Añadir 250 ml">${I.plus}</button></div></div>`;
      const stepsRow = `<div class="arow" data-act="steps-sheet"><div class="ring-ico sm ${act.steps >= goalSteps ? 'done' : ''}">${act.steps >= goalSteps ? T.check : T.steps}</div><div class="b"><b>Pasos</b><span>${U.int(act.steps)} de ${U.int(goalSteps)}</span><div style="margin-top:6px;max-width:220px">${CP.ProgressBar(Math.min(100, act.steps / goalSteps * 100), act.steps >= goalSteps ? 'good' : '')}</div></div><div class="r num">${U.int(Math.min(100, act.steps / goalSteps * 100))}%</div></div>`;
      const restRow = CP.AgendaRow({ icon: 'moon', kind: 'blue', title: 'Descanso', sub: 'A dormir en 8 h · recuperar es entrenar', right: restN ? restN.scheduled_time : '22:30', tab: 'perfil', view: 'ayuda' });
      const agenda = `<div class="section"><div class="section-title"><h2>Hoy</h2><span class="eyebrow">${U.fmtDate(t, true)}</span></div><div class="panel tight"><div class="agenda">${trainRow}${mealRow}${waterRow}${stepsRow}${restRow}</div></div>
        ${plan.workout && !done ? `<button class="btn primary big block display" style="margin-top:12px" data-act="session-start" data-id="${plan.workout.id}">Comenzar entrenamiento</button>` : next ? `<div class="row" style="margin-top:10px;gap:8px"><button class="btn ghost sm pill" style="flex:1" data-act="meal-log" data-meal="${next.id}" data-date="${t}">He comido: ${e(C.MEAL_LABEL[next.meal_type].toLowerCase())}</button><button class="btn ghost sm pill" data-act="free-meal" data-date="${t}">Otra cosa</button></div>` : ''}</div>`;

      const alertsBox = lastAlerts.length ? `<div class="section"><div class="section-title"><h2>Avisos</h2><button class="btn quiet sm" data-act="go" data-tab="hoy" data-view="avisos">Ver todos ${I.chevron.replace('<svg', '<svg style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2"')}</button></div><div class="stack">${lastAlerts.map(a => CP.AlertCard(a)).join('')}</div></div>` : '';

      const progress = `<div class="section"><div class="section-title"><h2>Progreso</h2><button class="btn quiet sm" data-act="go" data-tab="progreso">Ver todo ${I.chevron.replace('<svg', '<svg style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2"')}</button></div><div class="grid3">
        ${CP.MetricCard({ label: 'Peso', value: wk != null ? U.sign(wk, 1) : '—', unit: wk != null ? 'kg' : '', deltaCls: wk < 0 ? 'good' : 't2', delta: wk != null ? 'esta semana' : 'faltan registros' })}
        ${CP.MetricCard({ label: 'Cintura', value: waist != null ? U.sign(waist, 1) : '—', unit: waist != null ? 'cm' : '', deltaCls: waist < 0 ? 'good' : 't2', delta: waist != null ? (waist < 0 ? '↓ mejorando' : 'estable') : 'sin medidas' })}
        ${CP.MetricCard({ label: 'Fuerza', value: str != null ? U.pct(str) : '—', deltaCls: str > 0 ? 'good' : 't2', delta: str != null ? (str > 0 ? '↑ e1RM' : 'estable') : '3 sesiones mín.' })}
      </div></div>`;
      const recBox = recs.length ? `<div class="section"><div class="section-title"><h2>Tu entrenador</h2></div><div class="stack">${recs.map(r => `<div class="banner ${r.kind === 'good' ? 'good' : r.kind === 'info' ? 'info' : ''}"><span>${e(r.text)}</span>${r.action ? `<button class="btn sm ghost pill" data-act="rec-apply" data-delta="${r.action.delta || ''}" data-steps="${r.action.steps || ''}">${e(r.action.label)}</button>` : ''}</div>`).join('')}</div></div>` : '';
      const sunday = isSunday ? `<div class="section"><div class="today-card" data-act="go" data-tab="progreso" data-view="semana"><div class="ring-ico">${T.trophy}</div><div class="body"><div class="eyebrow">Domingo</div><div class="t">Tu semana</div><div class="s">Revisión semanal lista${checkin ? '' : ' · cuéntanos cómo te sientes'}</div></div><div class="r">${I.chevron}</div></div></div>` : (!checkin && d >= 6 ? `<div class="section"><div class="banner info"><span>¿Cómo te sientes esta semana? Nos ayuda a ajustar el volumen.</span><button class="btn sm ghost pill" data-act="go" data-tab="progreso" data-view="semana">Responder</button></div></div>` : '');
      const finished = PRG.finished(); const deload = PE.isDeload(w);
      const cycleBox = finished ? `<div class="hero" style="margin-bottom:16px"><div class="eyebrow accent">Ciclo ${PRG.cycle()} completado</div><h2 style="font-size:var(--fs-2xl);margin:6px 0">Has terminado las 12 semanas</h2><p class="t2" style="font-size:var(--fs-sm)">${st ? `Peso ${U.sign(st.total, 1, ' kg')} · ` : ''}${PE.strengthIndex().ok ? `fuerza ${U.pct(PE.strengthIndex().pct)} · ` : ''}${DB.where('workout_logs', l => l.completed).length} entrenamientos. El siguiente ciclo arranca con tus cargas actuales, un nuevo bloque de base y objetivos recalculados.</p><div class="row" style="gap:8px;margin-top:12px"><button class="btn primary pill" data-act="new-cycle">Empezar ciclo ${PRG.cycle() + 1}</button><button class="btn ghost pill" data-act="go" data-tab="progreso" data-view="transformacion">Ver mi transformación</button></div></div>` : '';
      const deloadBox = deload && !finished ? `<div class="banner info" style="margin-bottom:16px"><span><b>Semana de descarga.</b> Menos series y cargas al 90 %: recupera para atacar el siguiente bloque con fuerza.</span></div>` : '';
      const demoBanner = demo ? `<div class="banner col" style="margin-bottom:16px"><span><span class="chip demo">Demo</span>Estás viendo datos de demostración (4 semanas simuladas).</span><button class="btn sm primary pill" data-act="start-real">Empezar con mis datos</button></div>` : '';

      return `<div class="screen wide">${head}${demoBanner}${cycleBox}${deloadBox}<div class="desk-grid">
        <div class="c4">${weekCard}<div style="margin-top:14px" class="quote">“${e(quote)}”</div><div style="margin-top:14px">${goal}</div></div>
        <div class="c4">${agenda}${sunday}${alertsBox}</div>
        <div class="c4">${progress}${recBox}<div class="section"><div class="section-title"><h2>Semana ${w}</h2><span class="eyebrow">${e(block.name)}</span></div>${UI.screens.hoy.weekStrip(w)}</div></div>
      </div></div>`;
    },
    avisos(p) {
      const f = (p && p.f) || 'todas'; const all = DB.all('alerts').slice().sort((a, b) => a.at < b.at ? 1 : -1);
      const cat = a => ({ workout: 'entreno', pr: 'entreno', meal_comida: 'nutricion', meal_cena: 'nutricion', water: 'nutricion' }[a.type] || 'sistema');
      const list = all.filter(a => f === 'todas' || cat(a) === f);
      const t = U.today(), y = U.addDays(t, -1);
      const groups = [['Hoy', list.filter(a => a.date === t)], ['Ayer', list.filter(a => a.date === y)], ['Esta semana', list.filter(a => a.date < y)]].filter(g => g[1].length);
      const filters = [['todas', 'Todas'], ['entreno', 'Entrenamiento'], ['nutricion', 'Nutrición'], ['sistema', 'Sistema']];
      setTimeout(() => NO.markAllRead(), 800);
      return `<div class="screen">${UI.backBtn('Inicio')}${UI.header('Avisos', `${all.length} notificaciones`, all.length ? `<button class="btn quiet sm" data-act="alerts-clear">Borrar todo</button>` : '')}
        <div class="pills" style="margin-bottom:14px">${filters.map(([k, l]) => `<button class="pill${f === k ? ' on' : ''}" data-act="go" data-tab="hoy" data-view="avisos" data-params='{"f":"${k}"}'>${l}</button>`).join('')}</div>
        ${groups.length ? groups.map(([n, arr]) => `<div class="section" style="margin-top:8px"><div class="eyebrow" style="margin-bottom:8px">${n}</div><div class="stack">${arr.map(a => CP.AlertCard(a)).join('')}</div></div>`).join('') : CP.Empty('Sin avisos', 'Aquí aparecerán los recordatorios de entrenamiento, comidas, agua, peso y logros. Configúralos en Perfil → Notificaciones.', '<button class="btn ghost pill" data-act="go" data-tab="perfil" data-view="notificaciones">Configurar avisos</button>')}
        <p class="muted" style="font-size:var(--fs-xs);margin-top:16px;text-align:center;letter-spacing:.1em;text-transform:uppercase">Pequeños avisos · grandes resultados</p></div>`;
    },
    weekStrip(w) {
      const ds = PRG.weekDates(w); const t = U.today();
      return `<div class="week-row">${ds.map(dt => { const p = NO.todayPlan(dt); const done = p.workout ? !!PR.workoutDoneToday(p.workout.id, dt) : p.cardio ? DB.where('cardio_logs', c => c.date === dt).length > 0 : false; const lbl = p.workout ? p.workout.id : p.cardio ? (p.cardio.id === 'CI' ? 'INT' : 'CAR') : 'DES'; return `<div class="${done ? 'done' : ''}${dt === t ? ' today' : ''}"><b>${lbl}</b><span>${C.DOW[U.dow(dt)]}</span></div>`; }).join('')}</div>`;
    }
  };

  /* Hoja rápida de PESO (una mano, dos toques) */
  UI.actions['weight-sheet'] = () => {
    const t = U.today(); const last = PR.weights().slice(-1)[0]; const today = DB.where('weight_logs', x => x.date === t)[0];
    const v = today ? today.weight : last ? last.weight : DB.user().initial_weight;
    UI.sheet(`<h2>Registrar peso</h2><p class="t2" style="font-size:var(--fs-sm)">${U.fmtDate(t, true)} · mejor en ayunas, misma hora.</p><div style="margin:16px 0"><input class="bigin" id="w-in" type="number" inputmode="decimal" step="0.1" value="${v}"><div class="row" style="justify-content:center;gap:8px;margin-top:10px">${[-0.5, -0.1, 0.1, 0.5].map(d => `<button class="btn ghost sm" data-wd="${d}">${d > 0 ? '+' : ''}${U.n(d, 1)}</button>`).join('')}</div><div class="err" id="w-err" style="text-align:center;margin-top:8px;color:var(--bad);font-size:var(--fs-xs)"></div></div><button class="btn primary big block display" id="w-save">Guardar</button>${today ? `<button class="btn quiet block" id="w-del" style="margin-top:6px">Eliminar registro de hoy</button>` : ''}`, bg => {
      const inp = bg.querySelector('#w-in'); inp.focus(); inp.select();
      bg.querySelectorAll('[data-wd]').forEach(b => b.onclick = () => { inp.value = (Math.round((parseFloat(inp.value.replace(',', '.')) + +b.dataset.wd) * 10) / 10).toFixed(1); });
      const save = () => { const r = FORGE.validate.weight(inp.value.replace(',', '.')); if (!r.ok) { bg.querySelector('#w-err').textContent = r.msg; return; } DB.upsert('weight_logs', x => x.date === t, { user_id: DB.user().id, date: t, weight: Math.round(r.value * 10) / 10 }); UI.closeSheet(); const news = PR.checkAchievements(); UI.toast(`Peso guardado: ${U.kg(r.value)}`, 'good'); news.forEach(a => setTimeout(() => NO.push('Logro desbloqueado', a.name, { type: 'pr', category: 'Logro', icon: 'trophy', action: { label: 'Ver logros', tab: 'progreso', view: 'logros' } }), 900)); UI.render(); };
      bg.querySelector('#w-save').onclick = save; inp.addEventListener('keydown', ev => ev.key === 'Enter' && save());
      const del = bg.querySelector('#w-del'); if (del) del.onclick = () => { DB.remove('weight_logs', today.id); UI.closeSheet(); UI.render(); };
    });
  };
  UI.actions['steps-sheet'] = () => {
    const t = U.today(); const a = PR.activity(t) || {}; const w = PRG.week();
    UI.sheet(`<h2>Pasos de hoy</h2><p class="t2" style="font-size:var(--fs-sm)">Objetivo semana ${w}: ${U.int(PRG.stepsGoal(w))} pasos. Copia el total de tu móvil o reloj.</p><div style="margin:16px 0"><input class="bigin" id="s-in" type="number" inputmode="numeric" value="${a.steps || ''}" placeholder="0"><div class="row" style="justify-content:center;gap:8px;margin-top:10px">${[500, 1000, 2000].map(d => `<button class="btn ghost sm" data-sd="${d}">+${U.int(d)}</button>`).join('')}</div><div id="s-err" style="text-align:center;margin-top:8px;color:var(--bad);font-size:var(--fs-xs)"></div></div><button class="btn primary big block display" id="s-save">Guardar</button><div class="divider"></div><div class="field"><label>Objetivo de pasos de esta semana</label><div class="row"><input type="number" inputmode="numeric" id="s-goal" value="${PRG.stepsGoal(w)}"><button class="btn ghost" id="s-goal-save">Cambiar</button></div></div>`, bg => {
      const inp = bg.querySelector('#s-in'); inp.focus();
      bg.querySelectorAll('[data-sd]').forEach(b => b.onclick = () => inp.value = (parseInt(inp.value || 0) + +b.dataset.sd));
      bg.querySelector('#s-save').onclick = () => { const r = FORGE.validate.steps(inp.value); if (!r.ok) { bg.querySelector('#s-err').textContent = r.msg; return; } PR.setActivity(t, { steps: Math.round(r.value) }); UI.closeSheet(); PR.checkAchievements(); UI.toast(`${U.int(r.value)} pasos registrados`, 'good'); UI.render(); };
      bg.querySelector('#s-goal-save').onclick = () => { const r = FORGE.validate.steps(bg.querySelector('#s-goal').value); if (!r.ok || r.value < 1000) { UI.toast('Objetivo no válido', 'bad'); return; } const u = DB.user(); const o = u.steps_override || {}; o[PRG.cycle() > 1 ? PRG.cycle() + ':' + w : w] = Math.round(r.value); DB.update('users', u.id, { steps_override: o }); UI.closeSheet(); UI.render(); UI.toast('Objetivo actualizado'); };
    });
  };
  UI.actions['new-cycle'] = async () => {
    if (!await UI.confirm(`Empezar ciclo ${PRG.cycle() + 1}`, 'Se inicia un programa nuevo de 12 semanas desde hoy. Tu historial, marcas y fotos se conservan; las cargas parten de lo que levantas ahora y el objetivo de pasos no baja del nivel que ya tienes.', 'Empezar')) return;
    const w = PRG.week(); const floor = Math.round(Math.min(12000, Math.max(8000, PR.stepsAvg(Math.min(w, 12)) || 0)) / 500) * 500;
    DB.setMeta({ program_start: U.mondayOf(U.today()), cycle: PRG.cycle() + 1, accepted_loads: {}, steps_floor: floor });
    const u = DB.user(); DB.update('users', u.id, { steps_override: {} });
    NE.generateWeek(1); UI.toast(`Ciclo ${PRG.cycle()} iniciado`, 'good'); UI.go('hoy');
  };
  UI.actions.water = d => { const t = U.today(); const a = PR.activity(t) || { water: 0 }; const v = U.clamp(Math.round(((a.water || 0) + +d.d) * 100) / 100, 0, C.LIMITS.water[1]); PR.setActivity(t, { water: v }); UI.render(); };
  UI.actions['rec-apply'] = async d => {
    if (d.delta) { const ok = await UI.confirm('Ajustar calorías', `Se aplicará ${d.delta > 0 ? '+' : ''}${d.delta} kcal al plan de esta semana y las siguientes. Tú decides: nada cambia sin tu confirmación.`, 'Aplicar'); if (!ok) return; NE.adjustCalories(+d.delta); DB.setMeta({ rec_applied: U.today() }); UI.toast('Plan de calorías actualizado', 'good'); }
    if (d.steps) { const u = DB.user(); const o = u.steps_override || {}; o[PRG.cycle() > 1 ? PRG.cycle() + ':' + PRG.week() : PRG.week()] = +d.steps; DB.update('users', u.id, { steps_override: o }); UI.toast('Objetivo de pasos actualizado', 'good'); }
    UI.render();
  };
})();
</script>
<script>
/* ═══════════════════════════════════════════════
   FORGE · ENTRENAR: programa, detalle, MODO SESIÓN, cardio
   ═══════════════════════════════════════════════ */
(function () {
  const U = FORGE.U, C = FORGE.CONFIG, DB = FORGE.db, UI = FORGE.ui, CP = FORGE.cp, I = FORGE.icons, e = U.esc;
  const PRG = FORGE.program, PR = FORGE.progress, PE = FORGE.progression, NO = FORGE.notifications;
  const fmtTime = s => U.pad(Math.floor(s / 60)) + ':' + U.pad(s % 60);

  UI.screens.entrenar = {
    render(view, p) {
      if (view === 'workout') return this.workout(p.id);
      if (view === 'cardio') return this.cardio();
      if (view === 'log') return this.log(p.id);
      const w = PRG.week(); const block = FORGE.blockForWeek(w); const plan = NO.todayPlan(); const u = DB.user();
      const days = u.training_days || C.DEFAULT_TRAINING_DAYS;
      const list = FORGE.PROGRAM.workouts.map((wo, i) => { const done = PR.workoutsInWeek(w).find(l => l.workout_id === wo.id); const tpl = FORGE.workoutTemplate(wo.id, w); return `<div class="today-card" data-act="go" data-tab="entrenar" data-view="workout" data-params='{"id":"${wo.id}"}'><div class="ico ${done ? 'good' : plan.workout && plan.workout.id === wo.id ? 'accent' : ''}">${done ? I.check : I.train}</div><div class="body"><div class="eyebrow">${C.DOW_LONG[days[i] % 7]}${done ? ' · completado' : ''}</div><div class="t">${e(wo.name)}</div><div class="s">${e(wo.subtitle)} · ${tpl.exercises.length} ejercicios</div></div><div class="r">${wo.duration}<small>min</small></div></div>`; }).join('');
      const cm = FORGE.PROGRAM.cardio;
      const cardio = `<div class="today-card" data-act="go" data-tab="entrenar" data-view="cardio"><div class="ico">${I.heart}</div><div class="body"><div class="eyebrow">Cardio</div><div class="t">Moderado · Intervalos</div><div class="s">${cm.moderate.minutesByWeek[Math.min(w, 12) - 1]} min zona 2 · ${e(cm.intervals.byWeek[Math.min(w, 12) - 1])}</div></div><div class="r">${I.chevron}</div></div>`;
      const logs = DB.all('workout_logs').filter(l => l.completed).sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 8);
      const hist = logs.length ? `<div class="list">${logs.map(l => { const wo = FORGE.PROGRAM.workouts.find(x => x.id === l.workout_id); const sets = DB.where('set_logs', s => s.workout_log_id === l.id && s.completed); const vol = U.sum(sets.map(s => s.weight * s.reps)); return `<div class="row between" data-act="go" data-tab="entrenar" data-view="log" data-params='{"id":"${l.id}"}' style="cursor:pointer"><div><b>${e(wo ? wo.name : l.workout_id)}</b><div class="t2" style="font-size:var(--fs-sm)">${U.fmtDate(l.date, true)} · ${l.duration || '—'} min · ${sets.length} series</div></div><div class="num t2" style="font-size:var(--fs-sm)">${U.int(vol)} kg</div></div>`; }).join('')}</div>` : CP.Empty('Sin sesiones todavía', 'Tu primera sesión fija las cargas iniciales. Después, FORGE calcula la progresión.');
      return `<div class="screen">${UI.header('Entrenar', `Semana ${w} · ${e(block.name)}`)}<p class="t2" style="font-size:var(--fs-sm);margin:-8px 0 16px">${e(block.focus)}</p>${UI.screens.hoy.weekStrip(w)}
        ${plan.workout && !PR.workoutDoneToday(plan.workout.id) ? `<button class="btn primary big block display" style="margin-top:16px" data-act="session-start" data-id="${plan.workout.id}">Empezar ${e(plan.workout.name)}</button>` : ''}
        <div class="section"><div class="section-title"><h2>Programa</h2><span class="eyebrow">4 días</span></div><div class="stack">${list}${cardio}</div></div>
        <div class="section"><div class="section-title"><h2>Historial</h2></div>${hist}</div></div>`;
    },
    workout(id) {
      const w = PRG.week(); const plan = PE.plan(id, w); if (!plan) return `<div class="screen">${CP.Empty('No encontrado', '')}</div>`;
      const done = PR.workoutDoneToday(id); const pending = plan.exercises.filter(x => x.suggestion.status !== 'first' && x.suggestion.status !== 'keep' && !x.accepted);
      const firstTime = plan.exercises.some(x => x.suggestion.status === 'first');
      const isToday = NO.todayPlan().workout && NO.todayPlan().workout.id === id;
      return `<div class="screen">${UI.backBtn('Entrenar')}<div class="hero-train"><div class="eyebrow accent">${isToday ? 'Hoy toca' : 'Sesión'}</div><div class="ttl">${e(plan.name)}</div><div class="t2" style="margin-top:6px">${e(plan.subtitle)} · ${plan.duration} min · bloque ${FORGE.blockForWeek(w).index + 1}</div><p class="t2" style="font-size:var(--fs-sm);margin-top:8px;max-width:420px">${e(FORGE.blockForWeek(w).focus)}</p>${done ? '' : `<button class="btn primary big block display" style="margin-top:16px" data-act="session-start" data-id="${id}">Comenzar entrenamiento</button>`}</div><div style="height:16px"></div>
        ${plan.deload ? `<div class="banner info" style="margin-bottom:12px"><span><b>Semana de descarga:</b> series reducidas y cargas al 90 %. No cuenta para la progresión.</span></div>` : ''}
        ${plan.fatigueAdjusted ? `<div class="banner" style="margin-bottom:12px"><span>Fatiga alta esta semana: accesorios con una serie menos, básicos intactos.</span></div>` : ''}
        ${firstTime ? `<div class="banner info" style="margin-bottom:12px"><span>Primera vez con algunos ejercicios: introduce el peso que uses durante la sesión. No inventamos tus cargas.</span></div>` : ''}
        ${pending.length ? `<div class="banner info" style="margin-bottom:12px"><span>${pending.length} recomendaciones de carga pendientes de confirmar. Toca cada ejercicio para aceptarlas o mantener el peso anterior.</span></div>` : ''}
        <div class="exlist">${plan.exercises.map((x, i) => CP.ExerciseCard(x, i, false)).join('')}</div>
        <div style="margin-top:20px">${done ? `<div class="banner good"><span>Sesión completada hoy ✓</span><button class="btn sm ghost pill" data-act="go" data-tab="entrenar" data-view="log" data-params='{"id":"${done.id}"}'>Ver resumen</button></div>` : ''}</div>
        <p class="muted" style="font-size:var(--fs-xs);margin-top:12px;text-align:center">FORGE recomienda; tú confirmas. Nunca cambiamos un peso programado sin tu aprobación.</p></div>`;
    },
    log(id) {
      const l = DB.get('workout_logs', id); if (!l) return `<div class="screen">${CP.Empty('Sesión no encontrada', '')}</div>`;
      const wo = FORGE.PROGRAM.workouts.find(x => x.id === l.workout_id); const sets = DB.where('set_logs', s => s.workout_log_id === id);
      const byEx = {}; sets.forEach(s => (byEx[s.exercise_id] = byEx[s.exercise_id] || []).push(s));
      return `<div class="screen">${UI.backBtn('Entrenar')}${UI.header(wo ? wo.name : l.workout_id, U.fmtDate(l.date, true))}
        <div class="grid3">${CP.MetricCard({ label: 'Duración', value: l.duration || '—', unit: 'min' })}${CP.MetricCard({ label: 'Series', value: sets.filter(s => s.completed).length })}${CP.MetricCard({ label: 'Volumen', value: U.int(U.sum(sets.map(s => s.weight * s.reps))), unit: 'kg' })}</div>
        <div class="section">${Object.entries(byEx).map(([ex, ss]) => `<div class="panel tight" style="margin-bottom:8px"><b>${e(FORGE.exercise(ex).name)}</b>${ss[0].rpe ? `<span class="muted" style="font-size:var(--fs-xs)"> · RPE ${ss[0].rpe}</span>` : ''}<div class="pills" style="margin-top:8px">${ss.map(s => `<button class="pill num" data-act="set-edit" data-id="${s.id}">${U.kg(s.weight)} × ${s.reps}${s.rir != null ? ` · RIR ${s.rir}` : ''}</button>`).join('')}</div><p class="muted" style="font-size:var(--fs-xs);margin-top:6px">Toca una serie para corregirla.</p>${ss[0].notes ? `<div class="muted" style="font-size:var(--fs-xs);margin-top:4px">${e(ss[0].notes)}</div>` : ''}</div>`).join('')}</div>
        ${l.notes ? `<p class="t2" style="font-size:var(--fs-sm)">${e(l.notes)}</p>` : ''}
        <button class="btn danger block" style="margin-top:16px" data-act="log-delete" data-id="${id}">Eliminar esta sesión</button></div>`;
    },
    cardio() {
      const w = Math.min(PRG.week(), 12); const cm = FORGE.PROGRAM.cardio; const t = U.today(); const logs = DB.all('cardio_logs').sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 6);
      const [n, wk, rs] = cm.intervals.sets[w - 1]; const T = FORGE.tabIcons; const total = Math.round((cm.intervals.warm + cm.intervals.cool + n * (wk + rs)) / 60);
      const plan = NO.todayPlan(); const todayIs = plan.cardio ? plan.cardio.id : null;
      return `<div class="screen">${UI.backBtn('Entrenar')}${UI.header('Cardio', `Semana ${w} · ${PE.isDeload(PRG.week()) ? 'descarga: solo suave' : 'moderado e intervalos'}`)}
        <div class="stack">
          <div class="panel"><div class="row" style="gap:14px"><div class="ring-ico ${todayIs === 'CM' ? '' : 'muted'}">${T.heart}</div><div style="flex:1"><div class="eyebrow ${todayIs === 'CM' ? 'accent' : ''}">${todayIs === 'CM' ? 'Hoy toca' : 'Cardio moderado'}</div><div class="display" style="font-size:var(--fs-xl)">${cm.moderate.minutesByWeek[w - 1]} min en zona 2</div></div></div><p class="t2" style="font-size:var(--fs-sm);margin-top:10px">Ritmo en el que puedes hablar: andar rápido, bici o elíptica. Registra la sesión al terminar.</p></div>

          <div class="grid2">${UI.field('FC media (ppm)', '<input type="number" inputmode="numeric" id="c-hr" placeholder="opcional">')}${UI.field('RPE (1-10)', '<input type="number" inputmode="numeric" id="c-rpe" min="1" max="10" placeholder="6">')}</div>
          ${UI.field('Fecha', `<input type="date" id="c-date" value="${t}" max="${t}">`)}
          <div id="c-err" class="bad" style="font-size:var(--fs-xs)"></div>
          <button class="btn primary block display" data-act="cardio-save">Guardar cardio</button></div></div></div>
        <div class="section"><div class="section-title"><h2>Últimos registros</h2></div>${logs.length ? `<div class="panel tight"><div class="agenda">${logs.map(l => `<div class="arow" style="cursor:default"><div class="ring-ico sm muted">${l.type === 'intervalos' ? T.train : T.heart}</div><div class="b"><b>${l.type === 'intervalos' ? 'Intervalos' : 'Cardio moderado'}</b><span>${U.fmtDate(l.date, true)} · ${l.duration} min${l.distance ? ` · ${U.n(l.distance)} km · ${l.pace}` : ''}${l.hr ? ` · ${l.hr} ppm` : ''}${l.rpe ? ` · RPE ${l.rpe}` : ''}</span></div><button class="btn quiet sm" data-act="cardio-del" data-id="${l.id}">${I.close.replace('<svg', '<svg style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2"')}</button></div>`).join('')}</div></div>` : CP.Empty('Sin cardio registrado', 'Registra tus sesiones para completar tu semana.')}</div></div>`;
    },
    after(view) { if (view === 'cardio') { const seg = document.getElementById('c-type'); seg.querySelectorAll('button').forEach(b => b.onclick = () => { seg.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); }); } }
  };

  Object.assign(UI.actions, {
    'cardio-save': () => {
      const type = document.querySelector('#c-type .on').dataset.v; const min = FORGE.validate.cardioMin(UI.val('#c-min')); const date = FORGE.validate.date(UI.val('#c-date')); const err = document.getElementById('c-err');
      if (!min.ok || min.value <= 0) { err.textContent = min.ok ? 'La duración debe ser mayor que 0.' : min.msg; return; } if (!date.ok) { err.textContent = date.msg; return; }
      const km = parseFloat(UI.val('#c-km')) || null; const hr = parseInt(UI.val('#c-hr')) || null; const rpe = parseInt(UI.val('#c-rpe')) || null;
      if (km != null && (km < 0 || km > 200)) { err.textContent = 'Distancia no válida.'; return; } if (hr != null && (hr < 30 || hr > 240)) { err.textContent = 'Frecuencia cardíaca no válida.'; return; } if (rpe != null && (rpe < 1 || rpe > 10)) { err.textContent = 'RPE entre 1 y 10.'; return; }
      const pace = km ? (() => { const s = min.value * 60 / km; return Math.floor(s / 60) + ':' + U.pad(Math.round(s % 60)) + ' min/km'; })() : null;
      DB.insert('cardio_logs', { user_id: DB.user().id, date: date.value, type, duration: min.value, distance: km, pace, hr, rpe });
      const a = PR.activity(date.value) || {}; PR.setActivity(date.value, { cardio_minutes: (a.cardio_minutes || 0) + min.value });
      UI.toast('Cardio registrado', 'good'); UI.go('entrenar', 'cardio');
    },
    'cardio-del': async d => { if (await UI.confirm('Eliminar registro', 'Se eliminará este registro de cardio.', 'Eliminar', true)) { const l = DB.get('cardio_logs', d.id); DB.remove('cardio_logs', d.id); if (l) { const a = PR.activity(l.date); if (a) PR.setActivity(l.date, { cardio_minutes: Math.max(0, (a.cardio_minutes || 0) - l.duration) }); } UI.render(); } },
    'set-edit': d => {
      const s = DB.get('set_logs', d.id); if (!s) return; const ex = FORGE.exercise(s.exercise_id);
      UI.sheet(`<div class="eyebrow">${e(ex.name)} · serie ${s.set_number}</div><h2>Corregir serie</h2><div class="grid3" style="margin:12px 0">${UI.field('Peso (kg)', `<input type="number" inputmode="decimal" step="0.5" id="se-w" value="${s.weight}">`)}${UI.field('Reps', `<input type="number" inputmode="numeric" id="se-r" value="${s.reps}">`)}${UI.field('RIR', `<select id="se-rir"><option value="">—</option>${[0, 1, 2, 3].map(v => `<option value="${v}" ${s.rir === v ? 'selected' : ''}>${v === 3 ? '3+' : v}</option>`).join('')}</select>`)}</div><div id="se-err" class="bad" style="font-size:var(--fs-xs)"></div><div class="row" style="gap:8px;margin-top:8px"><button class="btn danger" id="se-del">Eliminar serie</button><button class="btn primary" style="flex:1" id="se-ok">Guardar</button></div>`, bg => {
        bg.querySelector('#se-ok').onclick = () => { const w = FORGE.validate.load(bg.querySelector('#se-w').value.replace(',', '.')), r = FORGE.validate.reps(bg.querySelector('#se-r').value); if (!w.ok) return bg.querySelector('#se-err').textContent = w.msg; if (!r.ok) return bg.querySelector('#se-err').textContent = r.msg; const rir = bg.querySelector('#se-rir').value; DB.update('set_logs', s.id, { weight: w.value, reps: r.value, rir: rir === '' ? null : +rir }); UI.closeSheet(); UI.toast('Serie corregida', 'good'); UI.render(); };
        bg.querySelector('#se-del').onclick = async () => { UI.closeSheet(); if (await UI.confirm('Eliminar serie', 'Se eliminará esta serie del registro.', 'Eliminar', true)) { DB.remove('set_logs', s.id); UI.render(); } };
      });
    },
    'log-delete': async d => { if (await UI.confirm('Eliminar sesión', 'Se eliminarán la sesión y todas sus series. Las recomendaciones de carga se recalcularán con el historial restante.', 'Eliminar', true)) { DB.removeWhere('set_logs', s => s.workout_log_id === d.id); DB.remove('workout_logs', d.id); UI.go('entrenar'); } },
    // Detalle de ejercicio + aceptar/mantener recomendación
    'ex-detail': d => {
      const w = PRG.week(); const id = UI.state.params.id || (FORGE.session.plan && FORGE.session.plan.id); const plan = PE.plan(id, w); const x = plan.exercises[+d.i]; const ex = x.exercise; const s = x.suggestion;
      const hist = PE.history(ex.id).slice(-3).reverse();
      const histHtml = hist.length ? hist.map(h => { const w0 = Math.max(...h.sets.map(q => q.weight || 0)); const rirs = h.sets.map(q => q.rir).filter(v => v != null); return `<div class="row between" style="font-size:var(--fs-sm);gap:8px"><span class="t2" style="flex:none;width:56px">${U.fmtDate(h.log.date)}</span><span class="num" style="flex:1">${ex.mode === 'load' ? `<b>${U.kg(w0)}</b> × ` : ''}${h.sets.map(q => q.reps).join('/')}${ex.mode === 'time' ? ' s' : ' reps'}</span><span class="muted num" style="flex:none">${rirs.length ? 'RIR ' + Math.min(...rirs) : ''}${h.sets[0].rpe ? ' · RPE ' + h.sets[0].rpe : ''}</span></div>`; }).join('') : '<div class="muted" style="font-size:var(--fs-sm)">Sin historial. Hoy fijas la carga inicial.</div>';
      const canChoose = ex.mode === 'load' && s.status !== 'first';
      UI.sheet(`<div class="eyebrow">${e(ex.muscle)} · ${e(ex.equipment)}</div><h2>${e(ex.name)}</h2><p class="t2" style="font-size:var(--fs-sm)">${e(ex.instructions)}</p><div class="divider"></div>

        <div class="field" style="margin-top:12px"><label>Otro peso (kg)</label><div class="row"><input type="number" inputmode="decimal" step="${ex.step || 0.5}" id="ex-custom" value="${x.weight ?? ''}"><button class="btn ghost" data-act="accept-custom" data-key="${x.acceptedKey}" data-i="${d.i}">Fijar</button></div></div>` : ''}
        <div class="divider"></div><div class="eyebrow">Últimas sesiones</div><div class="stack" style="margin-top:8px;gap:6px">${histHtml}</div>
        ${(() => { const alts = PE.alternatives(x.original_id || ex.id).filter(a => a.id !== ex.id); if (!alts.length && !x.swapped) return ''; return `<div class="divider"></div><div class="eyebrow">Sustituir ejercicio</div><p class="muted" style="font-size:var(--fs-xs);margin:4px 0 8px">Por lesión, equipo ocupado o preferencia. Trabaja el mismo patrón.</p><div class="pills">${alts.map(a => `<button class="pill" data-act="swap-ex" data-w="${id}" data-orig="${x.original_id || ex.id}" data-alt="${a.id}" data-i="${d.i}">${e(a.name)}</button>`).join('')}${x.swapped ? `<button class="pill" data-act="swap-ex" data-w="${id}" data-orig="${x.original_id}" data-alt="" data-i="${d.i}">Volver a ${e(FORGE.exercise(x.original_id).name)}</button>` : ''}</div>`; })()}`);

      PE.swapExercise(d.w, d.orig, alt.id, w, perm); UI.toast(`Sustituido por ${alt.name}`, 'good'); if (FORGE.session.active) FORGE.session.reloadPlan(); else UI.render();
    },
    'accept-load': d => { PE.acceptLoad(d.key, +d.w); UI.closeSheet(); UI.toast(`Carga fijada: ${U.kg(+d.w)}`, 'good'); if (FORGE.session.active) FORGE.session.reloadPlan(); else UI.render(); },
    'accept-custom': d => { const r = FORGE.validate.load(UI.val('#ex-custom')); if (!r.ok) { UI.toast(r.msg, 'bad'); return; } PE.acceptLoad(d.key, r.value); UI.closeSheet(); UI.toast(`Carga fijada: ${U.kg(r.value)}`, 'good'); if (FORGE.session.active) FORGE.session.reloadPlan(); else UI.render(); },

  /* ═══════ MODO SESIÓN (interfaz minimalista) ═══════ */
  const S = FORGE.session = {
    active: false, plan: null, log: null, exIdx: 0, setIdx: 0, phase: 'set', weight: 0, reps: 0, rest: 0, timer: null, startedAt: null, results: {}, wake: null,
    start(id) {
      const w = PRG.week(); S.plan = PE.plan(id, w); if (!S.plan) return;
      const partial = DB.where('workout_logs', l => !l.completed && l.date === U.today() && l.workout_id === id)[0];
      S.log = partial || DB.insert('workout_logs', { user_id: DB.user().id, workout_id: id, week: w, date: U.today(), duration: 0, completed: false, difficulty: null, notes: '' });
      S.active = true; S.startedAt = Date.now(); S.results = {}; S.exIdx = 0; S.setIdx = 0; S.phase = 'set';
      // Si había una sesión a medias hoy, retomar en el siguiente ejercicio sin series
      if (partial) { const done = DB.where('set_logs', s => s.workout_log_id === partial.id); S.plan.exercises.forEach((x, i) => { const n = done.filter(s => s.exercise_id === x.exercise_id).length; if (n >= x.sets && S.exIdx === i) S.exIdx = i + 1; }); if (S.exIdx >= S.plan.exercises.length) S.exIdx = S.plan.exercises.length - 1; }
      S.loadEx(); S.mount(); S.render();
      try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => S.wake = l).catch(() => { }); } catch { }
    },
